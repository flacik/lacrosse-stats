// SVG rendering of the lacrosse field — input mode (interactive) and viewer mode (read-only).

// ==================== INPUT MODE FIELD ====================

function buildFieldSvg(match) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'field');
  svg.setAttribute('id', 'field-svg');
  svg.setAttribute('viewBox', '0 0 1100 700');
  svg.setAttribute('xmlns', ns);

  // Side labels (top strip 50px)
  const A_left = APP.match.team_A_side === 'left';
  const sideLabels = svgEl('g');
  const leftLabel = svgEl('text', {
    x: 100, y: 35, 'font-size': 22, 'font-weight': 700,
    fill: A_left ? '#1d4ed8' : '#b91c1c'
  });
  leftLabel.textContent = `${A_left ? match.team_A : match.team_B} →`;
  sideLabels.appendChild(leftLabel);
  const rightLabel = svgEl('text', {
    x: 1000, y: 35, 'text-anchor': 'end',
    'font-size': 22, 'font-weight': 700,
    fill: A_left ? '#b91c1c' : '#1d4ed8'
  });
  rightLabel.textContent = `← ${A_left ? match.team_B : match.team_A}`;
  sideLabels.appendChild(rightLabel);
  svg.appendChild(sideLabels);

  const fieldG = svgEl('g', { transform: 'translate(0, 50)' });
  fieldG.appendChild(svgEl('rect', { x: 0, y: 0, width: 1100, height: 600, fill: '#9bbf85', class: 'field-bg' }));

  // Zone overlay (toggleable)
  if (APP.match.show_zones) {
    const zonesG = svgEl('g', { class: 'zone-overlay' });
    getZoneLayout().forEach(z => {
      const team = getTeamForHalf(z.half, APP.match.team_A_side);
      const color = ZONE_COLORS[`${team}-${z.zone}`] || '#888';
      zonesG.appendChild(svgEl('rect', {
        x: z.x, y: z.y, width: z.w, height: z.h, fill: color, class: 'zone-rect'
      }));
      const t = svgEl('text', {
        x: z.x + z.w / 2, y: z.y + z.h / 2 + 12, class: 'zone-label-team'
      });
      t.textContent = team;
      zonesG.appendChild(t);
    });
    fieldG.appendChild(zonesG);
  }

  // Field markings
  const markings = svgEl('g', { class: 'field-markings' });
  markings.innerHTML = `
    <line x1="550" y1="0" x2="550" y2="600" stroke="white" stroke-width="2"/>
    <line x1="540" y1="290" x2="560" y2="310" stroke="white" stroke-width="2"/>
    <line x1="540" y1="310" x2="560" y2="290" stroke="white" stroke-width="2"/>
    <line x1="150" y1="0" x2="150" y2="600" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="950" y1="0" x2="950" y2="600" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="350" y1="0" x2="350" y2="600" stroke="white" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.85"/>
    <line x1="750" y1="0" x2="750" y2="600" stroke="white" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.85"/>
    <rect x="0" y="0" width="1100" height="600" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="150" cy="300" r="30" fill="#9bbf85" stroke="white" stroke-width="2"/>
    <circle cx="950" cy="300" r="30" fill="#9bbf85" stroke="white" stroke-width="2"/>
    <line x1="150" y1="288" x2="150" y2="312" stroke="white" stroke-width="5"/>
    <line x1="950" y1="288" x2="950" y2="312" stroke="white" stroke-width="5"/>
  `;
  fieldG.appendChild(markings);

  if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.variant === 'field') {
    fieldG.appendChild(buildFieldLacrosseRozki(1100, 600));
  }

  // Markers (history dots) — convert attacker-relative to physical
  const markersG = svgEl('g');
  const events = eventsForMatch(match.id);
  events.forEach((e, i) => {
    const teamSlotName = teamSlot(match.id, e.team_event);
    const { physical_x, physical_y } = attackerToPhysical(e.shot_x, e.shot_y, teamSlotName, APP.match.team_A_side);
    const sx = physical_x * 1100;
    const sy = physical_y * 600;
    const isLatest = i === 0;
    const fillColor = teamSlotName === 'A' ? '#1d4ed8' : '#b91c1c';
    const isOwnHalf = e.zone_name === 'own-half';
    const isGoal = e.result === 'gol';
    const isMissed = e.result === 'niecelny';
    const dotR = isLatest ? 11 : 7;
    const sw = isLatest ? (isOwnHalf ? 4 : 3) : (isOwnHalf ? 3 : 2);

    // Man-up / man-down outer ring (rendered before dot so dot sits on top)
    if (e.man_up || e.man_down) {
      const ringAttrs = {
        cx: sx, cy: sy,
        r: dotR + 5,
        fill: 'transparent',
        stroke: e.man_up ? '#f59e0b' : '#7c3aed',
        'stroke-width': 2,
      };
      if (e.man_down) ringAttrs['stroke-dasharray'] = '3,2';
      markersG.appendChild(svgEl('circle', ringAttrs));
    }

    let markerEl;
    if (isMissed) {
      const s = dotR - 2;
      const xColor = isOwnHalf ? '#ca8a04' : fillColor;
      markerEl = svgEl('g', { class: 'marker' + (isLatest ? ' latest' : '') });
      markerEl.appendChild(svgEl('line', { x1: sx - s, y1: sy - s, x2: sx + s, y2: sy + s, stroke: xColor, 'stroke-width': sw, 'stroke-linecap': 'round' }));
      markerEl.appendChild(svgEl('line', { x1: sx + s, y1: sy - s, x2: sx - s, y2: sy + s, stroke: xColor, 'stroke-width': sw, 'stroke-linecap': 'round' }));
    } else {
      markerEl = svgEl('circle', {
        cx: sx, cy: sy,
        r: dotR,
        fill: isGoal ? fillColor : 'transparent',
        stroke: isOwnHalf ? '#ca8a04' : (isGoal ? 'white' : fillColor),
        'stroke-width': sw,
        class: 'marker' + (isLatest ? ' latest' : '')
      });
    }

    if (e.assisted || e.free_position || e.penalty_shot) {
      const g = svgEl('g');
      g.appendChild(markerEl);
      if (e.assisted) {
        const bx = sx + dotR - 2;
        const by = sy - dotR + 2;
        g.appendChild(svgEl('circle', { cx: bx, cy: by, r: 6, fill: '#f59e0b', stroke: 'white', 'stroke-width': 1 }));
        const t = svgEl('text', { x: bx, y: by + 0.5, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
          'font-size': 7, 'font-weight': 'bold', fill: 'white' });
        t.textContent = 'A';
        g.appendChild(t);
      }
      if (e.free_position) {
        const bx = sx - dotR + 2;
        const by = sy - dotR + 2;
        g.appendChild(svgEl('circle', { cx: bx, cy: by, r: 6, fill: '#0891b2', stroke: 'white', 'stroke-width': 1 }));
        const t = svgEl('text', { x: bx, y: by + 0.5, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
          'font-size': 7, 'font-weight': 'bold', fill: 'white' });
        t.textContent = 'W';
        g.appendChild(t);
      }
      if (e.penalty_shot) {
        const bx = sx - dotR + 2;
        const by = sy + dotR - 2;
        g.appendChild(svgEl('circle', { cx: bx, cy: by, r: 6, fill: '#dc2626', stroke: 'white', 'stroke-width': 1 }));
        const t = svgEl('text', { x: bx, y: by + 0.5, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
          'font-size': 7, 'font-weight': 'bold', fill: 'white' });
        t.textContent = 'K';
        g.appendChild(t);
      }
      markersG.appendChild(g);
    } else {
      markersG.appendChild(markerEl);
    }

    if (e.fast_break) {
      const ax = sx + dotR + 7;
      const tip = ax + 16;
      markersG.appendChild(svgEl('line', { x1: ax, y1: sy, x2: tip, y2: sy, stroke: 'white', 'stroke-width': 5, 'stroke-linecap': 'round' }));
      markersG.appendChild(svgEl('line', { x1: tip - 7, y1: sy - 7, x2: tip, y2: sy, stroke: 'white', 'stroke-width': 5, 'stroke-linecap': 'round' }));
      markersG.appendChild(svgEl('line', { x1: tip - 7, y1: sy + 7, x2: tip, y2: sy, stroke: 'white', 'stroke-width': 5, 'stroke-linecap': 'round' }));
      markersG.appendChild(svgEl('line', { x1: ax, y1: sy, x2: tip, y2: sy, stroke: '#10b981', 'stroke-width': 3, 'stroke-linecap': 'round' }));
      markersG.appendChild(svgEl('line', { x1: tip - 7, y1: sy - 7, x2: tip, y2: sy, stroke: '#10b981', 'stroke-width': 3, 'stroke-linecap': 'round' }));
      markersG.appendChild(svgEl('line', { x1: tip - 7, y1: sy + 7, x2: tip, y2: sy, stroke: '#10b981', 'stroke-width': 3, 'stroke-linecap': 'round' }));
    }
  });
  fieldG.appendChild(markersG);

  drawZoneLabels(fieldG, APP.match.team_A_side);

  svg.appendChild(fieldG);
  svg.addEventListener('click', handleFieldClick);
  return svg;
}

function handleFieldClick(ev) {
  const svg = ev.currentTarget;
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const svgPt = pt.matrixTransform(ctm.inverse());
  const fieldY = svgPt.y - 50;
  if (fieldY < 0 || fieldY > 600) return;
  const x = svgPt.x / 1100;
  const y = fieldY / 600;
  if (x < 0 || x > 1) return;

  const match = DATA.scheduledMatches.find(m => m.id === APP.matchId);
  if (!match) return;

  if (APP.match.own_half_mode === 'active') {
    const teamSlotChosen = detectOwnHalfTeam(x, APP.match.team_A_side);
    const teamName = teamSlotChosen === 'A' ? match.team_A : match.team_B;
    const { shot_x, shot_y } = physicalToAttacker(x, y, teamSlotChosen, APP.match.team_A_side);
    APP.match.own_half_mode = null;
    APP.banner = null;
    APP.modal = {
      type: 'result',
      pending: {
        shot_x, shot_y,
        team_event: teamName, team_slot: teamSlotChosen,
        zone_name: 'own-half'
      }
    };
    render();
    return;
  }

  const det = detectZone(x, y, APP.match.team_A_side);
  const teamName = det.team === 'A' ? match.team_A : match.team_B;
  APP.modal = {
    type: 'result',
    pending: {
      shot_x: det.shot_x, shot_y: det.shot_y,
      team_event: teamName, team_slot: det.team,
      zone_name: det.zone
    }
  };
  render();
}

// ==================== VIEWER MODE CHARTS ====================

function buildViewerChart(match, filtered) {
  const v = APP.viewer;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'field');
  svg.setAttribute('xmlns', ns);

  if (v.view_mode === 'full') {
    svg.setAttribute('viewBox', '0 0 1100 700');
    drawFullFieldChart(svg, match, filtered, v);
  } else {
    svg.setAttribute('viewBox', '0 0 540 660');
    svg.setAttribute('class', 'field field-half');
    drawHalfFieldChart(svg, match, filtered, v);
  }
  return svg;
}

function drawFullFieldChart(svg, match, filtered, viewer) {
  const sideLabels = svgEl('g');
  const lLab = svgEl('text', { x: 100, y: 35, 'font-size': 22, 'font-weight': 700, fill: '#1d4ed8' });
  lLab.textContent = `${match.team_A} →`;
  sideLabels.appendChild(lLab);
  const rLab = svgEl('text', { x: 1000, y: 35, 'text-anchor': 'end', 'font-size': 22, 'font-weight': 700, fill: '#b91c1c' });
  rLab.textContent = `← ${match.team_B}`;
  sideLabels.appendChild(rLab);
  const note = svgEl('text', { x: 550, y: 35, 'text-anchor': 'middle', 'font-size': 11, fill: '#999' });
  note.textContent = T('field.canonical_note');
  sideLabels.appendChild(note);
  svg.appendChild(sideLabels);

  const fieldG = svgEl('g', { transform: 'translate(0, 50)' });
  drawFieldMarkings(fieldG, 1100, 600);
  drawShotsFullField(fieldG, filtered, match, viewer.display_mode);
  drawZoneLabels(fieldG, 'left');  // canonical viewer: A always attacks right
  svg.appendChild(fieldG);
}

function drawHalfFieldChart(svg, match, filtered, viewer) {
  const teamSlot_ = viewer.view_mode === 'half-A' ? 'A' : 'B';
  const teamName  = teamSlot_ === 'A' ? match.team_A : match.team_B;
  const teamColor = teamSlot_ === 'A' ? '#1d4ed8'   : '#b91c1c';
  const teamShots = filtered.filter(e => e.team_event === teamName);

  // Portrait orientation: attack axis goes upward, goal at the top.
  // viewBox: 540 wide × 660 tall (50px title strip + 600 tall field + 10px buffer).
  const title = svgEl('text', { x: 270, y: 28, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: teamColor });
  title.textContent = `${teamName} — ${T('field.attack_up')}`;
  svg.appendChild(title);

  const fieldG = svgEl('g', { transform: 'translate(0, 50)' });
  // Half-field 540 wide × 600 tall (one offensive half, goal at top).
  fieldG.appendChild(svgEl('rect', { x: 0, y: 0, width: 540, height: 600, fill: '#9bbf85', class: 'field-bg' }));
  // Center line at the bottom (where attack starts).
  fieldG.appendChild(svgEl('line', { x1: 0, y1: 600, x2: 540, y2: 600, stroke: 'white', 'stroke-width': 3 }));
  // Restraining line (attacker_progress 0.4368 → cy = (1 − 0.4368) × 600 ≈ 337.92).
  fieldG.appendChild(svgEl('line', { x1: 0, y1: 337.92, x2: 540, y2: 337.92, stroke: 'white', 'stroke-width': 1.5, 'stroke-dasharray': '6,4', opacity: 0.85 }));
  // Goal line (attacker_progress 40/55 ≈ 0.7273 → cy ≈ 163.64).
  fieldG.appendChild(svgEl('line', { x1: 0, y1: 163.64, x2: 540, y2: 163.64, stroke: 'white', 'stroke-width': 1.5, opacity: 0.7 }));
  // End line at the top.
  fieldG.appendChild(svgEl('line', { x1: 0, y1: 0, x2: 540, y2: 0, stroke: 'white', 'stroke-width': 3 }));
  // Side lines (left and right).
  fieldG.appendChild(svgEl('line', { x1: 0,   y1: 0, x2: 0,   y2: 600, stroke: 'white', 'stroke-width': 3 }));
  fieldG.appendChild(svgEl('line', { x1: 540, y1: 0, x2: 540, y2: 600, stroke: 'white', 'stroke-width': 3 }));
  // Crease + goal mouth at the goal line.
  fieldG.appendChild(svgEl('circle', { cx: 270, cy: 163.64, r: 27, fill: '#9bbf85', stroke: 'white', 'stroke-width': 2 }));
  fieldG.appendChild(svgEl('line',   { x1: 258, y1: 163.64, x2: 282, y2: 163.64, stroke: 'white', 'stroke-width': 5 }));

  if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.variant === 'field') {
    fieldG.appendChild(buildFieldLacrosseRozkiHalf());
  }

  // Plot only shots with shot_x ≥ 0 (skip own-half).
  // Rotation mapping: attacker shot_x (0→1, center→end) → cy = (1 − shot_x) × 600 (bottom→top).
  //                   attacker shot_y (0→1, attacker-left→right) → cx = shot_y × 540.
  const chartShots = teamShots.filter(e => e.shot_x >= 0);
  chartShots.forEach(e => {
    const cx = e.shot_y * 540;
    const cy = (1 - e.shot_x) * 600;
    if (viewer.display_mode === 'heatmap') drawHeatBlob(fieldG, cx, cy, teamColor);
    else                                    drawShotMarker(fieldG, cx, cy, teamColor, e.result, false, e.man_up, e.man_down, e.assisted, e.fast_break, e.free_position, e.penalty_shot);
  });

  svg.appendChild(fieldG);
}

function drawFieldMarkings(g, w, h) {

  g.appendChild(svgEl('line',   { x1: w / 2 - 10, y1: h / 2 - 10, x2: w / 2 + 10, y2: h / 2 + 10, stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('line',   { x1: w / 2 - 10, y1: h / 2 + 10, x2: w / 2 + 10, y2: h / 2 - 10, stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('line',   { x1: w * 150 / 1100, y1: 0, x2: w * 150 / 1100, y2: h, stroke: 'white', 'stroke-width': 1.5, opacity: 0.7 }));
  g.appendChild(svgEl('line',   { x1: w * 950 / 1100, y1: 0, x2: w * 950 / 1100, y2: h, stroke: 'white', 'stroke-width': 1.5, opacity: 0.7 }));

  g.appendChild(svgEl('line',   { x1: w * 750 / 1100, y1: 0, x2: w * 750 / 1100, y2: h, stroke: 'white', 'stroke-width': 1.5, 'stroke-dasharray': '6,4', opacity: 0.85 }));
  g.appendChild(svgEl('rect',   { x: 0, y: 0, width: w, height: h, fill: 'none', stroke: 'white', 'stroke-width': 3 }));
  g.appendChild(svgEl('circle', { cx: w * 150 / 1100, cy: h / 2, r: 30, fill: '#9bbf85', stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('circle', { cx: w * 950 / 1100, cy: h / 2, r: 30, fill: '#9bbf85', stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('line',   { x1: w * 150 / 1100, y1: h / 2 - 12, x2: w * 150 / 1100, y2: h / 2 + 12, stroke: 'white', 'stroke-width': 5 }));

  if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.variant === 'field') {
    g.appendChild(buildFieldLacrosseRozki(w, h));
  }
}

function drawShotsFullField(g, events, match, displayMode) {
  // Canonical orientation: A on left attacking right (team_A_side='left')
  events.forEach(e => {
    const slot = teamSlot(match.id, e.team_event);
    const color = slot === 'A' ? '#1d4ed8' : '#b91c1c';
    const { physical_x, physical_y } = attackerToPhysical(e.shot_x, e.shot_y, slot, 'left');
    const cx = physical_x * 1100;
    const cy = physical_y * 600;
    if (displayMode === 'heatmap') drawHeatBlob(g, cx, cy, color);
    else                            drawShotMarker(g, cx, cy, color, e.result, e.zone_name === 'own-half', e.man_up, e.man_down, e.assisted, e.fast_break, e.free_position, e.penalty_shot);
  });
}

function drawShotMarker(g, cx, cy, color, result, isOwnHalf, manUp, manDown, hasAssist, fastBreak, freePosition, penaltyShot) {
  const isGoal   = result === 'gol';
  const isMissed = result === 'niecelny';
  const strokeColor = isOwnHalf ? '#ca8a04' : color;

  // Man-up / man-down outer ring (rendered first, behind marker)
  if (manUp || manDown) {
    const ringAttrs = {
      cx, cy, r: 12,
      fill: 'transparent',
      stroke: manUp ? '#f59e0b' : '#7c3aed',
      'stroke-width': 2,
    };
    if (manDown) ringAttrs['stroke-dasharray'] = '3,2';
    g.appendChild(svgEl('circle', ringAttrs));
  }

  if (isMissed) {
    const s = 5;
    g.appendChild(svgEl('line', { x1: cx - s, y1: cy - s, x2: cx + s, y2: cy + s, stroke: strokeColor, 'stroke-width': 2 }));
    g.appendChild(svgEl('line', { x1: cx + s, y1: cy - s, x2: cx - s, y2: cy + s, stroke: strokeColor, 'stroke-width': 2 }));
  } else {
    g.appendChild(svgEl('circle', {
      cx, cy, r: 7,
      fill: isGoal ? color : 'transparent',
      stroke: isOwnHalf ? '#ca8a04' : (isGoal ? 'white' : color),
      'stroke-width': 2
    }));
  }

  if (hasAssist) {
    g.appendChild(svgEl('circle', { cx: cx + 5, cy: cy - 5, r: 5, fill: '#f59e0b', stroke: 'white', 'stroke-width': 1 }));
    const t = svgEl('text', {
      x: cx + 5, y: cy - 4.5,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 6, 'font-weight': 'bold', fill: 'white'
    });
    t.textContent = 'A';
    g.appendChild(t);
  }

  if (freePosition) {
    g.appendChild(svgEl('circle', { cx: cx - 5, cy: cy - 5, r: 5, fill: '#0891b2', stroke: 'white', 'stroke-width': 1 }));
    const t = svgEl('text', {
      x: cx - 5, y: cy - 4.5,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 6, 'font-weight': 'bold', fill: 'white'
    });
    t.textContent = 'W';
    g.appendChild(t);
  }

  if (penaltyShot) {
    g.appendChild(svgEl('circle', { cx: cx - 5, cy: cy + 5, r: 5, fill: '#dc2626', stroke: 'white', 'stroke-width': 1 }));
    const t = svgEl('text', {
      x: cx - 5, y: cy + 5.5,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 6, 'font-weight': 'bold', fill: 'white'
    });
    t.textContent = 'K';
    g.appendChild(t);
  }

  if (fastBreak) {
    const ax = cx + 10;
    const tip = ax + 16;
    // white outline for contrast on green field
    g.appendChild(svgEl('line', { x1: ax, y1: cy, x2: tip, y2: cy, stroke: 'white', 'stroke-width': 5, 'stroke-linecap': 'round' }));
    g.appendChild(svgEl('line', { x1: tip - 7, y1: cy - 7, x2: tip, y2: cy, stroke: 'white', 'stroke-width': 5, 'stroke-linecap': 'round' }));
    g.appendChild(svgEl('line', { x1: tip - 7, y1: cy + 7, x2: tip, y2: cy, stroke: 'white', 'stroke-width': 5, 'stroke-linecap': 'round' }));
    // teal fill on top
    g.appendChild(svgEl('line', { x1: ax, y1: cy, x2: tip, y2: cy, stroke: '#10b981', 'stroke-width': 3, 'stroke-linecap': 'round' }));
    g.appendChild(svgEl('line', { x1: tip - 7, y1: cy - 7, x2: tip, y2: cy, stroke: '#10b981', 'stroke-width': 3, 'stroke-linecap': 'round' }));
    g.appendChild(svgEl('line', { x1: tip - 7, y1: cy + 7, x2: tip, y2: cy, stroke: '#10b981', 'stroke-width': 3, 'stroke-linecap': 'round' }));
  }
}

// ── Etykiety stref A1–B6 (F-04) ──────────────────────────────────────────────

function drawZoneLabels(g, team_A_side) {
  const A_atk_right = team_A_side === 'left';
  // X-centers (SVG field coords, 1100px wide)
  // Attack/midfield boundary at shot_x=0.4368 → physical_x=0.7184 → 790px (right side)
  //                                                                  0.2816 → 310px (left side)
  const aAtckX = A_atk_right ? 945 : 155;  // center of attack zone for A
  const aMidX  = A_atk_right ? 670 : 430;  // center of midfield zone for A
  const bAtckX = A_atk_right ? 155 : 945;
  const bMidX  = A_atk_right ? 430 : 670;
  // Y-centers: left/center/right from attacker's POV
  // Attacking right: left=top(100), center=mid(300), right=bottom(500)
  // Attacking left:  left=bottom(500), center=mid(300), right=top(100)
  const aY = A_atk_right ? [100, 300, 500] : [500, 300, 100];
  const bY = A_atk_right ? [500, 300, 100] : [100, 300, 500];

  const items = [
    { l: 'A1', x: aAtckX, y: aY[0] }, { l: 'A2', x: aAtckX, y: aY[1] }, { l: 'A3', x: aAtckX, y: aY[2] },
    { l: 'A4', x: aMidX,  y: aY[0] }, { l: 'A5', x: aMidX,  y: aY[1] }, { l: 'A6', x: aMidX,  y: aY[2] },
    { l: 'B1', x: bAtckX, y: bY[0] }, { l: 'B2', x: bAtckX, y: bY[1] }, { l: 'B3', x: bAtckX, y: bY[2] },
    { l: 'B4', x: bMidX,  y: bY[0] }, { l: 'B5', x: bMidX,  y: bY[1] }, { l: 'B6', x: bMidX,  y: bY[2] },
  ];
  items.forEach(({ l, x, y }) => {
    const t = svgEl('text', {
      x, y, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 11, fill: '#9ca3af', 'pointer-events': 'none', 'font-weight': '600'
    });
    t.textContent = l;
    g.appendChild(t);
  });
}

// ==================== FIELD LACROSSE VARIANT MARKINGS ====================

// Returns an SVG <g> with additional lines specific to field lacrosse (variant='field'):
// GLE (3m–15m), łuk 15m, rózki + łuk 11m z kreskami hash, punkty 4m, koło środkowe 9m.
// Coordinates are defined for the base 1100×600 canvas and scaled to the given w/h
// (same convention as drawFieldMarkings). Crease/goal-mouth stay canonical (r=30) —
// drawn separately in drawFieldMarkings so charts remain comparable across variants.
function buildFieldLacrosseRozki(w, h) {
  const g = svgEl('g', { class: 'field-lacrosse-rozki' });
  const scaleX = w / 1100;
  const scaleY = h / 600;
  const sx = x => x * scaleX;
  const sy = y => y * scaleY;

  const line = (x1, y1, x2, y2, opts = {}) => g.appendChild(svgEl('line', {
    x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2),
    stroke: 'white', 'stroke-width': 1.5, ...opts
  }));
  const arc = (x1, y1, rBase, sweep, x2, y2, opts = {}) => g.appendChild(svgEl('path', {
    d: `M ${sx(x1)} ${sy(y1)} A ${rBase * scaleX} ${rBase * scaleY} 0 0 ${sweep} ${sx(x2)} ${sy(y2)}`,
    stroke: 'white', fill: 'none', 'stroke-width': 1.5, ...opts
  }));

  // GLE — 3m–15m od środka bramki, po obu stronach
  line(150, 135, 150, 267, { opacity: 0.8 });
  line(150, 333, 150, 465, { opacity: 0.8 });
  line(950, 135, 950, 267, { opacity: 0.8 });
  line(950, 333, 950, 465, { opacity: 0.8 });

  // Łuk 15m
  arc(150, 135, 165, 1, 150, 465, { opacity: 0.7 });
  arc(950, 135, 165, 0, 950, 465, { opacity: 0.7 });

  // Rózki + łuk 11m
  line(150, 270, 219.2, 200.8);
  line(150, 330, 219.2, 399.2);
  arc(219.2, 200.8, 121, 1, 219.2, 399.2);
  line(950, 270, 880.8, 200.8);
  line(950, 330, 880.8, 399.2);
  arc(880.8, 200.8, 121, 0, 880.8, 399.2);

  // Kreski hash na łuku 11m (7 marks: center + ±2×4m + ostatnia para na styku rurek ~55°)
  [
    [267, 300, 275, 300], [259.4, 341.6, 266.8, 344.5], [259.4, 258.4, 266.8, 255.5],
    [237.4, 377.8, 243.4, 383.1], [237.4, 222.2, 243.4, 216.9],
    [216.9, 396.0, 221.5, 402.5], [216.9, 204.0, 221.5, 197.5],
  ].forEach(([x1, y1, x2, y2]) => line(x1, y1, x2, y2));
  [
    [825, 300, 833, 300], [833.2, 344.5, 840.6, 341.6], [833.2, 255.5, 840.6, 258.4],
    [856.6, 383.1, 862.6, 377.8], [856.6, 216.9, 862.6, 222.2],
    [878.5, 402.5, 883.1, 396.0], [878.5, 197.5, 883.1, 204.0],
  ].forEach(([x1, y1, x2, y2]) => line(x1, y1, x2, y2));

  // Punkty 4m od linii końcowej
  const dotR = 4 * Math.min(scaleX, scaleY);
  [[44, 135], [44, 465], [1056, 135], [1056, 465]].forEach(([x, y]) => {
    g.appendChild(svgEl('circle', { cx: sx(x), cy: sy(y), r: dotR, fill: 'white' }));
  });

  // Koło środkowe 9m
  g.appendChild(svgEl('ellipse', {
    cx: sx(550), cy: sy(300), rx: 99 * scaleX, ry: 99 * scaleY,
    fill: 'none', stroke: 'white', 'stroke-width': 1.5, opacity: 0.7
  }));

  return g;
}

// Half-field equivalent of buildFieldLacrosseRozki, pre-computed for the fixed
// 540×600 half-field canvas used by drawHalfFieldChart. Derived from the full-field
// markings via the right-goal transform: cx = sy_full * 0.9, cy = (1100 - sx_full) * 12/11.
function buildFieldLacrosseRozkiHalf() {
  const g = svgEl('g', { class: 'field-lacrosse-rozki' });
  const line = (x1, y1, x2, y2) => g.appendChild(svgEl('line', {
    x1, y1, x2, y2, stroke: 'white', 'stroke-width': 1.5
  }));

  // Łuk 15m
  g.appendChild(svgEl('path', {
    d: 'M 121.5 163.64 A 148.5 180 0 0 0 270 343.64 A 148.5 180 0 0 0 418.5 163.64',
    stroke: 'white', fill: 'none', 'stroke-width': 1.5, opacity: 0.7
  }));

  // Rózki + łuk 11m
  line(243, 163.64, 180.7, 239.1);
  line(297, 163.64, 359.3, 239.1);
  g.appendChild(svgEl('path', {
    d: 'M 180.7 239.1 A 109 132 0 0 0 359.3 239.1',
    stroke: 'white', fill: 'none', 'stroke-width': 1.5
  }));

  // Kreski hash na łuku 11m
  [
    [270, 300, 270, 291.3], [310.1, 291.1, 307.4, 283.0], [230.0, 291.1, 232.6, 283.0],
    [344.8, 265.8, 340.0, 259.3], [195.2, 265.8, 200.0, 259.3],
    [362.3, 241.6, 356.4, 236.6], [177.8, 241.6, 183.6, 236.6],
  ].forEach(([x1, y1, x2, y2]) => line(x1, y1, x2, y2));

  // Punkty 4m od linii końcowej
  g.appendChild(svgEl('circle', { cx: 121.5, cy: 48, r: 4, fill: 'white' }));
  g.appendChild(svgEl('circle', { cx: 418.5, cy: 48, r: 4, fill: 'white' }));

  // Koło środkowe 9m (połowa widoczna od linii środkowej, sklejona z drugą połową boiska)
  g.appendChild(svgEl('ellipse', {
    cx: 270, cy: 600, rx: 89.1, ry: 108,
    fill: 'none', stroke: 'white', 'stroke-width': 1.5, opacity: 0.7
  }));

  return g;
}

function drawHeatBlob(g, cx, cy, color) {
  const rgb = color === '#1d4ed8' ? '29, 78, 216' : '185, 28, 28';
  g.appendChild(svgEl('circle', { cx, cy, r: 35, fill: `rgba(${rgb}, 0.18)`, stroke: 'none' }));
  g.appendChild(svgEl('circle', { cx, cy, r: 3,  fill: `rgba(${rgb}, 0.7)`,  stroke: 'none' }));
}

function renderHome(root) {
  const today = todayISO();

  const headerHtml = `
    <div class="app-header">
      <h1>Lacrosse Stats</h1>
      <span class="meta">${today}</span>
      ${IS_EDITOR ? `<button class="btn" data-action="open-admin">${T('nav.admin')}</button>` : ''}

      ${_langToggleBtn()}
      <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="${T('nav.theme')}">🌙</button>
    </div>`;

  if (APP.homeLoading) {
    root.innerHTML = headerHtml + `
      <div class="home-content">
        <div class="loading-state">
          <div class="spinner">⏳</div>
          <p>${T('loading.matches')}</p>
        </div>
      </div>`;
    return;
  }

  if (APP.homeError) {
    root.innerHTML = headerHtml + `
      <div class="home-content">
        <div class="error-state">
          <p>⚠ ${T('error.loading')}: ${escapeHtml(APP.homeError)}</p>
          <button class="btn btn-primary" data-action="home-retry">${T('btn.retry')}</button>
        </div>
      </div>`;
    return;
  }

  const todayMatches = DATA.scheduledMatches.filter(m => m.match_date === today);
  const pastMatches  = DATA.scheduledMatches
    .filter(m => m.match_date < today)
    .sort((a, b) => b.match_date.localeCompare(a.match_date));

  function renderMatchCard(m) {
    const score      = computeScore(m.id);
    const eventCount = DATA.events.filter(e => e.match_id === m.id).length;
    const isFinished = m.status === 'finished';
    const isLive     = m.status === 'live';
    const presence = APP.presenceCounts[String(m.id)] || { input: 0, viewer: 0 };
    const presenceBadgeHtml = _renderPresenceBadge(presence.input, presence.viewer, null);
    return `
      <div class="match-card ${isFinished ? 'finished' : ''}">
        <div class="match-tournament">
          ${escapeHtml(m.tournament || T('match.no_tournament'))}
          ${isLive ? ' <span class="badge-live">LIVE</span>' : ''}
          ${presenceBadgeHtml}
        </div>
        <div class="match-teams">
          <span>${escapeHtml(m.team_A)}</span>
          ${eventCount > 0 || isFinished
            ? `<span class="match-score">${score.A} : ${score.B}</span>`
            : '<span class="vs">vs</span>'}
          <span>${escapeHtml(m.team_B)}</span>
        </div>
        <div class="match-meta">
          ${m.match_date}
          ${eventCount > 0 ? ` · ${eventCount} ${T_n(eventCount, 'offline.event', 'offline.events')}` : ''}
        </div>
        <div class="match-actions">
          ${IS_EDITOR ? `<button class="btn btn-primary" data-action="open-match" data-arg="${m.id}">${isFinished ? T('btn.open') : T('btn.input_stats')}</button>` : ''}
          <button class="btn btn-secondary" data-action="open-viewer" data-arg="${m.id}">${T('btn.view_only')}</button>
        </div>
      </div>`;
  }

  const infoBannerHtml = (APP.banner && APP.banner.type === 'info')
    ? `<div class="home-info-banner">${escapeHtml(APP.banner.msg)}</div>`
    : '';

  const offlineBannerHtml = APP.offlineBanner
    ? `<div class="offline-recovery-banner">
        ⚠ ${APP.offlineBanner} ${T_n(APP.offlineBanner, 'offline.event', 'offline.events')} ${T('offline.pending')}
        <div class="offline-recovery-actions">
          <button class="btn btn-sm btn-primary" data-action="retry-all-offline">${T('btn.retry_all') || 'Ponów wszystkie'}</button>
          <button class="btn btn-sm" data-action="export-offline-backup" title="${T('btn.download_backup')}">${T('btn.download_backup')}</button>
          <button class="btn btn-sm" data-action="import-offline-backup" title="${T('btn.import_backup')}">${T('btn.import_backup')}</button>
        </div>
      </div>`
    : '';

  let html = headerHtml + offlineBannerHtml + infoBannerHtml + `
    <div class="home-content">
      <h2>${T('home.today_matches')}</h2>`;

  if (todayMatches.length === 0) {
    html += `<div class="empty">${T('home.no_today')}` +
      (IS_EDITOR ? `<br>${T('home.no_today_hint')}` : '') +
      '</div>';
  } else {
    html += '<div class="match-list">';
    todayMatches.forEach(m => { html += renderMatchCard(m); });
    html += '</div>';
  }

  if (pastMatches.length > 0) {
    html += `<h2 style="margin-top:1.5rem">${T('home.past_matches')}</h2>`;
    html += '<div class="match-list">';
    pastMatches.forEach(m => { html += renderMatchCard(m); });
    html += '</div>';
  }

  html += (IS_EDITOR ? `<button class="add-match" data-action="ad-hoc">${T('btn.new_adhoc')}</button>` : '') + '</div>';
  root.innerHTML = html;
}

        <span class="period-pill-v2">${periodLabel(APP.match.period)}</span>
        <span class="tournament-pill-v2">${escapeHtml(match.tournament)}</span>
        ${match.video_url ? `<a class="btn-video-pill-v2" href="${escapeHtml(match.video_url)}" target="_blank" rel="noopener">▶ ${APP.lang === 'pl' ? 'Nagranie' : 'Recording'}</a>` : ''}

      <span class="sides-tag-v2">A: ${A_left ? T('sides.left') : T('sides.right')}</span>
      ${retryAllBtn}

      ${_langToggleBtn()}
      <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="${T('nav.theme')}">🌙</button>
    </div>
    <div class="match-screen match-screen-v2">

        <div class="match-field-col-v2">
          ${bannerHtml}
          <div id="field-wrap"></div>
          <div class="match-controls match-controls-v2">
            ${controlsHtml}
            <button class="btn" data-action="swap-sides">${T('btn.swap_sides')}</button>

function renderHistoryRow(e, match) {
  const slot  = teamSlot(match.id, e.team_event);

  let syncBadge = '';
  let retryBtn  = '';
  if (e._syncing) {
    syncBadge = `<span class="sync-badge syncing" title="${T('sync.saving')}">⟳</span>`;
  } else if (e._syncError) {
    syncBadge = `<span class="sync-badge error" title="${escapeHtml(e._syncError)}">⚠ ${escapeHtml(e._syncError)}</span>`;
    retryBtn  = `<button class="icon-btn retry" data-action="retry-event" data-arg="${escapeHtml(e.client_event_id)}" title="${T('btn.retry_send')}">↻</button>`;
  }

  const rowClass = e._syncError ? 'history-row sync-error' : 'history-row';

  if (e.event_type === 'groundball' || e.event_type === 'draw') {
    const label = e.event_type === 'groundball' ? 'GB' : 'Draw';
    return `
      <div class="${rowClass}">
        <div class="period">${periodLabel(e.period)}</div>
        <div class="team-tag ${slot}">${slot}</div>
        <div class="result">${label}</div>
        <div class="flags">${syncBadge}</div>
        <div class="actions">
          ${retryBtn}
          <button class="icon-btn delete" title="${APP.lang === 'pl' ? 'Usuń' : 'Delete'}" data-action="delete-event" data-arg="${e.id}">🗑</button>
        </div>
      </div>`;
  }

  const flags = [];
  if (e.man_up)        flags.push('<span class="flag man-up">man-up</span>');
  if (e.man_down)      flags.push('<span class="flag man-down">man-down</span>');
  if (e.assisted)      flags.push('<span class="flag assisted">A</span>');
  if (e.fast_break)    flags.push('<span class="flag fast-break">FB</span>');
  if (e.free_position) flags.push('<span class="flag free-position">FP</span>');
  if (e.penalty_shot)  flags.push('<span class="flag penalty-shot">PEN</span>');

  return `
    <div class="${rowClass}">
      <div class="period">${periodLabel(e.period)}</div>
      <div class="team-tag ${slot}">${slot}</div>
      <div class="result ${e.result}">${e.result}</div>
      <div class="flags">${flags.join('')}${syncBadge}</div>
      <div class="actions">
        ${retryBtn}
        <button class="icon-btn"        title="${APP.lang === 'pl' ? 'Edytuj' : 'Edit'}" data-action="edit-event"   data-arg="${e.id}">✎</button>
        <button class="icon-btn delete" title="${APP.lang === 'pl' ? 'Usuń' : 'Delete'}" data-action="delete-event" data-arg="${e.id}">🗑</button>
      </div>
    </div>`;
}

// Match-viewer screen (read-only).

function renderMatchViewer(root) {
  const match = DATA.scheduledMatches.find(m => String(m.id) === String(APP.matchId));
  if (!match) {
    root.innerHTML = `<div class="empty">${T('error.match_not_found')}</div>`;
    return;
  }

  if (APP.viewerLoading) {
    root.innerHTML = `
      <div class="app-header">
        <button class="btn" data-action="back-home">${T('nav.back')}</button>
        <h1>${escapeHtml(match.team_A)} vs ${escapeHtml(match.team_B)} <span style="font-size:13px;color:#888;font-weight:normal">${T('viewer.readonly')}</span></h1>
        ${_langToggleBtn()}
        <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="${T('nav.theme')}">🌙</button>
      </div>
      <div class="loading-state">
        <div class="spinner">⏳</div>
        ${T('loading.match_data')}
      </div>`;
    return;
  }

  if (APP.viewerError) {
    root.innerHTML = `
      <div class="app-header">
        <button class="btn" data-action="back-home">${T('nav.back')}</button>
        <h1>${escapeHtml(match.team_A)} vs ${escapeHtml(match.team_B)}</h1>
        ${_langToggleBtn()}
        <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="${T('nav.theme')}">🌙</button>
      </div>
      <div class="error-state">
        <p>⚠ ${T('error.loading_data')}: ${escapeHtml(APP.viewerError)}</p>
        <button class="btn btn-primary" data-action="viewer-retry">${T('btn.retry_short')}</button>
      </div>`;
    return;
  }

  const allEvents  = DATA.events.filter(e => String(e.match_id) === String(match.id));
  const shotEvents = allEvents.filter(e => isShotEvent(e));
  const filtered   = applyViewerFilters(shotEvents, APP.viewer);
  const score      = computeScore(match.id);
  const statsA     = computeTeamStats(match.id, match.team_A, shotEvents);
  const statsB     = computeTeamStats(match.id, match.team_B, shotEvents);
  const goalies    = computeGoalieStats(match, allEvents);
  const perPeriod  = computePerPeriodStats(match.id, match);
  const situation  = computeSituationStats(match.id, match, shotEvents);

  const periodSet = new Set();
  allEvents.forEach(e => { if (e.period !== undefined && e.period !== '') periodSet.add(String(e.period)); });
  const periodOptions = Array.from(periodSet).sort((a, b) => getPeriodOrder(a) - getPeriodOrder(b));

  const tagClass  = APP.refreshFlash ? 'refresh-tag refreshing' : 'refresh-tag';
  const tagLabel  = APP.refreshFlash ? T('viewer.refreshing') : _viewerRefreshLabel();
  const _presence = APP.presenceCounts[String(match.id)] || { input: 0, viewer: 0 };
  const presenceBadgeHtml = _renderPresenceBadge(_presence.input, _presence.viewer, 'viewer');

  const statusLabel = match.status === 'live' ? T('viewer.status_live')
    : match.status === 'finished' ? T('viewer.status_finished')
    : T('viewer.status_planned');

  root.innerHTML = `
    <div class="app-header">
      <button class="btn" data-action="back-home">${T('nav.back')}</button>
      <h1>${escapeHtml(match.team_A)} vs ${escapeHtml(match.team_B)} <span style="font-size:13px;color:#888;font-weight:normal">${T('viewer.readonly')}</span></h1>
      ${_langToggleBtn()}
      <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="${T('nav.theme')}">🌙</button>
      <button class="btn" data-action="open-match-report" data-arg="${escapeHtml(String(match.id))}" title="${T('nav.pdf')}">${T('nav.pdf')}</button>
    </div>
    <div class="match-info-bar ${match.status === 'live' ? 'header-live' : (match.status === 'finished' ? 'header-archived' : '')}">
      <div class="score">
        <span class="team-A-color">${escapeHtml(match.team_A)} ${score.A}</span>
        <span class="sep">:</span>
        <span class="team-B-color">${score.B} ${escapeHtml(match.team_B)}</span>
      </div>
      <div class="period">${statusLabel}</div>
      <div class="tournament">${escapeHtml(match.tournament)}</div>
      <div class="sides-indicator">${presenceBadgeHtml}<span class="${tagClass}"><span class="dot"></span>${tagLabel}</span></div>
    </div>
    <div class="viewer-screen">
      <div class="viewer-section">
        ${renderViewerStatsCard(statsA, statsB, match)}
        ${renderViewerSituationCard(situation, match)}
        ${renderViewerGoalieCard(goalies, match)}
        ${renderViewerPerPeriodCard(perPeriod, match)}
        ${renderViewerShotChartCard(match, filtered, periodOptions)}
      </div>
    </div>`;

  const chartHost = document.getElementById('viewer-chart-host');
  if (chartHost) {
    chartHost.appendChild(buildViewerChart(match, filtered));
    if (APP.viewer.view_mode === 'full') chartHost.appendChild(buildFieldLegend(match, { includeManUp: true }));
  }
}

function _viewerRefreshLabel() {
  if (!APP.lastViewerRefresh) return T('viewer.last_update') + '—';
  const h = APP.lastViewerRefresh.getHours().toString().padStart(2, '0');
  const m = APP.lastViewerRefresh.getMinutes().toString().padStart(2, '0');
  const s = APP.lastViewerRefresh.getSeconds().toString().padStart(2, '0');
  return T('viewer.last_update') + h + ':' + m + ':' + s;
}

function _splitBar(va, vb) {
  const na = typeof va === 'number' ? va : (parseFloat(va) || 0);
  const nb = typeof vb === 'number' ? vb : (parseFloat(vb) || 0);
  const total = na + nb;
  const pct = total > 0 ? Math.round(na / total * 100) : 50;
  return APP.splitBars
    ? `<tr class="split-bar-row"><td colspan="3"><div class="split-bar" style="--pct:${pct}%"></div></td></tr>`
    : '';
}

function renderViewerStatsCard(statsA, statsB, match) {
  const fmt = (val, isRate) => val === '—' ? '—' : (isRate ? `${val}%` : val);
  const toggleLabel = APP.splitBars ? T('btn.hide_bars') : T('btn.show_bars');
  return `
    <div class="viewer-card">
      <h3 style="display:flex;align-items:center;">
        ${T('viewer.shots.title')}
        <button class="btn" data-action="toggle-split-bars" style="margin-left:auto;font-size:11px;padding:3px 8px;">${toggleLabel}</button>
      </h3>
      <table class="stats-table">

function _renderGoalieMultiRows(goalies, match) {
  const fmt = (val) => val === '—' ? '—' : val + '%';
  const listA = goalies.A.goalies || [];
  const listB = goalies.B.goalies || [];

  let html = '';
  for (let i = 0; i < maxLen; i++) {
    const gA = listA[i];
    const gB = listB[i];
    const labelA = gA ? (gA.number !== null ? `#${gA.number}` : T('goalie.no_nr')) : '';
    const labelB = gB ? (gB.number !== null ? `#${gB.number}` : T('goalie.no_nr')) : '';
    html += `<tr><td class="goalie-name team-A">${labelA}</td><td></td><td class="goalie-name team-B">${labelB}</td></tr>`;
    html += `<tr><td class="num team-A">${gA ? gA.saves : ''}</td><td class="label" style="text-align:center;">${T('viewer.goalie.saves')}</td><td class="num team-B">${gB ? gB.saves : ''}</td></tr>`;
    html += `<tr><td class="num team-A">${gA ? gA.goalsAgainst : ''}</td><td class="label" style="text-align:center;">${T('viewer.goalie.goals_ag')}</td><td class="num team-B">${gB ? gB.goalsAgainst : ''}</td></tr>`;
    html += `<tr><td class="num team-A">${gA ? gA.shotsOnGoal : ''}</td><td class="label" style="text-align:center;">${T('viewer.goalie.shots_on')}</td><td class="num team-B">${gB ? gB.shotsOnGoal : ''}</td></tr>`;
    html += `<tr class="summary-row"><td class="num team-A">${gA ? fmt(gA.savePct) : ''}</td><td class="label" style="text-align:center;">${T('viewer.goalie.save_pct')}</td><td class="num team-B">${gB ? fmt(gB.savePct) : ''}</td></tr>`;

}

// ── Filter logic ─────────────────────────────────────────────────────────────

function _analyticsApplyFilters(events, f) {
  return events.filter(e => {
    if (f.tournament && e.tournament !== f.tournament) return false;
    if (f.team      && e.team_event !== f.team)        return false;
    if (f.period    && String(e.period) !== f.period)  return false;
    if (f.dateFrom  && e.match_date < f.dateFrom)      return false;
    if (f.dateTo    && e.match_date > f.dateTo)        return false;
    return true;
  });
}

function _analyticsAllTeams(matches, tournament) {
  const set = new Set();
  matches.forEach(m => {
    if (tournament && m.tournament !== tournament) return;
    if (m.team_A) set.add(m.team_A);
    if (m.team_B) set.add(m.team_B);
  });
  return [...set].sort();
}

function _analyticsAllPeriods(events) {
  const set = new Set();
  events.forEach(e => { if (e.period) set.add(String(e.period)); });
  return [...set].sort((a, b) => {
    const aOT = a.startsWith('OT'), bOT = b.startsWith('OT');
    if (!aOT && !bOT) return Number(a) - Number(b);
    if (!aOT) return -1;
    if (!bOT) return 1;
    return Number(a.slice(2)) - Number(b.slice(2));
  });
}

// ── Result sections ───────────────────────────────────────────────────────────

function _renderAnalyticsBody(filtered, matches, f) {

    <div class="analytics-body">

}

// ── Goalkeepers ───────────────────────────────────────────────────────────────

function _computeGoalieAnalytics(filteredShots, allEvents, allMatches, f, sort) {
  const matchIds = new Set(filteredShots.map(e => String(e.match_id)));

  const matchMap = {};
  allMatches.forEach(m => { matchMap[String(m.id)] = m; });

  let shotsOnGoal = allEvents.filter(e =>
    isShotEvent(e) &&
    matchIds.has(String(e.match_id)) &&
    (e.result === 'gol' || e.result === 'celny')
  );
  if (f.period)   shotsOnGoal = shotsOnGoal.filter(e => String(e.period) === f.period);
  if (f.dateFrom) shotsOnGoal = shotsOnGoal.filter(e => e.match_date >= f.dateFrom);
  if (f.dateTo)   shotsOnGoal = shotsOnGoal.filter(e => e.match_date <= f.dateTo);

  const goalieSets = allEvents.filter(e =>
    e.event_type === 'goalie_set' &&
    matchIds.has(String(e.match_id))
  );

  function getDefendingTeam(shot) {
    const m = matchMap[String(shot.match_id)];
    if (!m) return null;
    if (shot.team_event === m.team_A) return m.team_B;
    if (shot.team_event === m.team_B) return m.team_A;
    return null;
  }

  function getActiveGoalie(teamName, matchId, period) {
    const sets = goalieSets
      .filter(e => e.team_event === teamName && String(e.match_id) === matchId)
      .sort((a, b) => getPeriodOrder(a.period) - getPeriodOrder(b.period));
    let number = null;
    for (const s of sets) {
      if (getPeriodOrder(s.period) <= getPeriodOrder(period)) number = s.goalie_number;
    }
    return number;
  }

  const byKey = {};
  const matchesPerKey = {};

  for (const shot of shotsOnGoal) {
    const defTeam = getDefendingTeam(shot);
    if (!defTeam) continue;
    if (f.team && defTeam !== f.team) continue;

    const num = getActiveGoalie(defTeam, String(shot.match_id), shot.period) || '__none__';
    const key = `${defTeam}::${num}`;

    if (!byKey[key]) {
      byKey[key] = { team: defTeam, number: num, saves: 0, goalsAgainst: 0, shotsOnGoal: 0, byPeriod: {} };
      matchesPerKey[key] = new Set();
    }
    const g = byKey[key];
    if (shot.result === 'celny') g.saves++;
    if (shot.result === 'gol')   g.goalsAgainst++;
    g.shotsOnGoal++;
    matchesPerKey[key].add(String(shot.match_id));

    const p = String(shot.period);
    if (!g.byPeriod[p]) g.byPeriod[p] = { saves: 0, goalsAgainst: 0, shotsOnGoal: 0 };
    if (shot.result === 'celny') g.byPeriod[p].saves++;
    if (shot.result === 'gol')   g.byPeriod[p].goalsAgainst++;
    g.byPeriod[p].shotsOnGoal++;
  }

  const list = Object.entries(byKey).map(([key, g]) => ({
    team:         g.team,
    number:       g.number === '__none__' ? null : g.number,
    saves:        g.saves,
    goalsAgainst: g.goalsAgainst,
    shotsOnGoal:  g.shotsOnGoal,
    savePct:      g.shotsOnGoal > 0 ? Math.round(g.saves / g.shotsOnGoal * 100) : null,
    matchCount:   matchesPerKey[key].size,
    byPeriod:     g.byPeriod,
  })).sort((a, b) => {
    const s = sort || { col: 'savePct', dir: 'desc' };
    let aVal, bVal;
    if (s.col.startsWith('p:')) {
      const p = s.col.slice(2);
      const ap = a.byPeriod[p], bp = b.byPeriod[p];
      aVal = ap && ap.shotsOnGoal > 0 ? ap.saves / ap.shotsOnGoal : -1;
      bVal = bp && bp.shotsOnGoal > 0 ? bp.saves / bp.shotsOnGoal : -1;
    } else if (s.col === 'number') {
      aVal = a.number !== null ? (isNaN(Number(a.number)) ? a.number : Number(a.number)) : (s.dir === 'asc' ? Infinity : -Infinity);
      bVal = b.number !== null ? (isNaN(Number(b.number)) ? b.number : Number(b.number)) : (s.dir === 'asc' ? Infinity : -Infinity);
      if (typeof aVal === 'string' || typeof bVal === 'string') {
        const sa = String(aVal), sb = String(bVal);
        return s.dir === 'asc' ? sa.localeCompare(sb) : sb.localeCompare(sa);
      }
    } else {
      aVal = a[s.col] !== null ? a[s.col] : -1;
      bVal = b[s.col] !== null ? b[s.col] : -1;
    }
    if (aVal === bVal) return 0;
    return s.dir === 'desc' ? bVal - aVal : aVal - bVal;
  });

  const totalSaves       = list.reduce((s, g) => s + g.saves, 0);
  const totalGoals       = list.reduce((s, g) => s + g.goalsAgainst, 0);
  const totalShotsOnGoal = list.reduce((s, g) => s + g.shotsOnGoal, 0);
  const avgSavePct       = totalShotsOnGoal > 0
    ? Math.round(totalSaves / totalShotsOnGoal * 100)
    : null;

  return { list, totalSaves, totalGoals, totalShotsOnGoal, avgSavePct, matchCount: matchIds.size };
}

function _renderAnalyticsGoalies(filtered, allEvents, allMatches, f) {
  if (filtered.length === 0) return '';

  const sort = APP.analyticsGoalieSort;
  const data = _computeGoalieAnalytics(filtered, allEvents, allMatches, f, sort);
  if (data.totalShotsOnGoal === 0) return '';

  const teamLabel = f.team ? escapeHtml(f.team) : null;

  function sortTh(label, col, style) {
    const active = sort.col === col;
    const arrow  = active ? (sort.dir === 'desc' ? ' ↓' : ' ↑') : '';
    const base   = 'cursor:pointer;user-select:none;white-space:nowrap;';
    const hlCss  = active ? 'text-decoration:underline;' : '';
    const extra  = style ? style + ';' : '';
    return `<th style="${base}${hlCss}${extra}" data-action="analytics-goalie-sort" data-arg="${col}">${label}${arrow}</th>`;
  }

  function savePctAttr(pct) {
    if (pct === null) return '';
    if (pct >= 70) return 'style="color:#15803d;font-weight:700"';
    if (pct >= 55) return 'style="color:#1d4ed8;font-weight:700"';
    return 'style="color:#b91c1c;font-weight:700"';
  }

  function savePctBar(pct) {
    if (pct === null) return '';
    const color = pct >= 70 ? '#16a34a' : pct >= 55 ? '#3b82f6' : '#dc2626';
    const w = Math.round(pct * 0.6);
    return `<span style="display:inline-block;width:60px;height:5px;background:#e5e7eb;border-radius:3px;vertical-align:middle;margin-left:6px;"><span style="display:block;width:${w}px;height:5px;border-radius:3px;background:${color};"></span></span>`;
  }

  const rankStyles = [
    'background:#fde68a;color:#92400e',
    'background:#d1d5db;color:#374151',
    'background:#fed7aa;color:#9a3412',
  ];

  const mainRows = data.list.map((g, i) => {
    const rankStyle  = i < 3 ? rankStyles[i] : 'background:#e5e7eb;color:#4b5563';
    const numLabel   = g.number !== null ? `#${escapeHtml(g.number)}` : '—';
    const pctLabel   = g.savePct !== null ? `${g.savePct}%` : '—';
    const subLabel   = escapeHtml(g.team);
    return `
      <tr>
        <td><span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:600;${rankStyle}">${i + 1}</span></td>
        <td style="line-height:1.3">
          <span style="font-weight:600;font-size:14px">${numLabel}</span>
          <span style="font-size:11px;color:#6b7280;display:block;margin-top:1px">${subLabel}</span>
        </td>
        <td class="num">${g.matchCount}</td>
        <td class="num">${g.shotsOnGoal}</td>
        <td class="num">${g.saves}</td>
        <td class="num">${g.goalsAgainst}</td>
        <td class="num"><span ${savePctAttr(g.savePct)}>${pctLabel}</span>${savePctBar(g.savePct)}</td>
      </tr>`;
  }).join('');

  let periodTable = '';
  if (!f.period && data.list.length >= 1 && data.list.length <= 5) {
    const periodSet = new Set();
    data.list.forEach(g => Object.keys(g.byPeriod).forEach(p => periodSet.add(p)));
    const periods = [...periodSet].sort((a, b) => getPeriodOrder(a) - getPeriodOrder(b));
    if (periods.length > 1) {
      const periodHeaders = periods.map(p => sortTh(escapeHtml(periodLabel(p)), 'p:' + p)).join('');
      const periodRows = data.list.map(g => {
        const numLabel = g.number !== null ? `#${escapeHtml(g.number)}` : '—';
        const cells = periods.map(p => {
          const pd = g.byPeriod[p];
          if (!pd || pd.shotsOnGoal === 0) return `<td class="num" style="color:#9ca3af">—</td>`;
          const pct = Math.round(pd.saves / pd.shotsOnGoal * 100);
          return `<td class="num" ${savePctAttr(pct)}>${pct}%</td>`;
        }).join('');
        return `<tr><td style="line-height:1.3"><span style="font-weight:600">${numLabel}</span><span style="font-size:11px;color:#6b7280;display:block;margin-top:1px">${escapeHtml(g.team)}</span></td>${cells}</tr>`;
      }).join('');
      periodTable = `
        <h3>${T('analytics.save_pct_period')}</h3>
        <table class="stats-table">
          <thead><tr>${sortTh(T('analytics.goalies.goalie'), 'number')}${periodHeaders}</tr></thead>
          <tbody>${periodRows}</tbody>
        </table>`;
    }
  }

  const avgLabel   = data.avgSavePct !== null ? `${data.avgSavePct}%` : '—';
  const matchBadge = `<span style="display:inline-block;font-size:11px;font-weight:600;background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:4px;margin-left:8px;vertical-align:middle">${data.matchCount} ${T('analytics.goalies.matches_badge')}</span>`;
  const heading    = teamLabel
    ? `${T('analytics.goalies.title')}: ${teamLabel}`
    : T('analytics.goalies.title');

  return `
    <section class="analytics-section">
      <h2>${heading}${matchBadge}</h2>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val">${data.list.length}</div><div class="stat-lbl">${T('analytics.goalies.count')}</div></div>
        <div class="stat-box"><div class="stat-val">${data.totalShotsOnGoal}</div><div class="stat-lbl">${T('analytics.goalies.shots_on')}</div></div>
        <div class="stat-box"><div class="stat-val">${data.totalSaves}</div><div class="stat-lbl">${T('analytics.goalies.saves')}</div></div>
        <div class="stat-box"><div class="stat-val">${data.totalGoals}</div><div class="stat-lbl">${T('analytics.goalies.goals_ag')}</div></div>
        <div class="stat-box"><div class="stat-val">${avgLabel}</div><div class="stat-lbl">${T('analytics.goalies.avg_save')}</div></div>
      </div>
      <h3>${T('analytics.goalies.per')}</h3>
      <table class="stats-table">
        <thead>
          <tr>
            <th style="width:28px">#</th>
            ${sortTh(T('analytics.goalies.goalie'), 'number')}
            ${sortTh(T('analytics.goalies.matches'), 'matchCount')}
            ${sortTh(T('analytics.goalies.shots_th'), 'shotsOnGoal')}
            ${sortTh(T('analytics.goalies.saves_th'), 'saves')}
            ${sortTh(T('analytics.goalies.goals_th'), 'goalsAgainst')}
            ${sortTh(T('analytics.goalies.save_pct'), 'savePct')}
          </tr>
        </thead>
        <tbody>${mainRows}</tbody>
      </table>
      ${periodTable}
    </section>`;
}

// ── Offense vs Defense ────────────────────────────────────────────────────────

function _buildConcededEvents(filteredTeamEvents, allEvents, f) {
  const matchIds = new Set(filteredTeamEvents.map(e => String(e.match_id)));
  let conceded = allEvents.filter(e =>
    matchIds.has(String(e.match_id)) && e.team_event !== f.team
  );
  if (f.period)   conceded = conceded.filter(e => String(e.period) === f.period);
  if (f.dateFrom) conceded = conceded.filter(e => e.match_date >= f.dateFrom);
  if (f.dateTo)   conceded = conceded.filter(e => e.match_date <= f.dateTo);
  return conceded;
}

function _renderOffenseDefenseComparison(filteredTeamEvents, allEvents, f) {
  if (!f.team) return '';

  const conceded = _buildConcededEvents(filteredTeamEvents, allEvents, f);
  const off = computeAnalyticsStats(filteredTeamEvents);
  const def = computeAnalyticsStats(conceded);

  function statRow(label, offVal, defVal, lowerIsBetter) {
    const offBetter = lowerIsBetter ? offVal <= defVal : offVal >= defVal;
    const defBetter = lowerIsBetter ? defVal <= offVal : defVal >= offVal;
    const offCls = offBetter && offVal !== defVal ? 'cmp-better' : '';
    const defCls = defBetter && offVal !== defVal ? 'cmp-better' : '';
    return `<tr>
      <td class="cmp-label">${label}</td>
      <td class="cmp-val ${offCls}">${offVal}</td>
      <td class="cmp-val ${defCls}">${defVal}</td>
    </tr>`;
  }

  const rows = [
    statRow(T('analytics.stats.shots'),    off.total,        def.total,        false),
    statRow(T('analytics.stats.goals'),    off.goals,        def.goals,        true),
    statRow(T('analytics.stats.on_target'),off.onTarget,     def.onTarget,     false),
    statRow(T('analytics.stats.rate') + ' %', `${off.pct}%`, `${def.pct}%`,   false),
    statRow(T('analytics.stats.on_pct'),   `${off.onPct}%`,  `${def.onPct}%`, false),
  ].join('');

  return `
    <section class="analytics-section">
      <h2>${T('analytics.atk_def.title')} — ${escapeHtml(f.team)}</h2>
      <table class="stats-table cmp-table">
        <thead>
          <tr>
            <th></th>
            <th>${T('analytics.atk')}</th>
            <th>${T('analytics.def')}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      ${def.total === 0
        ? `<p class="empty" style="font-size:13px">${T('analytics.def_no_data')}</p>`
        : ''}
    </section>`;
}

// ── Stats computation ─────────────────────────────────────────────────────────

function computeAnalyticsStats(events) {
  const total     = events.length;
  const goals     = events.filter(e => e.result === 'gol').length;
  const onTarget  = events.filter(e => e.result === 'celny' || e.result === 'gol').length;
  const offTarget = events.filter(e => e.result === 'niecelny').length;
  const manUp     = events.filter(e => e.man_up).length;
  const manDown   = events.filter(e => e.man_down).length;
  const fastBreak = events.filter(e => e.fast_break).length;

  const pct   = total > 0 ? Math.round((goals / total) * 100) : 0;
  const onPct = total > 0 ? Math.round((onTarget / total) * 100) : 0;

  const zones = {};
  events.forEach(e => {
    if (!e.zone_name) return;
    zones[e.zone_name] = (zones[e.zone_name] || 0) + 1;
  });

  const periods = {};
  events.forEach(e => {
    if (!e.period) return;
    const p = String(e.period);
    if (!periods[p]) periods[p] = { total: 0, goals: 0 };
    periods[p].total++;
    if (e.result === 'gol') periods[p].goals++;
  });

  const situations = {
    manUp:     { events: events.filter(e => e.man_up),
                 label: T('analytics.sit.man_up'), icon: '▲' },
    manDown:   { events: events.filter(e => e.man_down),
                 label: T('analytics.sit.man_down'), icon: '▼' },
    even:      { events: events.filter(e => !e.man_up && !e.man_down),
                 label: T('analytics.sit.even'), icon: '=' },
    fastBreak: { events: events.filter(e => e.fast_break),
                 label: T('analytics.sit.fast_break'), icon: '→' },
  };
  Object.values(situations).forEach(sit => {
    const t = sit.events.length;
    const g = sit.events.filter(e => e.result === 'gol').length;
    sit.total = t;
    sit.goals = g;
    sit.pct   = t > 0 ? Math.round((g / t) * 100) : 0;
  });

  return { total, goals, onTarget, offTarget, manUp, manDown, fastBreak, pct, onPct, zones, periods, situations };
}

// ── Shot result donut ─────────────────────────────────────────────────────────

function _renderShotResultDonut(s) {
  if (s.total === 0) return '';

  const segments = [
    { count: s.goals,                 color: '#16a34a', label: T('analytics.donut.goals') },
    { count: s.onTarget - s.goals,    color: '#3b82f6', label: T('analytics.donut.on_target') },
    { count: s.offTarget,             color: '#9ca3af', label: T('analytics.donut.off_target') },
  ].filter(seg => seg.count > 0);

  const cx = 80, cy = 80, r = 60, innerR = 38;
  let arcs = '';
  let angle = -Math.PI / 2;

  segments.forEach(seg => {
    const sweep = (seg.count / s.total) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(angle);
    const y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(angle + sweep);
    const y2 = cy + r * Math.sin(angle + sweep);
    const xi1 = cx + innerR * Math.cos(angle);
    const yi1 = cy + innerR * Math.sin(angle);
    const xi2 = cx + innerR * Math.cos(angle + sweep);
    const yi2 = cy + innerR * Math.sin(angle + sweep);
    const large = sweep > Math.PI ? 1 : 0;

    arcs += `<path d="
      M ${x1} ${y1}
      A ${r} ${r} 0 ${large} 1 ${x2} ${y2}
      L ${xi2} ${yi2}
      A ${innerR} ${innerR} 0 ${large} 0 ${xi1} ${yi1}
      Z" fill="${seg.color}" opacity="0.9"/>`;
    angle += sweep;
  });

  const legendItems = segments.map(seg => {
    const pct = Math.round((seg.count / s.total) * 100);
    return `<div class="donut-legend-item">
      <span class="donut-dot" style="background:${seg.color}"></span>
      <span>${seg.label}: ${seg.count} (${pct}%)</span>
    </div>`;
  }).join('');

  return `
    <div class="donut-wrapper">
      <svg width="160" height="160" viewBox="0 0 160 160">
        ${arcs}
        <text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="18" font-weight="700" fill="#111">${s.total}</text>
        <text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="10" fill="#6b7280">${T('analytics.donut.shots')}</text>
      </svg>
      <div class="donut-legend">${legendItems}</div>
    </div>`;
}

// ── Situation stats ───────────────────────────────────────────────────────────

function _renderSituationStats(s) {
  const { situations } = s;
  const hasSpecial = situations.manUp.total > 0 || situations.manDown.total > 0 || situations.fastBreak.total > 0;
  if (!hasSpecial) return '';

  const cards = [situations.manUp, situations.even, situations.manDown, situations.fastBreak].filter(s => s.total > 0 || s === situations.even).map(sit => `
    <div class="stat-box sit-card">
      <div class="sit-icon">${sit.icon}</div>
      <div class="stat-lbl">${sit.label}</div>
      <div class="sit-numbers">
        <span class="sit-goals">${sit.goals} ${T('analytics.sit.goals')}</span>
        <span class="sit-total">/ ${sit.total} ${T('analytics.donut.shots')}</span>
      </div>
      <div class="stat-val sit-pct">${sit.pct}%</div>
    </div>`).join('');

  return `
    <div style="margin-bottom: 16px;">
      <h3 style="font-size:14px;color:#6b7280;margin:0 0 8px">${T('analytics.sit.title')}</h3>
      <div class="stats-grid">${cards}</div>
    </div>`;
}

// ── Period bar chart ──────────────────────────────────────────────────────────

function _renderPeriodBarChart(periods) {
  const entries = Object.entries(periods)
    .sort(([a], [b]) => {
      const aOT = a.startsWith('OT'), bOT = b.startsWith('OT');
      if (!aOT && !bOT) return Number(a) - Number(b);
      if (!aOT) return -1; if (!bOT) return 1;
      return Number(a.slice(2)) - Number(b.slice(2));
    });

  if (entries.length === 0) return '';

  const maxPct = Math.max(...entries.map(([, v]) => v.total > 0 ? Math.round(v.goals / v.total * 100) : 0), 1);
  const barW = 40, gap = 14, chartH = 120, labelH = 20, valH = 18;
  const totalW = entries.length * (barW + gap) + gap;

  const bars = entries.map(([p, v], i) => {
    const pct = v.total > 0 ? Math.round(v.goals / v.total * 100) : 0;
    const barH = Math.max(Math.round((pct / maxPct) * chartH), pct > 0 ? 4 : 2);
    const x = gap + i * (barW + gap);
    const barY = valH + chartH - barH;
    return `
      <rect x="${x}" y="${barY}" width="${barW}" height="${barH}" rx="3" fill="#3b82f6" opacity="0.85"/>
      <text x="${x + barW / 2}" y="${valH + chartH - barH - 4}" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="600">${pct > 0 ? pct + '%' : ''}</text>
      <text x="${x + barW / 2}" y="${valH + chartH + labelH - 4}" text-anchor="middle" font-size="11" fill="#6b7280">${periodLabel(p)}</text>
      <text x="${x + barW / 2}" y="${valH + chartH + labelH + 12}" text-anchor="middle" font-size="10" fill="#9ca3af">${v.goals}/${v.total}</text>`;
  }).join('');

  return `
    <div class="period-chart-wrapper">
      <svg width="${totalW}" height="${valH + chartH + labelH + 20}" viewBox="0 0 ${totalW} ${valH + chartH + labelH + 20}">
        ${bars}
        <line x1="0" y1="${valH + chartH}" x2="${totalW}" y2="${valH + chartH}" stroke="#e5e7eb" stroke-width="1"/>
      </svg>
    </div>`;
}

function _renderAnalyticsStats(filtered, f) {
  if (filtered.length === 0) return '';
  const s = computeAnalyticsStats(filtered);
  const teamLabel = f.team || T('select.all_teams');
  const matchCount = new Set(filtered.map(e => String(e.match_id))).size;

  const zoneOrder = ['attack-center','attack-left','attack-right',
                     'midfield-center','midfield-left','midfield-right','own-half'];
  const zoneLabels = {
    'attack-center':   T('zone.attack_center'),
    'attack-left':     T('zone.attack_left'),
    'attack-right':    T('zone.attack_right'),
    'midfield-center': T('zone.midfield_center'),
    'midfield-left':   T('zone.midfield_left'),
    'midfield-right':  T('zone.midfield_right'),
    'own-half':        T('zone.own_half'),
  };

  const zoneRows = zoneOrder
    .filter(z => s.zones[z])
    .map(z => {
      const cnt = s.zones[z];
      const pct = Math.round((cnt / s.total) * 100);
      return `<tr><td>${zoneLabels[z]}</td><td>${cnt}</td><td>${pct}%</td></tr>`;
    }).join('');

  const periodRows = Object.entries(s.periods)
    .sort(([a],[b]) => {

      return Number(a.slice(2)) - Number(b.slice(2));

    .join('');

  return `
    <section class="analytics-section">
      <h2>${T('analytics.stats.title')}: ${escapeHtml(teamLabel)}</h2>
