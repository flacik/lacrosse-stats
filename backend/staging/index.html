        <div class="stat-box"><div class="stat-val">${matchCount}</div><div class="stat-lbl">${T('analytics.stats.matches')}</div></div>
        <div class="stat-box"><div class="stat-val">${s.total}</div><div class="stat-lbl">${T('analytics.stats.shots')}</div></div>
        <div class="stat-box"><div class="stat-val">${s.goals}</div><div class="stat-lbl">${T('analytics.stats.goals')}</div></div>
        <div class="stat-box"><div class="stat-val">${s.onTarget}</div><div class="stat-lbl">${T('analytics.stats.on_target')}</div></div>
        <div class="stat-box"><div class="stat-val">${s.pct}%</div><div class="stat-lbl">${T('analytics.stats.rate')}</div></div>
        <div class="stat-box"><div class="stat-val">${s.onPct}%</div><div class="stat-lbl">${T('analytics.stats.on_pct')}</div></div>
        ${s.manUp     ? `<div class="stat-box"><div class="stat-val">${s.manUp}</div><div class="stat-lbl">Man-up</div></div>` : ''}
        ${s.manDown   ? `<div class="stat-box"><div class="stat-val">${s.manDown}</div><div class="stat-lbl">Man-down</div></div>` : ''}
        ${s.fastBreak ? `<div class="stat-box"><div class="stat-val">${s.fastBreak}</div><div class="stat-lbl">Fast break</div></div>` : ''}
      </div>
      ${zoneRows ? `
        <h3>${T('analytics.zones.title')}</h3>
        <table class="stats-table">
          <thead><tr><th>${T('analytics.zones.zone')}</th><th>${T('analytics.stats.shots')}</th><th>%</th></tr></thead>
          <tbody>${zoneRows}</tbody>
        </table>` : ''}
      ${periodRows ? `
        <h3>${T('analytics.periods.title')}</h3>
        <table class="stats-table">
          <thead><tr><th>${T('analytics.periods.quarter')}</th><th>${T('analytics.stats.shots')}</th><th>${T('analytics.stats.goals')}</th><th>%</th></tr></thead>
          <tbody>${periodRows}</tbody>
        </table>` : ''}
      ${_renderShotResultDonut(s)}
      ${_renderSituationStats(s)}
      ${Object.keys(s.periods).length > 0 ? `
        <h3>${T('analytics.eff_period')}</h3>
        ${_renderPeriodBarChart(s.periods)}` : ''}
    </section>`;
}

// ── Heatmap ───────────────────────────────────────────────────────────────────

function _renderAnalyticsHeatmap(filteredTeamEvents, allMatchEvents, f) {
  if (!f.team) {
    return `<section class="analytics-section">
      <h2>Shot chart</h2>
      <p class="empty">${T('analytics.no_heatmap')}</p>
    </section>`;
  }

  const mode = APP.analyticsHeatmapMode || 'fired';
  const matchIds = new Set(filteredTeamEvents.map(e => String(e.match_id)));

  let chartEvents;
  if (mode === 'fired') {
    chartEvents = filteredTeamEvents;
  } else {
    chartEvents = allMatchEvents.filter(e =>
      matchIds.has(String(e.match_id)) && e.team_event !== f.team
    );
    if (f.period)   chartEvents = chartEvents.filter(e => String(e.period) === f.period);
    if (f.dateFrom) chartEvents = chartEvents.filter(e => e.match_date >= f.dateFrom);
    if (f.dateTo)   chartEvents = chartEvents.filter(e => e.match_date <= f.dateTo);
  }

  let svgContent;
  if (mode === 'efficiency') {
    svgContent = _buildZoneEfficiencySvg(filteredTeamEvents);
  } else {
    svgContent = _buildAnalyticsHalfFieldSvg(chartEvents, f.team);
  }

  return `
    <section class="analytics-section">
      <h2>Shot chart — ${escapeHtml(f.team)}</h2>
      <div class="heatmap-toggle">
        <button class="btn ${mode === 'fired'      ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="fired">${T('heatmap.fired')}</button>
        <button class="btn ${mode === 'conceded'   ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="conceded">${T('heatmap.conceded')}</button>
        <button class="btn ${mode === 'efficiency' ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="efficiency">${T('heatmap.efficiency')}</button>
      </div>
      <div class="field-half">${svgContent}</div>
    </section>`;
}

function _buildAnalyticsHalfFieldSvg(events, teamName) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 540 660');
  svg.setAttribute('class', 'field field-half');
  svg.setAttribute('xmlns', ns);

  const name = teamName || T('field.team');
  const mockMatch  = { id: '__analytics__', team_A: name, team_B: '__other__', team_A_side: 'left' };
  const mockEvents = events.map(e => Object.assign({}, e, { team_event: name }));
  const mockViewer = { view_mode: 'half-A', display_mode: 'heatmap' };

  drawHalfFieldChart(svg, mockMatch, mockEvents, mockViewer);
  return svg.outerHTML;
}

// ── Zone efficiency overlay ───────────────────────────────────────────────────

function _buildZoneEfficiencySvg(events) {
  const ZONE_RECTS = {
    'attack-left':     { x: 0,   y: 0,      w: 180, h: 337.92 },
    'attack-center':   { x: 180, y: 0,      w: 180, h: 337.92 },
    'attack-right':    { x: 360, y: 0,      w: 180, h: 337.92 },
    'midfield-left':   { x: 0,   y: 337.92, w: 180, h: 262.08 },
    'midfield-center': { x: 180, y: 337.92, w: 180, h: 262.08 },
    'midfield-right':  { x: 360, y: 337.92, w: 180, h: 262.08 },
  };
  const ZONE_LABELS = {
    'attack-left':     T('zone.attack_left_short'),
    'attack-center':   T('zone.attack_center_short'),
    'attack-right':    T('zone.attack_right_short'),
    'midfield-left':   T('zone.midfield_left_short'),
    'midfield-center': T('zone.midfield_center_short'),
    'midfield-right':  T('zone.midfield_right_short'),
  };

  const stats = {};
  Object.keys(ZONE_RECTS).forEach(z => { stats[z] = { total: 0, goals: 0 }; });
  events.forEach(e => {
    if (!e.zone_name || !stats[e.zone_name]) return;
    stats[e.zone_name].total++;
    if (e.result === 'gol') stats[e.zone_name].goals++;
  });

  function effColor(pct) {
    if (pct === 0) return 'rgba(209,213,219,0.5)';
    if (pct < 25)  return `rgba(249,115,22,${0.25 + pct / 100})`;
    return `rgba(22,163,74,${0.3 + pct / 100 * 0.6})`;
  }

  const zoneOverlays = Object.entries(ZONE_RECTS).map(([zone, rect]) => {
    const s = stats[zone];
    const pct = s.total > 0 ? Math.round((s.goals / s.total) * 100) : 0;
    const color = effColor(pct);
    const lx = rect.x + rect.w / 2;
    const ly = rect.y + rect.h / 2;
    return `
      <rect x="${rect.x}" y="${rect.y}" width="${rect.w}" height="${rect.h}" fill="${color}"/>
      <text x="${lx}" y="${ly - 8}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="white" font-weight="600" opacity="0.9">${ZONE_LABELS[zone]}</text>
      <text x="${lx}" y="${ly + 10}" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="white" font-weight="700">${pct}%</text>
      <text x="${lx}" y="${ly + 26}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="white" opacity="0.8">${s.goals}g / ${s.total}s</text>`;
  }).join('');

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 540 660');
  svg.setAttribute('class', 'field field-half');
  svg.setAttribute('xmlns', ns);
  svg.innerHTML = `
    <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">${T('zone.eff_title')}</text>
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="540" height="600" fill="#9bbf85"/>
      <line x1="0" y1="600" x2="540" y2="600" stroke="white" stroke-width="3"/>
      <line x1="0" y1="337.92" x2="540" y2="337.92" stroke="white" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.85"/>
      <line x1="0" y1="163.64" x2="540" y2="163.64" stroke="white" stroke-width="1.5" opacity="0.7"/>
      <line x1="0" y1="0" x2="540" y2="0" stroke="white" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="600" stroke="white" stroke-width="3"/>
      <line x1="540" y1="0" x2="540" y2="600" stroke="white" stroke-width="3"/>
      <line x1="180" y1="0" x2="180" y2="600" stroke="white" stroke-width="1" opacity="0.5"/>
      <line x1="360" y1="0" x2="360" y2="600" stroke="white" stroke-width="1" opacity="0.5"/>
      <circle cx="270" cy="163.64" r="27" fill="#9bbf85" stroke="white" stroke-width="2"/>
      <line x1="258" y1="163.64" x2="282" y2="163.64" stroke="white" stroke-width="5"/>
      ${zoneOverlays}
    </g>
    <g transform="translate(4, 618)">
      <rect x="0" y="0" width="14" height="10" rx="2" fill="rgba(209,213,219,0.5)" stroke="#ccc" stroke-width="0.5"/>
      <text x="18" y="9" font-size="9" fill="#6b7280">0%</text>
      <rect x="40" y="0" width="14" height="10" rx="2" fill="rgba(249,115,22,0.5)"/>
      <text x="58" y="9" font-size="9" fill="#6b7280">&lt;25%</text>
      <rect x="90" y="0" width="14" height="10" rx="2" fill="rgba(22,163,74,0.7)"/>
      <text x="108" y="9" font-size="9" fill="#6b7280">25%+</text>
    </g>`;
  return svg.outerHTML;
}

// ── Match history ─────────────────────────────────────────────────────────────

function _renderAnalyticsMatchHistory(filtered, allEvents, allMatches, f) {
  if (!f.team) return '';

  let relevantMatches = allMatches.filter(m =>
    m.team_A === f.team || m.team_B === f.team
  );
  if (f.tournament) relevantMatches = relevantMatches.filter(m => m.tournament === f.tournament);
  if (f.dateFrom)   relevantMatches = relevantMatches.filter(m => m.match_date >= f.dateFrom);
  if (f.dateTo)     relevantMatches = relevantMatches.filter(m => m.match_date <= f.dateTo);

  relevantMatches = [...relevantMatches].sort((a, b) => String(b.match_date).localeCompare(String(a.match_date)));

  if (relevantMatches.length === 0) return '';

  const rows = relevantMatches.map(m => {
    const mEvents = allEvents.filter(e => String(e.match_id) === String(m.id));
    const goalsA  = mEvents.filter(e => e.team_event === m.team_A && e.result === 'gol').length;
    const goalsB  = mEvents.filter(e => e.team_event === m.team_B && e.result === 'gol').length;
    const hasEvents = mEvents.length > 0;
    const opponent = m.team_A === f.team ? m.team_B : m.team_A;
    const myGoals  = m.team_A === f.team ? goalsA : goalsB;
    const oppGoals = m.team_A === f.team ? goalsB : goalsA;
    const result   = !hasEvents ? '— : —' : `${myGoals} : ${oppGoals}`;
    const won  = hasEvents && myGoals > oppGoals;
    const drew = hasEvents && myGoals === oppGoals;

    return `
      <tr class="match-history-row ${won ? 'won' : drew ? 'drew' : hasEvents ? 'lost' : ''}">
        <td>${escapeHtml(String(m.match_date))}</td>
        <td>${escapeHtml(m.tournament || '—')}</td>
        <td>${escapeHtml(opponent)}</td>
        <td class="match-result">${result}</td>
        <td><button class="btn btn-sm" data-action="open-viewer-from-analytics" data-arg="${escapeHtml(String(m.id))}">${T('btn.view')}</button></td>
      </tr>`;
  }).join('');

  return `
    <section class="analytics-section">
      <h2>${T('analytics.history.title')} — ${escapeHtml(f.team)}</h2>
      <table class="stats-table match-history-table">
        <thead><tr><th>${T('analytics.history.date')}</th><th>${T('analytics.history.tournament')}</th><th>${T('analytics.history.opponent')}</th><th>${T('analytics.history.result')}</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>`;
}

// ── Team comparison ───────────────────────────────────────────────────────────

function _renderAnalyticsCompareBody(f, events, matches) {
  if (!f.team || !f.team2) {
    return `<div class="empty" style="padding:32px;text-align:center">
      ${!f.team ? T('compare.choose_t1') : T('compare.choose_t2')}
    </div>`;
  }
  if (f.team === f.team2) {
    return `<div class="empty" style="padding:32px;text-align:center">${T('compare.different_teams')}</div>`;
  }

  const f2 = Object.assign({}, f, { team: f.team2 });
  const e1 = _analyticsApplyFilters(events, f);
  const e2 = _analyticsApplyFilters(events, f2);

  const m1count = new Set(e1.map(e => String(e.match_id))).size;
  const m2count = new Set(e2.map(e => String(e.match_id))).size;

  const h2hMatches = matches.filter(m => {
    if (f.tournament && m.tournament !== f.tournament) return false;
    if (f.dateFrom   && m.match_date < f.dateFrom)     return false;
    if (f.dateTo     && m.match_date > f.dateTo)       return false;
    return (m.team_A === f.team && m.team_B === f.team2) ||
           (m.team_A === f.team2 && m.team_B === f.team);
  });
  const h2hIds = new Set(h2hMatches.map(m => String(m.id)));

  let h2hE1 = events.filter(e => h2hIds.has(String(e.match_id)) && e.team_event === f.team);
  let h2hE2 = events.filter(e => h2hIds.has(String(e.match_id)) && e.team_event === f.team2);
  if (f.period)   { h2hE1 = h2hE1.filter(e => String(e.period) === f.period);  h2hE2 = h2hE2.filter(e => String(e.period) === f.period); }
  if (f.dateFrom) { h2hE1 = h2hE1.filter(e => e.match_date >= f.dateFrom);     h2hE2 = h2hE2.filter(e => e.match_date >= f.dateFrom); }
  if (f.dateTo)   { h2hE1 = h2hE1.filter(e => e.match_date <= f.dateTo);       h2hE2 = h2hE2.filter(e => e.match_date <= f.dateTo); }

  const t1MatchIds = new Set(e1.map(e => String(e.match_id)));
  const t2MatchIds = new Set(e2.map(e => String(e.match_id)));
  let conc1 = events.filter(e => t1MatchIds.has(String(e.match_id)) && e.team_event !== f.team);
  let conc2 = events.filter(e => t2MatchIds.has(String(e.match_id)) && e.team_event !== f.team2);
  if (f.period)   { conc1 = conc1.filter(e => String(e.period) === f.period);  conc2 = conc2.filter(e => String(e.period) === f.period); }
  if (f.dateFrom) { conc1 = conc1.filter(e => e.match_date >= f.dateFrom);     conc2 = conc2.filter(e => e.match_date >= f.dateFrom); }
  if (f.dateTo)   { conc1 = conc1.filter(e => e.match_date <= f.dateTo);       conc2 = conc2.filter(e => e.match_date <= f.dateTo); }

  const s1   = computeAnalyticsStats(e1);
  const s2   = computeAnalyticsStats(e2);
  const def1 = computeAnalyticsStats(conc1);
  const def2 = computeAnalyticsStats(conc2);

  return `
    ${_renderCmpStatsSection(s1, s2, def1, def2, m1count, m2count, f)}
    ${_renderCmpHeatmaps(e1, e2, conc1, conc2, f)}
    ${h2hMatches.length > 0 ? _renderCmpH2H(h2hMatches, h2hE1, h2hE2, f, events) : _renderCmpH2HEmpty(f)}
    ${_renderCmpGoalies(e1, e2, f, events, matches)}
    ${_renderCmpPeriods(s1, s2, f)}`;
}

function _cmpRow(label, v1, v2, lowerIsBetter) {
  const n1 = parseFloat(String(v1).replace('%', ''));
  const n2 = parseFloat(String(v2).replace('%', ''));
  const eq   = isNaN(n1) || isNaN(n2) || n1 === n2;
  const win1 = !eq && (lowerIsBetter ? n1 < n2 : n1 > n2);
  const win2 = !eq && (lowerIsBetter ? n2 < n1 : n2 > n1);
  return `<tr>
    <td class="cmp-val ${win1 ? 'cmp-better' : ''}" style="text-align:right;padding-right:14px">${v1}</td>
    <td class="cmp-label" style="text-align:center;min-width:140px">${label}</td>
    <td class="cmp-val ${win2 ? 'cmp-better' : ''}" style="padding-left:14px">${v2}</td>
  </tr>`;
}

function _cmpThead(t1, t2, label) {
  return `<thead><tr>
    <th style="text-align:right;padding-right:14px;font-size:14px">${t1}</th>
    <th style="text-align:center;color:#6b7280;font-size:12px;font-weight:500;min-width:140px">${label || T('analytics.stats.title')}</th>
    <th style="padding-left:14px;font-size:14px">${t2}</th>
  </tr></thead>`;
}

function _renderCmpStatsSection(s1, s2, def1, def2, m1count, m2count, f) {
  const t1 = escapeHtml(f.team);
  const t2 = escapeHtml(f.team2);
  return `
    <section class="analytics-section">
      <h2>${T('compare.general.title')}</h2>
      <table class="cmp-table" style="width:100%;max-width:580px">
        ${_cmpThead(t1, t2, T('compare.atk'))}
        <tbody>
          ${_cmpRow(T('analytics.stats.matches'),  m1count, m2count, false)}
          ${_cmpRow(T('analytics.stats.shots'),    s1.total, s2.total, false)}
          ${_cmpRow(T('analytics.stats.goals'),    s1.goals, s2.goals, false)}
          ${_cmpRow(T('analytics.stats.on_target'),s1.onTarget, s2.onTarget, false)}
          ${_cmpRow(T('analytics.stats.rate'),     s1.pct + '%', s2.pct + '%', false)}
          ${_cmpRow(T('analytics.stats.on_pct'),   s1.onPct + '%', s2.onPct + '%', false)}
          ${(s1.manUp > 0 || s2.manUp > 0) ? _cmpRow('Man-up', s1.manUp, s2.manUp, false) : ''}
          ${(s1.manDown > 0 || s2.manDown > 0) ? _cmpRow('Man-down', s1.manDown, s2.manDown, false) : ''}
          ${(s1.fastBreak > 0 || s2.fastBreak > 0) ? _cmpRow('Fast break', s1.fastBreak, s2.fastBreak, false) : ''}
        </tbody>
      </table>
      <h3 style="margin-top:20px">${T('compare.def.title')}</h3>
      <table class="cmp-table" style="width:100%;max-width:580px">
        ${_cmpThead(t1, t2, T('compare.def'))}
        <tbody>
          ${_cmpRow(T('compare.shots_conceded'),   def1.total, def2.total, true)}
          ${_cmpRow(T('compare.goals_conceded'),   def1.goals, def2.goals, true)}
          ${_cmpRow(T('compare.on_target_conceded'),def1.onTarget, def2.onTarget, true)}
          ${_cmpRow(T('compare.rival_rate'),       def1.pct + '%', def2.pct + '%', true)}
        </tbody>
      </table>
    </section>`;
}

function _renderCmpHeatmaps(e1, e2, conc1, conc2, f) {
  const t1   = escapeHtml(f.team);
  const t2   = escapeHtml(f.team2);
  const mode = APP.analyticsHeatmapMode || 'fired';

  let svg1, svg2;
  if (mode === 'efficiency') {
    svg1 = _buildZoneEfficiencySvg(e1);
    svg2 = _buildZoneEfficiencySvg(e2);
  } else if (mode === 'conceded') {
    svg1 = _buildAnalyticsHalfFieldSvg(conc1, f.team);
    svg2 = _buildAnalyticsHalfFieldSvg(conc2, f.team2);
  } else {
    svg1 = _buildAnalyticsHalfFieldSvg(e1, f.team);
    svg2 = _buildAnalyticsHalfFieldSvg(e2, f.team2);
  }

  return `
    <section class="analytics-section">
      <h2>Shot chart</h2>
      <div class="heatmap-toggle">
        <button class="btn ${mode === 'fired'      ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="fired">${T('heatmap.fired')}</button>
        <button class="btn ${mode === 'conceded'   ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="conceded">${T('heatmap.conceded')}</button>
        <button class="btn ${mode === 'efficiency' ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="efficiency">${T('heatmap.efficiency')}</button>
      </div>
      <div class="compare-heatmaps">
        <div class="compare-heatmap-col">
          <div class="compare-col-header">${t1}</div>
          <div class="field-half">${svg1}</div>
        </div>
        <div class="compare-heatmap-col">
          <div class="compare-col-header">${t2}</div>
          <div class="field-half">${svg2}</div>
        </div>
      </div>
    </section>`;
}

function _renderCmpH2HEmpty(f) {
  return `
    <section class="analytics-section">
      <h2>${T('compare.h2h.title')}</h2>
      <p class="empty">${T('compare.h2h.empty_pre')} ${escapeHtml(f.team)} ${T('compare.h2h.empty_and')} ${escapeHtml(f.team2)} ${T('compare.h2h.empty_suf')}</p>
    </section>`;
}

function _renderCmpH2H(h2hMatches, h2hE1, h2hE2, f, allEvents) {
  const t1 = escapeHtml(f.team);
  const t2 = escapeHtml(f.team2);

  let t1wins = 0, t2wins = 0, draws = 0, t1totalG = 0, t2totalG = 0;

  const rows = [...h2hMatches]
    .sort((a, b) => String(b.match_date).localeCompare(String(a.match_date)))
    .map(m => {
      const mE    = allEvents.filter(e => String(e.match_id) === String(m.id));
      const gA    = mE.filter(e => e.team_event === m.team_A && e.result === 'gol').length;
      const gB    = mE.filter(e => e.team_event === m.team_B && e.result === 'gol').length;
      const t1g   = m.team_A === f.team ? gA : gB;
      const t2g   = m.team_A === f.team ? gB : gA;
      const hasEv = mE.length > 0;
      if (hasEv) { t1totalG += t1g; t2totalG += t2g; }
      if (hasEv && t1g > t2g) t1wins++;
      else if (hasEv && t2g > t1g) t2wins++;
      else if (hasEv) draws++;
      const result = hasEv ? `${t1g} : ${t2g}` : '— : —';
      const won    = hasEv && t1g > t2g;
      const drew   = hasEv && t1g === t2g;
      return `<tr class="match-history-row ${won ? 'won' : drew ? 'drew' : hasEv ? 'lost' : ''}">
        <td>${escapeHtml(String(m.match_date))}</td>
        <td>${escapeHtml(m.tournament || '—')}</td>
        <td class="match-result">${result}</td>
        <td><button class="btn btn-sm" data-action="open-viewer-from-analytics" data-arg="${escapeHtml(String(m.id))}">${T('btn.view')}</button></td>
      </tr>`;
    }).join('');

  const s1    = computeAnalyticsStats(h2hE1);
  const s2    = computeAnalyticsStats(h2hE2);
  const total = t1wins + t2wins + draws;
  const c1    = t1wins >= t2wins && total > 0 ? '#16a34a' : '#374151';
  const c2    = t2wins >= t1wins && total > 0 ? '#16a34a' : '#374151';

  return `
    <section class="analytics-section">
      <h2>${T('compare.h2h.title')} (${h2hMatches.length})</h2>
      <div class="cmp-h2h-summary">
        <div class="cmp-h2h-team">
          <div style="font-size:12px;color:#6b7280;margin-bottom:4px">${t1}</div>
          <div style="font-size:32px;font-weight:700;color:${c1}">${t1wins}</div>
          <div class="cmp-h2h-label">${T('compare.h2h.wins')}</div>
        </div>
        <div class="cmp-h2h-mid">
          <div style="font-size:22px;font-weight:700;color:#6b7280">${draws}</div>
          <div class="cmp-h2h-label">${T('compare.h2h.draws')}</div>
        </div>
        <div class="cmp-h2h-team">
          <div style="font-size:12px;color:#6b7280;margin-bottom:4px">${t2}</div>
          <div style="font-size:32px;font-weight:700;color:${c2}">${t2wins}</div>
          <div class="cmp-h2h-label">${T('compare.h2h.wins')}</div>
        </div>
      </div>
      <table class="stats-table match-history-table" style="margin:16px 0">
        <thead><tr><th>${T('analytics.history.date')}</th><th>${T('analytics.history.tournament')}</th><th>${t1} : ${t2}</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${(h2hE1.length > 0 || h2hE2.length > 0) ? `
      <h3>${T('compare.h2h.stats')}</h3>
      <table class="cmp-table" style="width:100%;max-width:580px">
        ${_cmpThead(t1, t2, 'H2H')}
        <tbody>
          ${_cmpRow(T('compare.h2h.goals_scored'),  t1totalG, t2totalG, false)}
          ${_cmpRow(T('analytics.stats.shots'),     s1.total, s2.total, false)}
          ${_cmpRow(T('analytics.stats.rate'),      s1.pct + '%', s2.pct + '%', false)}
          ${_cmpRow(T('analytics.stats.on_pct'),    s1.onPct + '%', s2.onPct + '%', false)}
        </tbody>
      </table>` : ''}
    </section>`;
}

function _renderCmpGoalies(e1, e2, f, allEvents, allMatches) {
  const t1   = escapeHtml(f.team);
  const t2   = escapeHtml(f.team2);
  const f2   = Object.assign({}, f, { team: f.team2 });
  const data1 = _computeGoalieAnalytics(e1, allEvents, allMatches, f,  { col: 'savePct', dir: 'desc' });
  const data2 = _computeGoalieAnalytics(e2, allEvents, allMatches, f2, { col: 'savePct', dir: 'desc' });

  if (data1.totalShotsOnGoal === 0 && data2.totalShotsOnGoal === 0) return '';

  function goalieCol(data, teamLabel) {
    if (data.totalShotsOnGoal === 0) {
      return `<div class="compare-heatmap-col">
        <div class="compare-col-header">${teamLabel}</div>
        <p class="empty">${T('compare.goalies.no_data')}</p>
      </div>`;
    }
    const pctColor = data.avgSavePct >= 70 ? '#15803d' : data.avgSavePct >= 55 ? '#1d4ed8' : '#b91c1c';
    const goalieRows = data.list.slice(0, 4).map(g => {
      const nl  = g.number !== null ? `#${escapeHtml(g.number)}` : '—';
      const pct = g.savePct !== null ? g.savePct + '%' : '—';
      const col = g.savePct >= 70 ? '#15803d' : g.savePct >= 55 ? '#1d4ed8' : '#b91c1c';
      return `<tr>
        <td style="font-weight:600">${nl}</td>
        <td class="num">${g.matchCount}</td>
        <td class="num">${g.shotsOnGoal}</td>
        <td class="num">${g.saves}</td>
        <td class="num" style="font-weight:700;color:${col}">${pct}</td>
      </tr>`;
    }).join('');
    return `<div class="compare-heatmap-col">
      <div class="compare-col-header">${teamLabel}</div>
      <div class="stat-box" style="display:inline-block;margin-bottom:12px;min-width:180px;text-align:center">
        <div style="font-size:28px;font-weight:700;color:${pctColor}">${data.avgSavePct !== null ? data.avgSavePct + '%' : '—'}</div>
        <div style="font-size:12px;color:#6b7280">${T('analytics.goalies.avg_save')}</div>
        <div style="font-size:12px;color:#6b7280">${data.totalShotsOnGoal} ${T('compare.goalies.shots_st')} · ${data.matchCount} ${T('compare.goalies.matches_st')}</div>
      </div>
      <table class="stats-table" style="width:100%;font-size:13px">
        <thead><tr><th>${T('compare.goalies.nr')}</th><th>${T('analytics.goalies.matches')}</th><th>${T('compare.goalies.shots_on')}</th><th>${T('compare.goalies.saves')}</th><th>${T('analytics.goalies.save_pct')}</th></tr></thead>
        <tbody>${goalieRows}</tbody>
      </table>
    </div>`;
  }

  return `
    <section class="analytics-section">
      <h2>${T('analytics.goalies.title')}</h2>
      <div class="compare-heatmaps">
        ${goalieCol(data1, t1)}
        ${goalieCol(data2, t2)}
      </div>
    </section>`;
}

function _renderCmpPeriods(s1, s2, f) {
  const t1 = escapeHtml(f.team);
  const t2 = escapeHtml(f.team2);

  const allPeriodKeys = new Set([...Object.keys(s1.periods), ...Object.keys(s2.periods)]);
  if (allPeriodKeys.size === 0) return '';

  const chart1 = _renderPeriodBarChart(s1.periods);
  const chart2 = _renderPeriodBarChart(s2.periods);
  if (!chart1 && !chart2) return '';

  return `
    <section class="analytics-section">
      <h2>${T('compare.periods.title')}</h2>
      <div class="compare-heatmaps">
        <div class="compare-heatmap-col">
          <div class="compare-col-header">${t1}</div>
          ${chart1 || `<p class="empty" style="font-size:13px">${T('compare.no_data')}</p>`}
        </div>
        <div class="compare-heatmap-col">
          <div class="compare-col-header">${t2}</div>
          ${chart2 || `<p class="empty" style="font-size:13px">${T('compare.no_data')}</p>`}
        </div>
      </div>
    </section>`;
}

function uniqueTeamNames() {
  const names = new Set();
  (DATA.scheduledMatches || []).forEach(m => {
    if (m.team_A) names.add(m.team_A.trim());
    if (m.team_B) names.add(m.team_B.trim());
  });
  return [...names].sort((a, b) => a.localeCompare(b));
}

  if (!APP.adminFilter) {

      range: 'upcoming',
      tournament: 'all',
      status: 'all'

      rows += `
        <li class="admin-row">
          <div class="admin-row-main">

function renderMatchesCard(filter) {
  const today = todayISO();
  const all = DATA.scheduledMatches.slice().sort((a, b) => {
    if (a.match_date !== b.match_date) return a.match_date < b.match_date ? -1 : 1;
    return (a.team_A || '').localeCompare(b.team_A || '');
  });

  const filtered = all.filter(m => {
    if (filter.range === 'today'    && m.match_date !== today) return false;
    if (filter.range === 'upcoming' && m.match_date <  today)  return false;
    if (filter.range === 'past'     && m.match_date >= today)  return false;
    if (filter.tournament !== 'all' && m.tournament !== filter.tournament) return false;
    if (filter.status     !== 'all' && m.status     !== filter.status)     return false;
    return true;
  });

  const tournamentOpts = [`<option value="all">${T('admin.status.all')}</option>`]
    .concat(DATA.tournaments.map(t => `<option value="${escapeHtml(t.name)}" ${filter.tournament === t.name ? 'selected' : ''}>${escapeHtml(t.name)}</option>`))
    .join('');

  const statusLabels = {
    scheduled: T('status.scheduled_short'),
    live:      T('status.in_progress'),
    finished:  T('status.finished'),
  };

  let rows = '';
  if (filtered.length === 0) {
    rows = `<div class="admin-empty">${T('admin.no_matches')}</div>`;
  } else {
    rows = '<ul class="admin-list">';
    filtered.forEach(m => {
      const eventCount = DATA.events.filter(e => e.match_id === m.id).length;
      const isToday = m.match_date === today;
      const statusLbl = statusLabels[m.status] || m.status;
      rows += `
        <li class="admin-row">
          <div class="admin-row-main">
            <div class="admin-match-line">
              <span class="admin-date ${isToday ? 'today' : ''}">${m.match_date}</span>
              <span class="admin-tournament">${escapeHtml(m.tournament || '—')}</span>
            </div>
            <div class="admin-match-teams">
              <strong>${escapeHtml(m.team_A)}</strong>
              <span class="vs">vs</span>
              <strong>${escapeHtml(m.team_B)}</strong>
              <span class="admin-status status-${m.status}">${statusLbl}</span>
              ${eventCount > 0 ? `<span class="admin-event-count">${eventCount} ${T('admin.events')}</span>` : ''}
              ${m.video_url ? `<a class="admin-video-link" href="${escapeHtml(m.video_url)}" target="_blank" rel="noopener" title="${T('btn.view')}">${T('admin.video')}</a>` : ''}
            </div>
          </div>
          <div class="admin-row-actions">
            <button class="btn" data-action="match-edit" data-arg="${m.id}">${T('btn.edit')}</button>
            <button class="btn btn-danger" data-action="match-delete" data-arg="${m.id}">${T('btn.delete')}</button>
          </div>
        </li>
      `;
    });
    rows += '</ul>';
  }

  return `
    <section class="admin-card">
      <header class="admin-card-header">
        <h2>${T('admin.matches.title')}</h2>
        <button class="btn btn-primary" data-action="match-new">${T('btn.plan_match')}</button>
      </header>
      <div class="admin-filters">
        <div class="toggle-group">
          <button class="btn ${filter.range === 'upcoming' ? 'btn-active' : ''}" data-action="admin-set-range" data-arg="upcoming">${T('admin.range.upcoming')}</button>
          <button class="btn ${filter.range === 'today'    ? 'btn-active' : ''}" data-action="admin-set-range" data-arg="today">${T('admin.range.today')}</button>
          <button class="btn ${filter.range === 'past'     ? 'btn-active' : ''}" data-action="admin-set-range" data-arg="past">${T('admin.range.past')}</button>
          <button class="btn ${filter.range === 'all'      ? 'btn-active' : ''}" data-action="admin-set-range" data-arg="all">${T('admin.range.all')}</button>
        </div>
        <label class="admin-filter-field">
          <span>${T('field.tournament')}</span>
          <select id="admin-filter-tournament" data-action="admin-set-tournament">${tournamentOpts}</select>
        </label>
        <label class="admin-filter-field">
          <span>${T('field.status')}</span>
          <select id="admin-filter-status" data-action="admin-set-status">
            <option value="all"       ${filter.status === 'all'       ? 'selected' : ''}>${T('admin.status.all')}</option>
            <option value="scheduled" ${filter.status === 'scheduled' ? 'selected' : ''}>${T('admin.status.scheduled')}</option>
            <option value="live"      ${filter.status === 'live'      ? 'selected' : ''}>${T('admin.status.live')}</option>
            <option value="finished"  ${filter.status === 'finished'  ? 'selected' : ''}>${T('admin.status.finished')}</option>
          </select>
        </label>
      </div>
      ${rows}
    </section>
  `;
}

function renderCsvImportCard() {
  const ci = APP.csvImport;
  let previewHtml = '';

  if (ci) {
    const validRows = ci.rows.filter(r => !r._error);
    const errorRows = ci.rows.filter(r => r._error);

    const tableRows = ci.rows.map(r => `
      <tr class="${r._error ? 'csv-row-error' : ''}">
        <td class="csv-linenum">${r._lineNum}</td>
        <td>${escapeHtml(r.tournament)}</td>
        <td>${escapeHtml(r.match_date)}</td>
        <td>${escapeHtml(r.team_A)}</td>
        <td>${escapeHtml(r.team_B)}</td>
        <td>${r.video_url ? '<span class="csv-link-badge">🔗</span>' : ''}</td>
        <td>${r._error ? `<span class="csv-err-msg">${escapeHtml(r._error)}</span>` : ''}</td>
      </tr>
    `).join('');

    previewHtml = `
      <div class="csv-preview">
        <div class="csv-stats">
          <span class="csv-stat-ok">${validRows.length} ${T('admin.csv.valid')}</span>
          ${errorRows.length > 0 ? `<span class="csv-stat-err">${errorRows.length} ${T('admin.csv.errors')}</span>` : ''}
        </div>
        ${ci.rows.length > 0 ? `
          <div class="csv-table-wrap">
            <table class="csv-table">
              <thead><tr><th>${T('admin.csv.col.num')}</th><th>${T('admin.csv.col.tournament')}</th><th>${T('admin.csv.col.date')}</th><th>${T('admin.csv.col.team_a')}</th><th>${T('admin.csv.col.team_b')}</th><th>${T('admin.csv.col.link')}</th><th></th></tr></thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        ` : `<div class="admin-empty">${T('admin.csv.empty')}</div>`}
        <div class="csv-actions">
          ${validRows.length > 0 && !ci.importing
            ? `<button class="btn btn-primary" data-action="csv-import-submit">${T('admin.csv.import_btn')} ${validRows.length} ${T_match(validRows.length)}</button>`
            : ''}
          ${ci.importing ? `<span class="csv-importing">${T('admin.csv.importing')}</span>` : ''}
          <button class="btn" data-action="csv-import-cancel">${T('btn.cancel')}</button>
        </div>
      </div>
    `;
  }

  return `
    <section class="admin-card">
      <header class="admin-card-header">
        <h2>${T('admin.csv.title')}</h2>
        <label class="btn btn-primary csv-file-label" for="csv-import-input">${T('btn.upload_csv')}</label>
        <input type="file" id="csv-import-input" accept=".csv,.txt" style="display:none" data-action="csv-import-file">
      </header>
      <div class="admin-card-hint">${T('admin.csv.hint')}</div>
      ${previewHtml}
    </section>
  `;
}

  const url = selectedId ? baseUrl + '?match=' + encodeURIComponent(selectedId) : baseUrl;

  const matchOpts = [`<option value="">${T('admin.embed.all')}</option>`]
    .concat(
      DATA.scheduledMatches.slice()
        .sort((a, b) => b.match_date.localeCompare(a.match_date))
        .map(m => {
          const label = `${m.match_date} — ${escapeHtml(m.team_A)} vs ${escapeHtml(m.team_B)}${m.tournament ? ' (' + escapeHtml(m.tournament) + ')' : ''}`;
          return `<option value="${escapeHtml(String(m.id))}" ${selectedId === String(m.id) ? 'selected' : ''}>${label}</option>`;
        })

  return `

            ${matchOpts}

        </div>
        <textarea id="embed-snippet" readonly class="embed-textarea">${escapeHtml(snippet)}</textarea>
        <div class="embed-actions">
          <button class="btn btn-primary" data-action="embed-copy">${T('btn.copy_code')}</button>

        <label>${T('field.tournament')}
          <select data-action="standings-set-tournament">${tourOptions}</select>
        </label>
      </div>
      ${sorted.length === 0
        ? `<p class="standings-empty">${T('standings.empty')}</p>`
        : _renderStandingsTable(sorted, APP.standingsSort)
      }
    </div>`;
}

function _computeStandings(events, matches, tournament) {
  const tourMatches = matches.filter(m =>
    m.tournament === tournament && m.status === 'finished'
  );
  if (tourMatches.length === 0) return [];

  const teamSet = new Set();
  tourMatches.forEach(m => {
    if (m.team_A) teamSet.add(m.team_A);
    if (m.team_B) teamSet.add(m.team_B);
  });

  const tourEvents = events.filter(e => e.tournament === tournament);

  return [...teamSet].map(team => {
    const teamMatches = tourMatches.filter(m => m.team_A === team || m.team_B === team);
    const matchIds    = new Set(teamMatches.map(m => String(m.id)));
    const teamEvents  = tourEvents.filter(e => matchIds.has(String(e.match_id)) && e.team_event === team);
    const oppEvents   = tourEvents.filter(e => matchIds.has(String(e.match_id)) && e.team_event !== team);
    const goals       = teamEvents.filter(e => e.result === 'gol').length;
    const celne       = teamEvents.filter(e => e.result === 'celny').length;
    const niecelne    = teamEvents.filter(e => e.result === 'niecelny').length;
    const shots       = goals + celne + niecelne;
    const conceded    = oppEvents.filter(e => e.result === 'gol').length;
    const manUpGoals  = teamEvents.filter(e => e.result === 'gol' && e.man_up).length;
    const pctSkut     = shots > 0 ? Math.round(goals / shots * 100) : 0;
    const pctCel      = shots > 0 ? Math.round((goals + celne) / shots * 100) : 0;
    return { team, matches: teamMatches.length, goals, conceded, celne, niecelne, pctSkut, pctCel, manUpGoals };
  });
}

function _sortStandings(rows, sort) {
  const key = sort.col;
  const dir = sort.dir === 'asc' ? 1 : -1;
  const keyMap = {
    team:        r => r.team,
    matches:     r => r.matches,
    goals:       r => r.goals,
    conceded:    r => r.conceded,
    celne:       r => r.celne,
    niecelne:    r => r.niecelne,
    pctSkut:     r => r.pctSkut,
    pctCel:      r => r.pctCel,
    manUpGoals:  r => r.manUpGoals,
  };
  const fn = keyMap[key] || (r => r.goals);
  return [...rows].sort((a, b) => {
    const av = fn(a), bv = fn(b);
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return (b.goals - a.goals) * dir;
  });
}

function _renderStandingsTable(rows, sort) {
  const cols = [
    { key: 'team',       labelKey: 'standings.col.team',       align: 'left'   },
    { key: 'matches',    labelKey: 'standings.col.matches',     align: 'center' },
    { key: 'goals',      labelKey: 'standings.col.goals_plus',  align: 'center' },
    { key: 'conceded',   labelKey: 'standings.col.goals_minus', align: 'center' },
    { key: 'celne',      labelKey: 'standings.col.on_target',   align: 'center' },
    { key: 'niecelne',   labelKey: 'standings.col.off_target',  align: 'center' },
    { key: 'pctSkut',    labelKey: 'standings.col.pct_skut',    align: 'center' },
    { key: 'pctCel',     labelKey: 'standings.col.pct_cel',     align: 'center' },
    { key: 'manUpGoals', labelKey: 'standings.col.man_up',      align: 'center' },
  ];

  const headers = cols.map(c => {
    const isActive = sort.col === c.key;
    const arrow    = isActive ? (sort.dir === 'desc' ? ' ▼' : ' ▲') : '';
    return `<th class="sortable ${isActive ? 'sort-active' : ''}" data-action="standings-sort" data-arg="${c.key}" style="text-align:${c.align}">${T(c.labelKey)}${arrow}</th>`;
  }).join('');

  const bodyRows = rows.map((r, i) => `
    <tr class="standings-row">
      <td class="standings-rank">${i + 1}. ${escapeHtml(r.team)}</td>
      <td class="center">${r.matches}</td>
      <td class="center goals-scored">${r.goals}</td>
      <td class="center goals-conceded">${r.conceded}</td>
      <td class="center">${r.celne}</td>
      <td class="center">${r.niecelne}</td>
      <td class="center">${r.pctSkut}%</td>
      <td class="center">${r.pctCel}%</td>
      <td class="center">${r.manUpGoals || '—'}</td>
    </tr>`).join('');

  return `
    <table class="standings-table">
      <thead><tr>${headers}</tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>`;
}

// ── PDF Report ────────────────────────────────────────────────────────────────
// Opens a new window with an A4-optimised report and calls window.print().
// Two modes: openMatchReport(matchId) — single-match report from the Viewer
//            openAnalyticsReport()    — report from Analytics (active filters)

function openMatchReport(matchId) {
  var match = DATA.scheduledMatches.find(function(m) {
    return String(m.id) === String(matchId);
  });
  if (!match) { alert(T('error.match_not_found_alert')); return; }

  var allEvents  = DATA.events.filter(function(e) {
    return String(e.match_id) === String(matchId);
  });
  var shotEvents = allEvents.filter(function(e) {
    return isShotEvent(e);
  });

  var score     = computeScore(matchId);
  var statsA    = computeTeamStats(matchId, match.team_A, shotEvents);
  var statsB    = computeTeamStats(matchId, match.team_B, shotEvents);
  var goalies   = computeGoalieStats(match, allEvents);
  var perPeriod = computePerPeriodStats(matchId, match);
  var situation = computeSituationStats(matchId, match, shotEvents);

  var evA = shotEvents.filter(function(e) { return e.team_event === match.team_A; });
  var evB = shotEvents.filter(function(e) { return e.team_event === match.team_B; });
  var svgA = _reportHalfFieldSvg(evA, match.team_A, false);
  var svgB = _reportHalfFieldSvg(evB, match.team_B, false);

  var title    = escapeHtml(match.team_A) + ' vs ' + escapeHtml(match.team_B);
  var subtitle = [match.tournament, match.match_date].filter(Boolean).map(escapeHtml).join(' · ');

  var html = _reportShell(title, subtitle, [
    _sectionMatchHeader(match, score),
    _sectionShotStats(statsA, statsB, match),
    _sectionSituations(situation, match),
    _sectionGoalies(goalies, match),
    _sectionPerPeriod(perPeriod, match),
    _sectionShotCharts(svgA, svgB, match),
  ]);

  _openPrintWindow(html);
}

function openAnalyticsReport() {
  var data = APP.analyticsData;
  if (!data || !data.events) { alert(T('error.no_analytics')); return; }

  var f        = APP.analyticsFilters;
  var filtered = _analyticsApplyFilters(data.events, f);
  if (filtered.length === 0) { alert(T('error.no_filtered')); return; }

  var s          = computeAnalyticsStats(filtered);
  var goalieData = _computeGoalieAnalytics(filtered, data.events, data.matches, f, APP.analyticsGoalieSort);

  var teamLabel = f.team || T('report.all_teams');
  var parts     = [f.tournament, teamLabel, f.period ? periodLabel(f.period) : '', f.dateFrom, f.dateTo].filter(Boolean);
  var subtitle  = parts.join(' · ');

  var svgOff = '', svgDef = '';
  if (f.team) {
    svgOff = filtered.length > 0 ? _reportHalfFieldSvg(filtered, f.team) : '';
    var matchIds  = new Set(filtered.map(function(e) { return String(e.match_id); }));
    var conceded  = data.events.filter(function(e) {
      return matchIds.has(String(e.match_id)) &&
             e.team_event !== f.team &&
             isShotEvent(e);
    });
    svgDef = conceded.length > 0 ? _reportHalfFieldSvg(conceded, conceded[0].team_event || '__opp__', true) : '';
  }

  var html = _reportShell(T('report.analytics') + ' — ' + escapeHtml(teamLabel), subtitle, [
    _sectionAnalyticsSummary(s, filtered, f),
    _sectionAnalyticsZones(s),
    _sectionAnalyticsPeriods(s),
    _sectionAnalyticsSituations(s),
    _sectionAnalyticsGoalies(goalieData),
    (svgOff || svgDef) ? _sectionAnalyticsShotCharts(svgOff, svgDef, f.team) : '',
    _sectionMatchHistory(filtered, data.events, data.matches, f),
  ]);

  _openPrintWindow(html);
}

// ── Document shell ────────────────────────────────────────────────────────────

function _reportShell(title, subtitle, sections) {
  return '<!DOCTYPE html><html lang="' + APP.lang + '"><head>' +
    '<meta charset="UTF-8">' +
    '<title>' + title + '</title>' +
    '<style>' + _reportCss() + '</style>' +
    '</head><body>' +
    '<div class="doc-header">' +
      '<div class="doc-title">' + title + '</div>' +
      (subtitle ? '<div class="doc-subtitle">' + subtitle + '</div>' : '') +
      '<div class="doc-brand">Lacrosse Stats</div>' +
    '</div>' +
    sections.filter(Boolean).join('') +
    '<script>window.onload=function(){window.print();}<\/script>' +
    '</body></html>';
}

function _openPrintWindow(html) {
  var w = window.open('', '_blank');
  if (!w) { alert(T('popup.blocked')); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

function _sectionMatchHeader(match, score) {

    '<div class="banner-score">' +
      '<span class="team-a">' + escapeHtml(match.team_A) + '</span>' +
      '<span class="score-num">' + score.A + ' : ' + score.B + '</span>' +
      '<span class="team-b">' + escapeHtml(match.team_B) + '</span>' +
    '</div>' +
    '<div class="banner-meta">' + escapeHtml(match.tournament || '') + ' &nbsp;|&nbsp; ' + escapeHtml(String(match.match_date || '')) + ' &nbsp;|&nbsp; ' + status + '</div>' +
  '</div>';
}

function _sectionShotStats(sA, sB, match) {
  var fmt = function(v, isRate) { return v === '—' ? '—' : (isRate ? v + '%' : v); };
  var rows = [
    [T('report.rows.shots'),     sA.total,              sB.total,              false],
    [T('report.rows.goals'),     sA.goals,              sB.goals,              false],
    [T('report.rows.on_target'), sA.onTarget,           sB.onTarget,           false],
    [T('report.rows.off_target'),sA.offTarget,          sB.offTarget,          false],
    [T('report.rows.rate'),      fmt(sA.goalRate,1),    fmt(sB.goalRate,1),    false],
    [T('report.rows.on_rate'),   fmt(sA.onTargetRate,1),fmt(sB.onTargetRate,1),false],
  ];
  var tbody = rows.map(function(r) {
    return '<tr><td class="num-a">' + r[1] + '</td><td class="lbl">' + r[0] + '</td><td class="num-b">' + r[2] + '</td></tr>';
  }).join('');
  return _section(T('report.shot_stats'),
    '<table class="cmp-table">' +
    '<thead><tr><th class="num-a">' + escapeHtml(match.team_A) + '</th><th class="lbl"></th><th class="num-b">' + escapeHtml(match.team_B) + '</th></tr></thead>' +
    '<tbody>' + tbody + '</tbody></table>');
}

function _sectionSituations(situation, match) {
  var sits = [
    { key: 'manUp',    label: 'Man-up ↑'   },
    { key: 'equal',    label: '5v5 ·'      },
    { key: 'manDown',  label: 'Man-down ↓' },
    { key: 'fastBreak',label: 'Fast break →'},
  ];
  var rows = sits.map(function(s) {
    var dA = situation[s.key].A, dB = situation[s.key].B;
    if (!dA || !dB) return '';
    if (dA.shots === 0 && dB.shots === 0) return '';
    return '<tr>' +
      '<td class="num-a">' + dA.shots + '/' + dA.goals + ' (' + (dA.rate === '—' ? '—' : dA.rate + '%') + ')</td>' +
      '<td class="lbl">' + s.label + '</td>' +
      '<td class="num-b">' + dB.shots + '/' + dB.goals + ' (' + (dB.rate === '—' ? '—' : dB.rate + '%') + ')</td>' +
    '</tr>';
  }).filter(Boolean).join('');
  if (!rows) return '';
  return _section(T('report.situations'),
    '<table class="cmp-table">' +
    '<thead><tr><th class="num-a">' + escapeHtml(match.team_A) + '</th><th class="lbl">' + T('report.situations_th') + '</th><th class="num-b">' + escapeHtml(match.team_B) + '</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>');
}

function _sectionGoalies(goalies, match) {
  var fmt = function(v) { return v === '—' ? '—' : v + '%'; };

  function sideHtml(side, teamName) {
    var g = goalies[side];
    if (!g) return '';
    var list = g.goalies && g.goalies.length > 0 ? g.goalies : null;
    if (!list) {
      return '<tr><td class="lbl" colspan="2">' + escapeHtml(teamName) + ' ' + T('report.goalies.no_number') + '</td>' +
        '<td>' + g.saves + '</td><td>' + g.goalsAgainst + '</td><td>' + g.shotsOnGoal + '</td><td>' + fmt(g.savePct) + '</td></tr>';
    }
    return list.map(function(gi) {
      var nr = gi.number !== null ? '#' + gi.number : T('report.goalies.no_nr');
      return '<tr><td class="lbl">' + escapeHtml(teamName) + '</td><td>' + nr + '</td>' +
        '<td>' + gi.saves + '</td><td>' + gi.goalsAgainst + '</td><td>' + gi.shotsOnGoal + '</td><td>' + fmt(gi.savePct) + '</td></tr>';
    }).join('');
  }

  return _section(T('report.goalies'),
    '<table class="data-table">' +
    '<thead><tr><th>' + T('report.goalies.team') + '</th><th>' + T('report.goalies.nr') + '</th><th>' + T('report.goalies.saves') + '</th><th>' + T('report.goalies.goals_ag') + '</th><th>' + T('report.goalies.shots_on') + '</th><th>' + T('report.goalies.save_pct') + '</th></tr></thead>' +
    '<tbody>' + sideHtml('A', match.team_A) + sideHtml('B', match.team_B) + '</tbody></table>');
}

function _sectionAnalyticsSummary(s, filtered, f) {
  var matchCount = new Set(filtered.map(function(e) { return String(e.match_id); })).size;
  var rows = [
    [T('report.rows.match_count'), matchCount],
    [T('report.rows.shots_short'), s.total],
    [T('report.rows.goals_short'), s.goals],
    [T('report.rows.on_target_short'), s.onTarget],
    [T('report.rows.eff'), s.pct + '%'],
    [T('report.rows.on_pct'), s.onPct + '%'],
  ];
  if (s.manUp)     rows.push(['Man-up',     s.manUp]);
  if (s.manDown)   rows.push(['Man-down',   s.manDown]);
  if (s.fastBreak) rows.push(['Fast break', s.fastBreak]);

  var cells = rows.map(function(r) {
    return '<div class="sum-cell"><div class="sum-val">' + r[1] + '</div><div class="sum-lbl">' + r[0] + '</div></div>';
  }).join('');

  return _section(T('report.summary'), '<div class="summary-grid">' + cells + '</div>');
}

function _sectionAnalyticsZones(s) {
  var zoneOrder = ['attack-center','attack-left','attack-right','midfield-center','midfield-left','midfield-right','own-half'];
  var zoneLabels = {
    'attack-center':   T('zone.attack_center'),
    'attack-left':     T('zone.attack_left'),
    'attack-right':    T('zone.attack_right'),
    'midfield-center': T('zone.midfield_center'),
    'midfield-left':   T('zone.midfield_left'),
    'midfield-right':  T('zone.midfield_right'),
    'own-half':        T('zone.own_half'),
  };
  var rows = zoneOrder.filter(function(z) { return s.zones[z]; }).map(function(z) {
    var cnt = s.zones[z];
    var pct = Math.round(cnt / s.total * 100);
    return '<tr><td>' + zoneLabels[z] + '</td><td class="num">' + cnt + '</td><td class="num">' + pct + '%</td></tr>';
  }).join('');
  if (!rows) return '';
  return _section(T('report.zones'),
    '<table class="data-table">' +
    '<thead><tr><th>' + T('analytics.zones.zone') + '</th><th>' + T('report.rows.shots_short') + '</th><th>%</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>');
}

function _sectionAnalyticsPeriods(s) {
  var entries = Object.entries(s.periods).sort(function(a, b) {
    var aOT = a[0].startsWith('OT'), bOT = b[0].startsWith('OT');
    if (!aOT && !bOT) return Number(a[0]) - Number(b[0]);
    if (!aOT) return -1; if (!bOT) return 1;
    return Number(a[0].slice(2)) - Number(b[0].slice(2));
  });
  var rows = entries.map(function(kv) {
    var p = kv[0], v = kv[1];
    var pct = v.total > 0 ? Math.round(v.goals / v.total * 100) : 0;
    return '<tr><td>' + periodLabel(p) + '</td><td class="num">' + v.total + '</td><td class="num">' + v.goals + '</td><td class="num">' + pct + '%</td></tr>';
  }).join('');
  if (!rows) return '';
  return _section(T('report.periods'),
    '<table class="data-table">' +
    '<thead><tr><th>' + T('report.per_period.period') + '</th><th>' + T('report.rows.shots_short') + '</th><th>' + T('report.rows.goals_short') + '</th><th>' + T('report.periods.rate') + '</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>');
}

function _sectionAnalyticsSituations(s) {

function _sectionMatchHistory(filtered, allEvents, allMatches, f) {
  if (!f.team) return '';
  var matchIds = new Set(filtered.map(function(e) { return String(e.match_id); }));
  var relevant = allMatches.filter(function(m) {
    return (m.team_A === f.team || m.team_B === f.team) && matchIds.has(String(m.id));
  }).sort(function(a, b) { return String(b.match_date).localeCompare(String(a.match_date)); });
  if (!relevant.length) return '';

  var rows = relevant.map(function(m) {
    var mEvs   = allEvents.filter(function(e) { return String(e.match_id) === String(m.id); });
    var goalsA = mEvs.filter(function(e) { return e.team_event === m.team_A && e.result === 'gol'; }).length;
    var goalsB = mEvs.filter(function(e) { return e.team_event === m.team_B && e.result === 'gol'; }).length;
    var opp    = m.team_A === f.team ? m.team_B : m.team_A;
    var myG    = m.team_A === f.team ? goalsA   : goalsB;
    var oppG   = m.team_A === f.team ? goalsB   : goalsA;
    var result = mEvs.length === 0 ? '— : —' : myG + ' : ' + oppG;
    var cls    = mEvs.length === 0 ? '' : myG > oppG ? 'won' : myG === oppG ? 'drew' : 'lost';
    return '<tr class="' + cls + '"><td>' + escapeHtml(String(m.match_date || '')) + '</td>' +
      '<td>' + escapeHtml(m.tournament || '—') + '</td>' +
      '<td>' + escapeHtml(opp) + '</td>' +
      '<td class="num">' + result + '</td></tr>';
  }).join('');

  return _section(T('report.history') + ' — ' + escapeHtml(f.team),
    '<table class="data-table">' +
    '<thead><tr><th>' + T('analytics.history.date') + '</th><th>' + T('analytics.history.tournament') + '</th><th>' + T('analytics.history.opponent') + '</th><th>' + T('analytics.history.result') + '</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>');
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function _section(title, bodyHtml) {
  return '<div class="section"><h2>' + title + '</h2>' + bodyHtml + '</div>';
}

function _reportHalfFieldSvg(shotEvents, teamName, useSlotB) {
  var ns  = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 540 660');
  svg.setAttribute('xmlns', ns);
  var slot       = useSlotB ? 'B' : 'A';
  var mockMatch  = useSlotB
    ? { id: '__report__', team_A: '__other__', team_B: teamName, team_A_side: 'left' }
    : { id: '__report__', team_A: teamName,    team_B: '__other__', team_A_side: 'left' };
  var mockEvents = shotEvents.map(function(e) { return Object.assign({}, e, { team_event: teamName }); });
  var mockViewer = { view_mode: 'half-' + slot, display_mode: 'markers' };
  drawHalfFieldChart(svg, mockMatch, mockEvents, mockViewer);
  return svg.outerHTML;
}

function renderModal() {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.dataset.action = 'modal-bg-click';

  if      (APP.modal.type === 'result')              bg.innerHTML = renderResultModal(APP.modal.pending);
  else if (APP.modal.type === 'edit-event')          bg.innerHTML = renderEditEventModal(APP.modal.event);
  else if (APP.modal.type === 'confirm-end')         bg.innerHTML = renderConfirmEnd();
  else if (APP.modal.type === 'ad-hoc')              bg.innerHTML = renderAdHocModal();
  else if (APP.modal.type === 'tournament-form')     bg.innerHTML = renderTournamentModal(APP.modal.tournament);
  else if (APP.modal.type === 'match-form')          bg.innerHTML = renderMatchModal(APP.modal.match);
  else if (APP.modal.type === 'goalie-form')         bg.innerHTML = renderGoalieFormModal();
  else if (APP.modal.type === 'goalie-retroactive')  bg.innerHTML = renderGoalieRetroactiveModal();
  else if (APP.modal.type === 'confirm')             bg.innerHTML = renderConfirmModal();

  document.body.appendChild(bg);
}

function renderGoalieRetroactiveModal() {
  const match     = DATA.scheduledMatches.find(m => String(m.id) === String(APP.matchId));
  const allEvents = DATA.events.filter(e => String(e.match_id) === String(match.id));
  const shotEvents = allEvents.filter(e => e.event_type !== 'goalie_set');
  const goalieEvents = allEvents.filter(e => e.event_type === 'goalie_set');

  const periodSet = new Set();
  shotEvents.forEach(e => { if (e.period !== undefined && e.period !== '') periodSet.add(String(e.period)); });
  const periods = Array.from(periodSet).sort((a, b) => getPeriodOrder(a) - getPeriodOrder(b));
  if (periods.length === 0) periods.push(APP.match.period);

  function currentFor(period, teamName) {
    const ev = goalieEvents
      .filter(e => e.team_event === teamName && String(e.period) === String(period))
      .sort((a, b) => (b.created_at || 0) - (a.created_at || 0))[0];
    return ev ? ev.goalie_number : '';
  }

  const rows = periods.map(p => `
    <tr>
      <td style="padding:4px 8px;">${periodLabel(p)}</td>
      <td style="padding:4px 8px;"><input type="number" min="0" max="99" inputmode="numeric"
        data-period="${escapeHtml(p)}" data-team="A"
        value="${escapeHtml(String(currentFor(p, match.team_A)))}" style="width:70px;"></td>
      <td style="padding:4px 8px;"><input type="number" min="0" max="99" inputmode="numeric"
        data-period="${escapeHtml(p)}" data-team="B"
        value="${escapeHtml(String(currentFor(p, match.team_B)))}" style="width:70px;"></td>
    </tr>`).join('');

  return `
    <div class="modal" data-stop-propagation="true">
      <h2>${T('modal.goalie_retro.title')}</h2>
      <table style="border-collapse:collapse;width:100%;">
        <thead>
          <tr>
            <th style="text-align:left;padding:4px 8px;">${T('period.quarter')}</th>
            <th style="text-align:left;padding:4px 8px;">${escapeHtml(match.team_A)}</th>
            <th style="text-align:left;padding:4px 8px;">${escapeHtml(match.team_B)}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="modal-actions">
        <button class="btn" data-action="cancel-modal">${T('btn.cancel')}</button>
        <button class="btn btn-primary" data-action="save-goalie-retroactive">${T('btn.save_all')}</button>
      </div>
    </div>`;
}

// HANDLERS map (data-action → fn) + global event delegation listeners (click + change).

const HANDLERS = {
  'open-admin':     () => goAdmin(),
  'open-analytics': () => goAnalytics(),
  'home-retry':     () => loadHomeData(),

  // Offline backup — export/import
  'export-offline-backup': () => exportOfflineBufferToFile(),
  'import-offline-backup': () => {
    const input = document.createElement('input');
    input.type   = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      importOfflineBufferFromFile(file, function(count) {
        APP.offlineBanner = loadOfflineBuffer().length || null;
        APP.banner = { type: 'info', msg: 'Zaimportowano ' + count + ' eventów z kopii zapasowej' };
        render();
      });
    };
    input.click();
  },
  'viewer-retry':   () => startViewerRefresh(),
  'admin-retry':    () => loadAdminData(),

  // Analytics
  'analytics-retry':  () => loadAnalyticsData(),
  'open-match-report':    (matchId) => openMatchReport(matchId),
  'open-analytics-report': ()       => openAnalyticsReport(),
  'analytics-filter-change': (val, el) => {
    const field = el.dataset.field;
    if (field && field in APP.analyticsFilters) {
      APP.analyticsFilters[field] = val;
      if (field === 'tournament') {
        APP.analyticsFilters.team  = '';
        APP.analyticsFilters.team2 = '';
      }
      render();
    }
  },
  'analytics-mode-toggle': (mode) => {
    APP.analyticsMode = mode;
    if (mode === 'single') APP.analyticsFilters.team2 = '';
    render();
  },
  'go-home-from-analytics': () => goHome(),
  'analytics-heatmap-toggle': (mode) => {
    APP.analyticsHeatmapMode = mode;
    render();
  },
  'analytics-goalie-sort': (col) => {
    const s = APP.analyticsGoalieSort;
    s.dir = s.col === col ? (s.dir === 'desc' ? 'asc' : 'desc') : 'desc';
    s.col = col;
    render();
  },
  'open-viewer-from-analytics': (matchId) => {
    // Sync analytics matches into DATA so viewer can find match info
    const am = APP.analyticsData && APP.analyticsData.matches;
    if (am) {
      am.forEach(m => {
        if (!DATA.scheduledMatches.find(x => String(x.id) === String(m.id))) {
          DATA.scheduledMatches.push(m);
        }
      });
    }
    openMatchViewer(matchId);
  },

  // Standings (tabela ligowa)
  'open-standings':            () => go('standings'),
  'go-home-from-standings':    () => goHome(),
  'standings-retry':           () => loadStandingsData(),
  'standings-set-tournament':  (val) => {
    APP.standingsTournament = val;
    render();
  },
  'standings-sort': (col) => {
    if (APP.standingsSort.col === col) {
      APP.standingsSort.dir = APP.standingsSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      APP.standingsSort = { col, dir: 'desc' };
    }
    render();
  },

  // Ponów wszystkie eventy z offline buffer (przycisk w bannerze na home screen)
  'retry-all-offline': () => {
    const buffer = loadOfflineBuffer();
    if (!buffer.length) return;
    buffer.forEach(ev => {
      gasSaveEvent(ev).then(function(result) {
        removeFromOfflineBuffer(ev.client_event_id);
        // Jeśli event jest też w DATA.events, zaktualizuj go
        const idx = DATA.events.findIndex(e => e.client_event_id === ev.client_event_id);
        if (idx >= 0) {
          DATA.events[idx] = Object.assign({}, DATA.events[idx], { id: result.id, _syncing: false, _syncError: null });
        }
        APP.offlineBanner = loadOfflineBuffer().length || null;
        render();
      }).catch(function() {
        // Zostaje w buforze, spróbuje przy następnym retry
      });
    });
    APP.offlineBanner = buffer.length; // pokaż że wysyłamy
    render();
  },

  // Ręczny retry eventu z błędem sync (krok 8)
  'retry-event': (clientEventId) => {
    const ev = DATA.events.find(e => e.client_event_id === clientEventId);
    if (!ev || ev._syncing) return;

    // Sprawdź walidację przed wysłaniem
    const validationError = validateEventPayload(ev);
    if (validationError) {
      const idx = DATA.events.findIndex(e => e.client_event_id === clientEventId);
      if (idx >= 0) {
        DATA.events[idx] = Object.assign({}, DATA.events[idx], {
          _syncError: 'Błąd walidacji: ' + validationError,
        });
      }
      render();
      return;
    }

    const idx = DATA.events.findIndex(e => e.client_event_id === clientEventId);
    if (idx < 0) return;
    DATA.events[idx] = Object.assign({}, DATA.events[idx], { _syncing: true, _syncError: null });
    render();

    gasSaveEvent(ev).then(function (result) {
      const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
      if (i >= 0) {
        DATA.events[i] = Object.assign({}, DATA.events[i], {
          id:         result.id,
          _syncing:   false,
          _syncError: null,
        });
        removeFromOfflineBuffer(clientEventId);
      }
      render();
    }).catch(function (err) {
      if (err.code !== 'DEV_MODE') {
        const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
        if (i >= 0) {
          DATA.events[i] = Object.assign({}, DATA.events[i], {
            _syncing:   false,
            _syncError: err.message || 'Błąd zapisu — wyślij ponownie',
          });
        }
        render();
      }
    });
  },

  'retry-all-errors': () => {
    const errored = DATA.events.filter(e => e._syncError && !e._syncing);
    errored.forEach(ev => {
      const clientEventId = ev.client_event_id;
      const validationError = validateEventPayload(ev);
      if (validationError) return;
      const idx = DATA.events.findIndex(e => e.client_event_id === clientEventId);
      if (idx < 0) return;
      DATA.events[idx] = Object.assign({}, DATA.events[idx], { _syncing: true, _syncError: null });
      gasSaveEvent(ev).then(function(result) {
        const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
        if (i >= 0) {
          DATA.events[i] = Object.assign({}, DATA.events[i], { id: result.id, _syncing: false, _syncError: null });
          removeFromOfflineBuffer(clientEventId);
        }
        render();
      }).catch(function(err) {
        if (err.code !== 'DEV_MODE') {
          const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
          if (i >= 0) {
            DATA.events[i] = Object.assign({}, DATA.events[i], { _syncing: false, _syncError: err.message || 'Błąd zapisu — wyślij ponownie' });
          }
          render();
        }
      });
    });
    if (errored.length) render();
  },

  // Period transitions
  'next-period': () => {
    const prevPeriod = APP.match.period;
    const prevSide   = APP.match.team_A_side;
    const newP = nextPeriod(APP.match.period);
    APP.match.period = newP;
    APP.match.team_A_side = prevSide === 'left' ? 'right' : 'left';
    APP.match.periodSides = APP.match.periodSides || {};
    APP.match.periodSides[newP] = APP.match.team_A_side;
    APP._periodQueue = (APP._periodQueue || []).concat([{ prevPeriod, prevSide }]);
    clearTimeout(APP._undoTimer);
    APP.banner = { type: 'period-undo', newPeriod: newP, sidesChanged: true };
    APP._undoTimer = setTimeout(() => {
      if (APP.banner && APP.banner.type === 'period-undo') {
        APP._periodQueue = [];
        APP.banner = null;
        render();
      }
    }, 8000);
    render();
  },
  'undo-period': () => {
    clearTimeout(APP._undoTimer);
    APP._undoTimer = null;
    const queue = APP._periodQueue || [];
    APP._periodQueue = [];
    if (queue.length > 0) {
      APP.match.period      = queue[0].prevPeriod;
      APP.match.team_A_side = queue[0].prevSide;
    }
    APP.banner = null;
    render();
  },
  'dismiss-period-undo': () => {
    clearTimeout(APP._undoTimer);
    APP._undoTimer = null;
    APP._periodQueue = [];
    APP.banner = null;
    render();
  },
  'pick-period': () => {
    clearTimeout(APP._undoTimer);
    APP._undoTimer = null;
    APP._periodQueue = [];
    APP.banner = { type: 'period-picker' };
    render();
  },
  'select-period': (period) => {
    if (period === APP.match.period) { APP.banner = null; render(); return; }
    const prevPeriod = APP.match.period;
    const prevSide   = APP.match.team_A_side;
    const sides = APP.match.periodSides = APP.match.periodSides || {};
    sides[prevPeriod] = prevSide;
    let newSide;
    if (sides[period] !== undefined) {
      newSide = sides[period];
    } else {
      // Oblicz na podstawie Q1: każda kwarta zmienia strony
      const q1Side = sides['1'] || 'left';
      const idx = getPeriodOrder(period) - 1;
      newSide = idx % 2 === 0 ? q1Side : (q1Side === 'left' ? 'right' : 'left');
    }
    APP.match.period = period;
    APP.match.team_A_side = newSide;
    sides[period] = newSide;
    APP._periodQueue = [{ prevPeriod, prevSide }];
    clearTimeout(APP._undoTimer);
    APP.banner = { type: 'period-undo', newPeriod: period, sidesChanged: newSide !== prevSide };
    APP._undoTimer = setTimeout(() => {
      if (APP.banner && APP.banner.type === 'period-undo') {
        APP._periodQueue = [];
        APP.banner = null;
        render();
      }
    }, 8000);
    render();
  },
  'cancel-pick-period': () => {
    APP.banner = null;
    render();
  },

    APP.banner = { type: 'period-end', fromPeriod: APP.match.period };

    const tournament = document.getElementById('adhoc-tournament').value.trim();
    const teamA      = document.getElementById('adhoc-team-a').value.trim().replace(/\s+/g, ' ');
    const teamB      = document.getElementById('adhoc-team-b').value.trim().replace(/\s+/g, ' ');

        if (APP.matchId === localId) APP.matchId = result.id;

  'save-goalie': (slot) => {
    const input = document.getElementById('goalie-number-input');
    if (!input) return;
    const raw = input.value.trim();
    if (raw === '' || isNaN(Number(raw)) || Number(raw) < 0 || Number(raw) > 99 || !Number.isInteger(Number(raw))) {
      alert('Podaj numer bramkarza (0–99).');
      return;
    }
    const num = String(parseInt(raw, 10));
    const match = DATA.scheduledMatches.find(m => String(m.id) === String(APP.matchId));
    const teamName = slot === 'A' ? match.team_A : match.team_B;
    const period = APP.match.period;

    // Jeśli istnieje goalie_set dla tej (period, team) — zaktualizuj, w przeciwnym razie utwórz
    const existing = DATA.events.find(e =>
      String(e.match_id) === String(match.id) &&
      e.event_type === 'goalie_set' &&
      e.team_event === teamName &&
      String(e.period) === String(period)
    );

    APP.modal = null;
    if (existing) {
      updateEvent(existing.id, { goalie_number: num });
    } else {
      recordEvent({
        event_type:    'goalie_set',
        team_event:    teamName,
        goalie_number: num,
        period,
        result:        null,
        shot_x:        null,
        shot_y:        null,
        zone_name:     null,
        man_up:        false,
        man_down:      false,
      });
    }
    render();
  },

  'open-goalie-retroactive': () => {
    APP.modal = { type: 'goalie-retroactive' };
    render();
  },

  'save-goalie-retroactive': () => {
    const match = DATA.scheduledMatches.find(m => String(m.id) === String(APP.matchId));
    const inputs = document.querySelectorAll('.modal [data-period][data-team]');
    APP.modal = null;
    render();

    inputs.forEach(input => {
      const period   = input.dataset.period;
      const slot     = input.dataset.team;
      const teamName = slot === 'A' ? match.team_A : match.team_B;
      const raw      = input.value.trim();

      const existing = DATA.events.find(e =>
        String(e.match_id) === String(match.id) &&
        e.event_type === 'goalie_set' &&
        e.team_event === teamName &&
        String(e.period) === String(period)
      );

      if (raw === '') {
        if (existing) deleteEvent(existing.id);
        return;
      }
      if (isNaN(Number(raw)) || Number(raw) < 0 || Number(raw) > 99 || !Number.isInteger(Number(raw))) return;
      const num = String(parseInt(raw, 10));

      if (existing) {
        if (String(existing.goalie_number) !== num) updateEvent(existing.id, { goalie_number: num });
      } else {
        recordEvent({
          event_type:    'goalie_set',
          team_event:    teamName,
          goalie_number: num,
          period,
          result:        null,
          shot_x:        null,
          shot_y:        null,
          zone_name:     null,
          man_up:        false,
          man_down:      false,
        });
      }
    });
    render();
  },
};

// ===== Event delegation =====

document.addEventListener('click', (e) => {
  // Click on .modal-bg directly (not on its children) closes the modal.
  if (e.target.classList && e.target.classList.contains('modal-bg')) {
    closeModal();
    return;
  }
  const target = e.target.closest('[data-action]');
  if (!target) return;
  // <select> dispatches via 'change' instead.
  if (target.tagName === 'SELECT') return;
  const action = target.dataset.action;
  if (action === 'modal-bg-click') return;
  const handler = HANDLERS[action];
  if (handler) handler(target.dataset.arg);
});

document.addEventListener('change', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  if (target.tagName !== 'SELECT' && target.type !== 'checkbox' && target.type !== 'date' && target.type !== 'file') return;
  const action = target.dataset.action;
  const handler = HANDLERS[action];
  if (!handler) return;
  if (action === 'analytics-filter-change' || action === 'csv-import-file' || action === 'standings-set-tournament' || action === 'embed-select-match') {
    handler(target.value, target);
  } else {
    handler(target.dataset.arg);
  }
});

// ── CSV parsing ────────────────────────────────────────────────────────────────

function parseCsvMatches(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  if (lines.length === 0) return { rows: [] };

  const sep = lines[0].indexOf(';') >= 0 ? ';' : ',';

  // Auto-detect header row
  const firstCells = lines[0].split(sep).map(c => c.trim().toLowerCase().replace(/^"|"$/g, ''));
  const hasHeader = ['turniej', 'tournament', 'data', 'date', 'druzyna_a', 'team_a'].some(h => firstCells.includes(h));
  const dataLines = hasHeader ? lines.slice(1) : lines;

  const rows = dataLines.map(function(line, i) {
    const cells = line.split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
    const tournament = cells[0] || '';
    const match_date = cells[1] || '';
    const team_A     = cells[2] || '';
    const team_B     = cells[3] || '';
    const video_url  = cells[4] || '';

    let _error = null;
    if (!tournament)                               _error = 'Brak nazwy turnieju';
    else if (!match_date)                          _error = 'Brak daty';
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(match_date)) _error = 'Nieprawidłowa data — wymagany format RRRR-MM-DD';
    else if (!team_A)                              _error = 'Brak drużyny A';
    else if (!team_B)                              _error = 'Brak drużyny B';

    return { tournament, match_date, team_A, team_B, video_url, _error, _lineNum: i + (hasHeader ? 2 : 1) };
  });

  return { rows };
}

// Top-level render dispatcher + init.

const APP_VERSION = 'v2.1.0';

function _renderFooter(container) {
  const f = document.createElement('footer');
  f.className = 'app-footer';
  f.textContent = 'Lacrosse Stats ' + APP_VERSION;
  container.appendChild(f);
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if      (APP.screen === 'home')          renderHome(app);
  else if (APP.screen === 'admin')         renderAdmin(app);
  else if (APP.screen === 'match-input')   renderMatchInput(app);
  else if (APP.screen === 'match-viewer')  renderMatchViewer(app);
  else if (APP.screen === 'analytics')     renderAnalytics(app);
  else if (APP.screen === 'standings')     renderStandings(app);

  _renderFooter(app);

  // Strip stale modals from previous render
  const oldModal = document.querySelector('.modal-bg');
  if (oldModal) oldModal.remove();

  if (APP.modal) renderModal();
  _syncThemeToggle();
}

// Init motywu — przed pierwszym render()
(function() {
  const saved = localStorage.getItem('lax_theme');
  if (saved === 'dark' || saved === 'light') {
    document.documentElement.dataset.theme = saved;
  }
})();

function _syncThemeToggle() {
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '🌙';
}

// Init — must be last after all modules loaded.
(function() {
  var buf = loadOfflineBuffer();
  if (buf.length > 0) APP.offlineBanner = buf.length;
})();
go('home');
</script>
