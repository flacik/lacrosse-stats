      ${_renderAnalyticsFilters(f, tournaments, allTeams, allPeriods)}
      ${filtered.length === 0
        ? '<div class="empty">Brak danych dla wybranych filtrów.</div>'
        : _renderAnalyticsBody(filtered, matches, f)
      }
    </div>`;
}

// ── Filtry ───────────────────────────────────────────────────────────────────

function _renderAnalyticsFilters(f, tournaments, allTeams, allPeriods) {
  const tourOptions = ['<option value="">Wszystkie turnieje</option>',
    ...tournaments.map(t => `<option value="${escapeHtml(t.name)}" ${f.tournament === t.name ? 'selected' : ''}>${escapeHtml(t.name)}</option>`)
  ].join('');

  const teamOptions = ['<option value="">Wszystkie drużyny</option>',
    ...allTeams.map(t => `<option value="${escapeHtml(t)}" ${f.team === t ? 'selected' : ''}>${escapeHtml(t)}</option>`)
  ].join('');

  const periodOptions = ['<option value="">Wszystkie okresy</option>',
    ...allPeriods.map(p => `<option value="${escapeHtml(p)}" ${f.period === p ? 'selected' : ''}>${periodLabel(p)}</option>`)
  ].join('');

  return `
    <div class="analytics-filters">
      <div class="filter-row">
        <label>Turniej
          <select data-action="analytics-filter-change" data-field="tournament">${tourOptions}</select>
        </label>
        <label>Drużyna
          <select data-action="analytics-filter-change" data-field="team">${teamOptions}</select>
        </label>
        <label>Okres (kwarta)
          <select data-action="analytics-filter-change" data-field="period">${periodOptions}</select>
        </label>
        <label>Data od
          <input type="date" data-action="analytics-filter-change" data-field="dateFrom" value="${f.dateFrom}">
        </label>
        <label>Data do
          <input type="date" data-action="analytics-filter-change" data-field="dateTo" value="${f.dateTo}">
        </label>
      </div>
    </div>`;
}

// ── Logika filtrów ────────────────────────────────────────────────────────────

function _analyticsApplyFilters(events, f) {
  return events.filter(e => {
    if (f.tournament && e.tournament !== f.tournament) return false;
    if (f.team      && e.team_event !== f.team)        return false;
    if (f.period    && String(e.period) !== f.period)  return false;
    if (f.dateFrom  && e.match_date < f.dateFrom)      return false;
    if (f.dateTo    && e.match_date > f.dateTo)        return false;
    return true;
  });
}

function _analyticsAllTeams(matches, tournament) {
  const set = new Set();
  matches.forEach(m => {
    if (tournament && m.tournament !== tournament) return;
    if (m.team_A) set.add(m.team_A);
    if (m.team_B) set.add(m.team_B);
  });
  return [...set].sort();
}

function _analyticsAllPeriods(events) {
  const set = new Set();
  events.forEach(e => { if (e.period) set.add(String(e.period)); });
  return [...set].sort((a, b) => {
    const aOT = a.startsWith('OT'), bOT = b.startsWith('OT');
    if (!aOT && !bOT) return Number(a) - Number(b);
    if (!aOT) return -1;
    if (!bOT) return 1;
    return Number(a.slice(2)) - Number(b.slice(2));
  });
}

// ── Sekcje wynikowe ───────────────────────────────────────────────────────────

function _renderAnalyticsBody(filtered, matches, f) {
  return `
    <div class="analytics-body">
      ${_renderAnalyticsStats(filtered, f)}
      ${_renderAnalyticsHeatmap(filtered, APP.analyticsData.events, f)}
      ${_renderAnalyticsMatchHistory(filtered, APP.analyticsData.events, APP.analyticsData.matches, f)}
    </div>`;
}

// ── V5-03: Porównanie ofensywa vs defensywa ───────────────────────────────────

function _buildConcededEvents(filteredTeamEvents, allEvents, f) {
  const matchIds = new Set(filteredTeamEvents.map(e => String(e.match_id)));
  let conceded = allEvents.filter(e =>
    matchIds.has(String(e.match_id)) && e.team_event !== f.team
  );
  if (f.period)   conceded = conceded.filter(e => String(e.period) === f.period);
  if (f.dateFrom) conceded = conceded.filter(e => e.match_date >= f.dateFrom);
  if (f.dateTo)   conceded = conceded.filter(e => e.match_date <= f.dateTo);
  return conceded;
}

function _renderOffenseDefenseComparison(filteredTeamEvents, allEvents, f) {
  if (!f.team) return '';

  const conceded = _buildConcededEvents(filteredTeamEvents, allEvents, f);
  const off = computeAnalyticsStats(filteredTeamEvents);
  const def = computeAnalyticsStats(conceded);

  function statRow(label, offVal, defVal, lowerIsBetter) {
    const offBetter = lowerIsBetter ? offVal <= defVal : offVal >= defVal;
    const defBetter = lowerIsBetter ? defVal <= offVal : defVal >= offVal;
    const offCls = offBetter && offVal !== defVal ? 'cmp-better' : '';
    const defCls = defBetter && offVal !== defVal ? 'cmp-better' : '';
    return `<tr>
      <td class="cmp-label">${label}</td>
      <td class="cmp-val ${offCls}">${offVal}</td>
      <td class="cmp-val ${defCls}">${defVal}</td>
    </tr>`;
  }

  const rows = [
    statRow('Strzałów',      off.total,        def.total,        false),
    statRow('Bramek',        off.goals,         def.goals,        true),
    statRow('Celnych',       off.onTarget,      def.onTarget,     false),
    statRow('Skuteczność %', `${off.pct}%`,     `${def.pct}%`,   false),
    statRow('% celnych',     `${off.onPct}%`,   `${def.onPct}%`, false),
  ].join('');

  return `
    <section class="analytics-section">
      <h2>Atak vs obrona — ${escapeHtml(f.team)}</h2>
      <table class="stats-table cmp-table">
        <thead>
          <tr>
            <th></th>
            <th>⚔ Atak (oddane)</th>
            <th>🛡 Obrona (stracone)</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      ${def.total === 0
        ? '<p class="empty" style="font-size:13px">Brak danych o strzałach straconych dla wybranych filtrów.</p>'
        : ''}
    </section>`;
}

// ── Statystyki (H-05) ─────────────────────────────────────────────────────────

function computeAnalyticsStats(events) {
  const total     = events.length;
  const goals     = events.filter(e => e.result === 'gol').length;
  const onTarget  = events.filter(e => e.result === 'celny' || e.result === 'gol').length;
  const offTarget = events.filter(e => e.result === 'niecelny').length;
  const manUp     = events.filter(e => e.man_up).length;
  const manDown   = events.filter(e => e.man_down).length;

  const pct   = total > 0 ? Math.round((goals / total) * 100) : 0;
  const onPct = total > 0 ? Math.round((onTarget / total) * 100) : 0;

  const zones = {};
  events.forEach(e => {
    if (!e.zone_name) return;
    zones[e.zone_name] = (zones[e.zone_name] || 0) + 1;
  });

  const periods = {};
  events.forEach(e => {
    if (!e.period) return;
    const p = String(e.period);
    if (!periods[p]) periods[p] = { total: 0, goals: 0 };
    periods[p].total++;
    if (e.result === 'gol') periods[p].goals++;
  });

  const situations = {
    manUp:    { events: events.filter(e => e.man_up),
                label: 'Man-up (przewaga)', icon: '▲' },
    manDown:  { events: events.filter(e => e.man_down),
                label: 'Man-down (osłabienie)', icon: '▼' },
    even:     { events: events.filter(e => !e.man_up && !e.man_down),
                label: 'Wyrównana', icon: '=' },
  };
  Object.values(situations).forEach(sit => {
    const t = sit.events.length;
    const g = sit.events.filter(e => e.result === 'gol').length;
    sit.total = t;
    sit.goals = g;
    sit.pct   = t > 0 ? Math.round((g / t) * 100) : 0;
  });

  return { total, goals, onTarget, offTarget, manUp, manDown, pct, onPct, zones, periods, situations };
}

// ── V5-01: Donut chart wyników strzałów ──────────────────────────────────────

function _renderShotResultDonut(s) {
  if (s.total === 0) return '';

  const segments = [
    { count: s.goals,                 color: '#16a34a', label: 'Gole' },
    { count: s.onTarget - s.goals,    color: '#3b82f6', label: 'Celne' },
    { count: s.offTarget,             color: '#9ca3af', label: 'Niecelne' },
  ].filter(seg => seg.count > 0);

  const cx = 80, cy = 80, r = 60, innerR = 38;
  let arcs = '';
  let angle = -Math.PI / 2;

  segments.forEach(seg => {
    const sweep = (seg.count / s.total) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(angle);
    const y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(angle + sweep);
    const y2 = cy + r * Math.sin(angle + sweep);
    const xi1 = cx + innerR * Math.cos(angle);
    const yi1 = cy + innerR * Math.sin(angle);
    const xi2 = cx + innerR * Math.cos(angle + sweep);
    const yi2 = cy + innerR * Math.sin(angle + sweep);
    const large = sweep > Math.PI ? 1 : 0;

    arcs += `<path d="
      M ${x1} ${y1}
      A ${r} ${r} 0 ${large} 1 ${x2} ${y2}
      L ${xi2} ${yi2}
      A ${innerR} ${innerR} 0 ${large} 0 ${xi1} ${yi1}
      Z" fill="${seg.color}" opacity="0.9"/>`;
    angle += sweep;
  });

  const legendItems = segments.map(seg => {
    const pct = Math.round((seg.count / s.total) * 100);
    return `<div class="donut-legend-item">
      <span class="donut-dot" style="background:${seg.color}"></span>
      <span>${seg.label}: ${seg.count} (${pct}%)</span>
    </div>`;
  }).join('');

  return `
    <div class="donut-wrapper">
      <svg width="160" height="160" viewBox="0 0 160 160">
        ${arcs}
        <text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="18" font-weight="700" fill="#111">${s.total}</text>
        <text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="10" fill="#6b7280">strzałów</text>
      </svg>
      <div class="donut-legend">${legendItems}</div>
    </div>`;
}

// ── V5-04: Sytuacje man-up / man-down ────────────────────────────────────────

function _renderSituationStats(s) {
  const { situations } = s;
  const hasSpecial = situations.manUp.total > 0 || situations.manDown.total > 0;
  if (!hasSpecial) return '';

  const cards = [situations.manUp, situations.even, situations.manDown].map(sit => `
    <div class="stat-box sit-card">
      <div class="sit-icon">${sit.icon}</div>
      <div class="stat-lbl">${sit.label}</div>
      <div class="sit-numbers">
        <span class="sit-goals">${sit.goals} bramek</span>
        <span class="sit-total">/ ${sit.total} strzałów</span>
      </div>
      <div class="stat-val sit-pct">${sit.pct}%</div>
    </div>`).join('');

  return `
    <div style="margin-bottom: 16px;">
      <h3 style="font-size:14px;color:#6b7280;margin:0 0 8px">Skuteczność per sytuacja</h3>
      <div class="stats-grid">${cards}</div>
    </div>`;
}

// ── V5-02: Słupki skuteczności per kwarta ────────────────────────────────────

function _renderPeriodBarChart(periods) {
  const entries = Object.entries(periods)
    .sort(([a], [b]) => {
      const aOT = a.startsWith('OT'), bOT = b.startsWith('OT');
      if (!aOT && !bOT) return Number(a) - Number(b);
      if (!aOT) return -1; if (!bOT) return 1;
      return Number(a.slice(2)) - Number(b.slice(2));
    });

  if (entries.length === 0) return '';

  const maxPct = Math.max(...entries.map(([, v]) => v.total > 0 ? Math.round(v.goals / v.total * 100) : 0), 1);
  const barW = 40, gap = 14, chartH = 120, labelH = 20, valH = 18;
  const totalW = entries.length * (barW + gap) + gap;

  const bars = entries.map(([p, v], i) => {
    const pct = v.total > 0 ? Math.round(v.goals / v.total * 100) : 0;
    const barH = Math.max(Math.round((pct / maxPct) * chartH), pct > 0 ? 4 : 2);
    const x = gap + i * (barW + gap);
    const barY = valH + chartH - barH;
    return `
      <rect x="${x}" y="${barY}" width="${barW}" height="${barH}" rx="3" fill="#3b82f6" opacity="0.85"/>
      <text x="${x + barW / 2}" y="${valH + chartH - barH - 4}" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="600">${pct > 0 ? pct + '%' : ''}</text>
      <text x="${x + barW / 2}" y="${valH + chartH + labelH - 4}" text-anchor="middle" font-size="11" fill="#6b7280">${periodLabel(p)}</text>
      <text x="${x + barW / 2}" y="${valH + chartH + labelH + 12}" text-anchor="middle" font-size="10" fill="#9ca3af">${v.goals}/${v.total}</text>`;
  }).join('');

  return `
    <div class="period-chart-wrapper">
      <svg width="${totalW}" height="${valH + chartH + labelH + 20}" viewBox="0 0 ${totalW} ${valH + chartH + labelH + 20}">
        ${bars}
        <line x1="0" y1="${valH + chartH}" x2="${totalW}" y2="${valH + chartH}" stroke="#e5e7eb" stroke-width="1"/>
      </svg>
    </div>`;
}

function _renderAnalyticsStats(filtered, f) {
  if (filtered.length === 0) return '';
  const s = computeAnalyticsStats(filtered);
  const teamLabel = f.team || 'Wszystkie drużyny';

  const zoneOrder = ['attack-center','attack-left','attack-right',
                     'midfield-center','midfield-left','midfield-right','own-half'];
  const zoneLabels = {
    'attack-center':   'Atak środek',
    'attack-left':     'Atak lewo',
    'attack-right':    'Atak prawo',
    'midfield-center': 'Midfield środek',
    'midfield-left':   'Midfield lewo',
    'midfield-right':  'Midfield prawo',
    'own-half':        'Własna połowa',
  };

  const zoneRows = zoneOrder
    .filter(z => s.zones[z])
    .map(z => {
      const cnt = s.zones[z];
      const pct = Math.round((cnt / s.total) * 100);
      return `<tr><td>${zoneLabels[z]}</td><td>${cnt}</td><td>${pct}%</td></tr>`;
    }).join('');

  const periodRows = Object.entries(s.periods)
    .sort(([a],[b]) => {
      const aOT = a.startsWith('OT'), bOT = b.startsWith('OT');
      if (!aOT && !bOT) return Number(a) - Number(b);
      if (!aOT) return -1; if (!bOT) return 1;
      return Number(a.slice(2)) - Number(b.slice(2));
    })
    .map(([p, v]) => `<tr><td>${periodLabel(p)}</td><td>${v.total}</td><td>${v.goals}</td><td>${v.total > 0 ? Math.round(v.goals/v.total*100) : 0}%</td></tr>`)
    .join('');

  return `
    <section class="analytics-section">
      <h2>Statystyki: ${escapeHtml(teamLabel)}</h2>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val">${s.total}</div><div class="stat-lbl">Strzałów</div></div>
        <div class="stat-box"><div class="stat-val">${s.goals}</div><div class="stat-lbl">Bramek</div></div>
        <div class="stat-box"><div class="stat-val">${s.onTarget}</div><div class="stat-lbl">Celnych</div></div>
        <div class="stat-box"><div class="stat-val">${s.pct}%</div><div class="stat-lbl">Skuteczność</div></div>
        <div class="stat-box"><div class="stat-val">${s.onPct}%</div><div class="stat-lbl">% celnych</div></div>
        ${s.manUp   ? `<div class="stat-box"><div class="stat-val">${s.manUp}</div><div class="stat-lbl">Man-up</div></div>` : ''}
        ${s.manDown ? `<div class="stat-box"><div class="stat-val">${s.manDown}</div><div class="stat-lbl">Man-down</div></div>` : ''}
      </div>
      ${zoneRows ? `
        <h3>Rozkład po strefach</h3>
        <table class="stats-table">
          <thead><tr><th>Strefa</th><th>Strzałów</th><th>%</th></tr></thead>
          <tbody>${zoneRows}</tbody>
        </table>` : ''}
      ${periodRows ? `
        <h3>Rozkład po kwartach</h3>
        <table class="stats-table">
          <thead><tr><th>Kwarta</th><th>Strzałów</th><th>Bramek</th><th>%</th></tr></thead>
          <tbody>${periodRows}</tbody>
        </table>` : ''}
      ${_renderShotResultDonut(s)}
      ${_renderSituationStats(s)}
      ${Object.keys(s.periods).length > 0 ? `
        <h3>Skuteczność per kwarta</h3>
        ${_renderPeriodBarChart(s.periods)}` : ''}
    </section>`;
}

// ── Heatmapa (H-06) ───────────────────────────────────────────────────────────

function _renderAnalyticsHeatmap(filteredTeamEvents, allMatchEvents, f) {
  if (!f.team) {
    return `<section class="analytics-section">
      <h2>Shot chart</h2>
      <p class="empty">Wybierz drużynę żeby zobaczyć shot chart.</p>
    </section>`;
  }

  const mode = APP.analyticsHeatmapMode || 'fired';
  const matchIds = new Set(filteredTeamEvents.map(e => String(e.match_id)));

  let chartEvents;
  if (mode === 'fired') {
    chartEvents = filteredTeamEvents;
  } else {
    chartEvents = allMatchEvents.filter(e =>
      matchIds.has(String(e.match_id)) && e.team_event !== f.team
    );
    if (f.period)   chartEvents = chartEvents.filter(e => String(e.period) === f.period);
    if (f.dateFrom) chartEvents = chartEvents.filter(e => e.match_date >= f.dateFrom);
    if (f.dateTo)   chartEvents = chartEvents.filter(e => e.match_date <= f.dateTo);
  }

  let svgContent;
  if (mode === 'efficiency') {
    svgContent = _buildZoneEfficiencySvg(filteredTeamEvents);
  } else {
    svgContent = _buildAnalyticsHalfFieldSvg(chartEvents, f.team);
  }

  return `
    <section class="analytics-section">
      <h2>Shot chart — ${escapeHtml(f.team)}</h2>
      <div class="heatmap-toggle">
        <button class="btn ${mode === 'fired'      ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="fired">Strzały oddane</button>
        <button class="btn ${mode === 'conceded'   ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="conceded">Strzały stracone</button>
        <button class="btn ${mode === 'efficiency' ? 'btn-primary' : ''}" data-action="analytics-heatmap-toggle" data-arg="efficiency">Skuteczność stref</button>
      </div>
      <div class="field-half">${svgContent}</div>
    </section>`;
}

function _buildAnalyticsHalfFieldSvg(events, teamName) {
  // Reużywa drawHalfFieldChart z field-svg.js.
  // Eventy mają attacker-relative coords — drawHalfFieldChart mapuje je bezpośrednio
  // (cx = shot_y * 540, cy = (1 - shot_x) * 600) bez przeliczania team_A_side.
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 540 660');
  svg.setAttribute('class', 'field field-half');
  svg.setAttribute('xmlns', ns);

  const name = teamName || 'Drużyna';
  const mockMatch  = { id: '__analytics__', team_A: name, team_B: '__other__', team_A_side: 'left' };
  const mockEvents = events.map(e => Object.assign({}, e, { team_event: name }));
  const mockViewer = { view_mode: 'half-A', display_mode: 'heatmap' };

  drawHalfFieldChart(svg, mockMatch, mockEvents, mockViewer);
  return svg.outerHTML;
}

// ── V5-05: Zone efficiency overlay ───────────────────────────────────────────

function _buildZoneEfficiencySvg(events) {
  // SVG attacker-relative: cx = shot_y * 540, cy = (1 - shot_x) * 600
  // Boundaries match algorithms.js: ATTACK_THRESHOLD=0.4368, left/center/right at 1/3 and 2/3
  const ZONE_RECTS = {
    'attack-left':     { x: 0,   y: 0,      w: 180, h: 337.92 },
    'attack-center':   { x: 180, y: 0,      w: 180, h: 337.92 },
    'attack-right':    { x: 360, y: 0,      w: 180, h: 337.92 },
    'midfield-left':   { x: 0,   y: 337.92, w: 180, h: 262.08 },
    'midfield-center': { x: 180, y: 337.92, w: 180, h: 262.08 },
    'midfield-right':  { x: 360, y: 337.92, w: 180, h: 262.08 },
  };
  const ZONE_LABELS = {
    'attack-left':     'Atak L',   'attack-center':   'Atak Ś',  'attack-right':    'Atak P',
    'midfield-left':   'Mid L',    'midfield-center': 'Mid Ś',   'midfield-right':  'Mid P',
  };

  const stats = {};
  Object.keys(ZONE_RECTS).forEach(z => { stats[z] = { total: 0, goals: 0 }; });
  events.forEach(e => {
    if (!e.zone_name || !stats[e.zone_name]) return;
    stats[e.zone_name].total++;
    if (e.result === 'gol') stats[e.zone_name].goals++;
  });

  function effColor(pct) {
    if (pct === 0) return 'rgba(209,213,219,0.5)';
    if (pct < 25)  return `rgba(249,115,22,${0.25 + pct / 100})`;
    return `rgba(22,163,74,${0.3 + pct / 100 * 0.6})`;
  }

  const zoneOverlays = Object.entries(ZONE_RECTS).map(([zone, rect]) => {
    const s = stats[zone];
    const pct = s.total > 0 ? Math.round((s.goals / s.total) * 100) : 0;
    const color = effColor(pct);
    const lx = rect.x + rect.w / 2;
    const ly = rect.y + rect.h / 2;
    return `
      <rect x="${rect.x}" y="${rect.y}" width="${rect.w}" height="${rect.h}" fill="${color}"/>
      <text x="${lx}" y="${ly - 8}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="white" font-weight="600" opacity="0.9">${ZONE_LABELS[zone]}</text>
      <text x="${lx}" y="${ly + 10}" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="white" font-weight="700">${pct}%</text>
      <text x="${lx}" y="${ly + 26}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="white" opacity="0.8">${s.goals}g / ${s.total}s</text>`;
  }).join('');

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 540 660');
  svg.setAttribute('class', 'field field-half');
  svg.setAttribute('xmlns', ns);
  svg.innerHTML = `
    <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">Skuteczność per strefa</text>
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="540" height="600" fill="#9bbf85"/>
      <line x1="0" y1="600" x2="540" y2="600" stroke="white" stroke-width="3"/>

// ── Historia meczów (H-07) ────────────────────────────────────────────────────

function _renderAnalyticsMatchHistory(filtered, allEvents, allMatches, f) {
  if (!f.team) return '';

  let relevantMatches = allMatches.filter(m =>
    m.team_A === f.team || m.team_B === f.team
  );
  if (f.tournament) relevantMatches = relevantMatches.filter(m => m.tournament === f.tournament);
  if (f.dateFrom)   relevantMatches = relevantMatches.filter(m => m.match_date >= f.dateFrom);
  if (f.dateTo)     relevantMatches = relevantMatches.filter(m => m.match_date <= f.dateTo);

  relevantMatches = [...relevantMatches].sort((a, b) => String(b.match_date).localeCompare(String(a.match_date)));

  if (relevantMatches.length === 0) return '';

  const rows = relevantMatches.map(m => {
    const mEvents = allEvents.filter(e => String(e.match_id) === String(m.id));
    const goalsA  = mEvents.filter(e => e.team_event === m.team_A && e.result === 'gol').length;
    const goalsB  = mEvents.filter(e => e.team_event === m.team_B && e.result === 'gol').length;
    const hasEvents = mEvents.length > 0;
    const opponent = m.team_A === f.team ? m.team_B : m.team_A;
    const myGoals  = m.team_A === f.team ? goalsA : goalsB;
    const oppGoals = m.team_A === f.team ? goalsB : goalsA;
    const result   = !hasEvents ? '— : —' : `${myGoals} : ${oppGoals}`;
    const won  = hasEvents && myGoals > oppGoals;
    const drew = hasEvents && myGoals === oppGoals;

    return `
      <tr class="match-history-row ${won ? 'won' : drew ? 'drew' : hasEvents ? 'lost' : ''}">
        <td>${escapeHtml(String(m.match_date))}</td>
        <td>${escapeHtml(m.tournament || '—')}</td>
        <td>${escapeHtml(opponent)}</td>
        <td class="match-result">${result}</td>
        <td><button class="btn btn-sm" data-action="open-viewer-from-analytics" data-arg="${escapeHtml(String(m.id))}">Podgląd</button></td>
      </tr>`;
  }).join('');

  return `
    <section class="analytics-section">
      <h2>Historia meczów — ${escapeHtml(f.team)}</h2>
      <table class="stats-table match-history-table">
        <thead><tr><th>Data</th><th>Turniej</th><th>Rywal</th><th>Wynik</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>`;
}

  const names = new Set();
  (DATA.scheduledMatches || []).forEach(m => {
    if (m.team_A) names.add(m.team_A.trim());
    if (m.team_B) names.add(m.team_B.trim());

  return [...names].sort((a, b) => a.localeCompare(b));

// ── Obliczenia ────────────────────────────────────────────────────────────────

function _computeStandings(events, matches, tournament) {
  const tourMatches = matches.filter(m =>
    m.tournament === tournament && m.status === 'finished'
  );

  if (tourMatches.length === 0) return [];

  const teamSet = new Set();
  tourMatches.forEach(m => {
    if (m.team_A) teamSet.add(m.team_A);
    if (m.team_B) teamSet.add(m.team_B);
  });

  const tourEvents = events.filter(e => e.tournament === tournament);

  return [...teamSet].map(team => {
    const teamMatches = tourMatches.filter(m => m.team_A === team || m.team_B === team);
    const matchIds    = new Set(teamMatches.map(m => String(m.id)));

    const teamEvents = tourEvents.filter(e =>
      matchIds.has(String(e.match_id)) && e.team_event === team
    );
    const oppEvents = tourEvents.filter(e =>
      matchIds.has(String(e.match_id)) && e.team_event !== team
    );

    const goals      = teamEvents.filter(e => e.result === 'gol').length;
    const celne      = teamEvents.filter(e => e.result === 'celny').length;
    const niecelne   = teamEvents.filter(e => e.result === 'niecelny').length;
    const shots      = goals + celne + niecelne;
    const conceded   = oppEvents.filter(e => e.result === 'gol').length;
    const manUpGoals = teamEvents.filter(e => e.result === 'gol' && e.man_up).length;
    const pctSkut    = shots > 0 ? Math.round(goals / shots * 100) : 0;
    const pctCel     = shots > 0 ? Math.round((goals + celne) / shots * 100) : 0;

    return { team, matches: teamMatches.length, goals, conceded, celne, niecelne, pctSkut, pctCel, manUpGoals };
  });
}

function _sortStandings(rows, sort) {
  const key = sort.col;
  const dir = sort.dir === 'asc' ? 1 : -1;
  const keyMap = {
    team:        r => r.team,
    matches:     r => r.matches,
    goals:       r => r.goals,
    conceded:    r => r.conceded,
    celne:       r => r.celne,
    niecelne:    r => r.niecelne,
    pctSkut:     r => r.pctSkut,
    pctCel:      r => r.pctCel,
    manUpGoals:  r => r.manUpGoals,
  };
  const fn = keyMap[key] || (r => r.goals);
  return [...rows].sort((a, b) => {
    const av = fn(a), bv = fn(b);
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return (b.goals - a.goals) * dir;
  });
}

// ── Renderowanie ──────────────────────────────────────────────────────────────

function _renderStandingsTable(rows, sort) {
  const cols = [
    { key: 'team',       label: 'Drużyna',      align: 'left'   },
    { key: 'matches',    label: 'Mecze',         align: 'center' },
    { key: 'goals',      label: 'Gole+',         align: 'center' },
    { key: 'conceded',   label: 'Gole−',         align: 'center' },
    { key: 'celne',      label: 'Celne',         align: 'center' },
    { key: 'niecelne',   label: 'Niecelne',      align: 'center' },
    { key: 'pctSkut',    label: '% skuteczności', align: 'center' },
    { key: 'pctCel',     label: '% celności',    align: 'center' },
    { key: 'manUpGoals', label: 'Man-up gole',   align: 'center' },
  ];

  const headers = cols.map(c => {
    const isActive = sort.col === c.key;
    const arrow    = isActive ? (sort.dir === 'desc' ? ' ▼' : ' ▲') : '';
    return `<th class="sortable ${isActive ? 'sort-active' : ''}" data-action="standings-sort" data-arg="${c.key}" style="text-align:${c.align}">${c.label}${arrow}</th>`;
  }).join('');

  const bodyRows = rows.map((r, i) => `
    <tr class="standings-row">
      <td class="standings-rank">${i + 1}. ${escapeHtml(r.team)}</td>
      <td class="center">${r.matches}</td>
      <td class="center goals-scored">${r.goals}</td>
      <td class="center goals-conceded">${r.conceded}</td>
      <td class="center">${r.celne}</td>
      <td class="center">${r.niecelne}</td>
      <td class="center">${r.pctSkut}%</td>
      <td class="center">${r.pctCel}%</td>
      <td class="center">${r.manUpGoals || '—'}</td>
    </tr>`).join('');

  return `
    <table class="standings-table">
      <thead><tr>${headers}</tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>`;
}

// Modal dispatcher + 4 modal templates (result / edit-event / confirm-end / ad-hoc).

function renderModal() {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.dataset.action = 'modal-bg-click';

  if      (APP.modal.type === 'result')         bg.innerHTML = renderResultModal(APP.modal.pending);
  else if (APP.modal.type === 'edit-event')     bg.innerHTML = renderEditEventModal(APP.modal.event);
  else if (APP.modal.type === 'confirm-end')    bg.innerHTML = renderConfirmEnd();
  else if (APP.modal.type === 'ad-hoc')         bg.innerHTML = renderAdHocModal();
  else if (APP.modal.type === 'tournament-form') bg.innerHTML = renderTournamentModal(APP.modal.tournament);
  else if (APP.modal.type === 'match-form')      bg.innerHTML = renderMatchModal(APP.modal.match);

  document.body.appendChild(bg);
}

function closeModal() { APP.modal = null; render(); }

// HANDLERS map (data-action → fn) + global event delegation listeners (click + change).

const HANDLERS = {
  'open-admin':     () => goAdmin(),
  'open-analytics': () => goAnalytics(),
  'home-retry':     () => loadHomeData(),
  'viewer-retry':   () => startViewerRefresh(),
  'admin-retry':    () => loadAdminData(),

  // Analytics
  'analytics-retry':  () => loadAnalyticsData(),
  'analytics-filter-change': (val, el) => {
    const field = el.dataset.field;
    if (field && field in APP.analyticsFilters) {
      APP.analyticsFilters[field] = val;
      if (field === 'tournament') APP.analyticsFilters.team = '';
      render();
    }
  },
  'go-home-from-analytics': () => goHome(),
  'analytics-heatmap-toggle': (mode) => {
    APP.analyticsHeatmapMode = mode;
    render();
  },
  'open-viewer-from-analytics': (matchId) => {
    // Sync analytics matches into DATA so viewer can find match info
    const am = APP.analyticsData && APP.analyticsData.matches;
    if (am) {
      am.forEach(m => {
        if (!DATA.scheduledMatches.find(x => String(x.id) === String(m.id))) {
          DATA.scheduledMatches.push(m);
        }
      });
    }
    openMatchViewer(matchId);
  },

  // Standings (tabela ligowa)
  'open-standings':            () => go('standings'),
  'go-home-from-standings':    () => goHome(),
  'standings-retry':           () => loadStandingsData(),
  'standings-set-tournament':  (val) => {
    APP.standingsTournament = val;
    render();
  },
  'standings-sort': (col) => {
    if (APP.standingsSort.col === col) {
      APP.standingsSort.dir = APP.standingsSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      APP.standingsSort = { col, dir: 'desc' };
    }
    render();
  },

  // Ręczny retry eventu z błędem sync (krok 8)
  'retry-event': (clientEventId) => {
    const ev = DATA.events.find(e => e.client_event_id === clientEventId);
    if (!ev || ev._syncing) return;

    // Sprawdź walidację przed wysłaniem
    const validationError = validateEventPayload(ev);
    if (validationError) {
      const idx = DATA.events.findIndex(e => e.client_event_id === clientEventId);
      if (idx >= 0) {
        DATA.events[idx] = Object.assign({}, DATA.events[idx], {
          _syncError: 'Błąd walidacji: ' + validationError,
        });
      }
      render();
      return;
    }

    const idx = DATA.events.findIndex(e => e.client_event_id === clientEventId);
    if (idx < 0) return;
    DATA.events[idx] = Object.assign({}, DATA.events[idx], { _syncing: true, _syncError: null });
    render();

    gasSaveEvent(ev).then(function (result) {
      const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
      if (i >= 0) {
        DATA.events[i] = Object.assign({}, DATA.events[i], {
          id:         result.id,
          _syncing:   false,
          _syncError: null,
        });
        removeFromOfflineBuffer(clientEventId);
      }
      render();
    }).catch(function (err) {
      if (err.code !== 'DEV_MODE') {
        const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
        if (i >= 0) {
          DATA.events[i] = Object.assign({}, DATA.events[i], {
            _syncing:   false,
            _syncError: err.message || 'Błąd zapisu — wyślij ponownie',
          });
        }
        render();
      }
    });
  },

  // Routing
  'open-match':  (id) => openMatchInput(id),
  'open-viewer': (id) => openMatchViewer(id),
  'back-home':   () => goHome(),
  'ad-hoc':      () => { APP.modal = { type: 'ad-hoc' }; render(); },

  // ===== Admin (etap C) =====
  'admin-set-range':      (range) => { APP.adminFilter.range = range; render(); },
  'admin-set-tournament': () => {
    const sel = document.getElementById('admin-filter-tournament');
    if (sel) APP.adminFilter.tournament = sel.value;
    render();
  },
  'admin-set-status': () => {
    const sel = document.getElementById('admin-filter-status');
    if (sel) APP.adminFilter.status = sel.value;
    render();
  },

  'tournament-new':  () => { APP.modal = { type: 'tournament-form', tournament: null }; render(); },
  'tournament-edit': (id) => {
    const t = DATA.tournaments.find(x => x.id === id);
    if (!t) return;
    APP.modal = { type: 'tournament-form', tournament: t };
    render();
  },
  'tournament-delete': (id) => {
    const t = DATA.tournaments.find(x => x.id === id);
    if (!t) return;
    const matchCount = DATA.scheduledMatches.filter(m => m.tournament === t.name).length;
    const msg = matchCount > 0
      ? `Usunąć turniej „${t.name}"? ${matchCount} przypisanych meczów zostanie BEZ turnieju (string nie wyczyści się automatycznie).`
      : `Usunąć turniej „${t.name}"?`;
    if (!confirm(msg)) return;
    // Optimistic remove
    DATA.tournaments = DATA.tournaments.filter(x => x.id !== id);
    render();
    // Async GAS
    gasDeleteTournament(id).catch(function(e) {
      if (e.code !== 'DEV_MODE') {
        APP.banner = { type: 'error', msg: 'Błąd usunięcia turnieju: ' + (e.message || e) };
        render();
      }
    });
  },
  'submit-tournament': (id) => {
    const input = document.getElementById('tournament-name');
    if (!input) return;
    const name = input.value.trim();
    if (!name) { alert('Nazwa turnieju nie może być pusta.'); return; }
    if (id) {
      // Edit — optimistic update
      const t = DATA.tournaments.find(x => x.id === id);
      if (t) t.name = name;
      APP.modal = null;
      render();
      // Async GAS
      gasUpdateTournament(id, name).catch(function(e) {
        if (e.code !== 'DEV_MODE') {
          APP.banner = { type: 'error', msg: 'Błąd zapisu turnieju: ' + (e.message || e) };
          render();
        }
      });
    } else {
      // Create — optimistic add z tymczasowym ID
      const localId = 'tlocal_' + Date.now();
      DATA.tournaments.push({ id: localId, name });
      APP.modal = null;
      render();
      // Async GAS — podmień lokalny ID na GAS ID
      gasCreateTournament(name).then(function(result) {
        const t = DATA.tournaments.find(x => x.id === localId);
        if (t) t.id = result.id;
        render();
      }).catch(function(e) {
        if (e.code !== 'DEV_MODE') {
          APP.banner = { type: 'error', msg: 'Błąd tworzenia turnieju: ' + (e.message || e) };
          render();
        }
      });
    }
  },

  'match-new':  () => { APP.modal = { type: 'match-form', match: null }; render(); },
  'match-edit': (id) => {
    const m = DATA.scheduledMatches.find(x => x.id === id);
    if (!m) return;
    APP.modal = { type: 'match-form', match: m };
    render();
  },
  'match-delete': (id) => {
    const m = DATA.scheduledMatches.find(x => x.id === id);
    if (!m) return;
    const eventCount = DATA.events.filter(e => e.match_id === id).length;
    const msg = eventCount > 0
      ? `Usunąć mecz „${m.team_A} vs ${m.team_B}" (${m.match_date})? Razem z nim usuniętych zostanie ${eventCount} zarejestrowanych eventów.`
      : `Usunąć mecz „${m.team_A} vs ${m.team_B}" (${m.match_date})?`;
    if (!confirm(msg)) return;
    // Optimistic remove
    DATA.scheduledMatches = DATA.scheduledMatches.filter(x => x.id !== id);
    DATA.events           = DATA.events.filter(e => e.match_id !== id);
    render();
    // Async GAS
    gasDeleteMatch(id).catch(function(e) {
      if (e.code !== 'DEV_MODE') {
        APP.banner = { type: 'error', msg: 'Błąd usunięcia meczu: ' + (e.message || e) };
        render();
      }
    });
  },
  'submit-match': (id) => {
    const tournament = (document.getElementById('match-tournament').value || '').trim();
    const teamA      = document.getElementById('match-team-a').value.trim().replace(/\s+/g, ' ');
    const teamB      = document.getElementById('match-team-b').value.trim().replace(/\s+/g, ' ');
    const matchDate  = document.getElementById('match-date').value;
    const status     = document.getElementById('match-status').value;
    const videoUrl   = (document.getElementById('match-video-url').value || '').trim();
    if (!teamA || !teamB || !matchDate) {
      alert('Wypełnij obie drużyny i datę.');
      return;
    }
    if (id) {
      // Edit — optimistic update
      const m = DATA.scheduledMatches.find(x => x.id === id);
      if (m) Object.assign(m, { tournament, team_A: teamA, team_B: teamB, match_date: matchDate, status, video_url: videoUrl });
      APP.modal = null;
      render();
      // Async GAS
      gasUpdateMatch(id, { tournament, team_A: teamA, team_B: teamB, match_date: matchDate, status, video_url: videoUrl })
        .catch(function(e) {
          if (e.code !== 'DEV_MODE') {
            APP.banner = { type: 'error', msg: 'Błąd zapisu meczu: ' + (e.message || e) };
            render();
          }
        });
    } else {
      // Create — optimistic add z tymczasowym ID
      const localId = 'mlocal_' + Date.now();
      DATA.scheduledMatches.push({
        id: localId,
        tournament, team_A: teamA, team_B: teamB, match_date: matchDate, status: status || 'scheduled', video_url: videoUrl
      });
      APP.modal = null;
      render();
      // Async GAS — podmień lokalny ID na GAS ID
      gasCreateMatch({ tournament, team_A: teamA, team_B: teamB, match_date: matchDate, status: status || 'scheduled', video_url: videoUrl })
        .then(function(result) {
          const m = DATA.scheduledMatches.find(x => x.id === localId);
          if (m) m.id = result.id;
          render();
        })
        .catch(function(e) {
          if (e.code !== 'DEV_MODE') {
            APP.banner = { type: 'error', msg: 'Błąd tworzenia meczu: ' + (e.message || e) };
            render();
          }
        });
    }
  },

  // CSV bulk import
  'csv-import-file': (val, el) => {
    if (!el || !el.files || el.files.length === 0) return;
    const file = el.files[0];
    const reader = new FileReader();
    reader.onload = function(ev) {
      APP.csvImport = parseCsvMatches(ev.target.result);
      render();
    };
    reader.readAsText(file, 'UTF-8');
    el.value = '';
  },
  'csv-import-cancel': () => {
    APP.csvImport = null;
    render();
  },
  'csv-import-submit': () => {
    if (!APP.csvImport) return;
    const validRows = APP.csvImport.rows.filter(r => !r._error);
    if (validRows.length === 0) return;

    APP.csvImport = Object.assign({}, APP.csvImport, { importing: true });
    render();

    const matches = validRows.map(r => ({
      tournament: r.tournament,
      match_date: r.match_date,
      team_A:     r.team_A,
      team_B:     r.team_B,
      video_url:  r.video_url || '',
      status:     'scheduled',
    }));

    gasBulkCreateMatches(matches).then(function(result) {
      matches.forEach(function(m, i) {
        DATA.scheduledMatches.push(Object.assign({ id: result.ids[i] }, m));
      });
      APP.csvImport = null;
      alert('Zaimportowano ' + result.count + ' meczy.');
      render();
    }).catch(function(e) {
      if (e.code === 'DEV_MODE') {
        matches.forEach(function(m, i) {
          DATA.scheduledMatches.push(Object.assign({ id: 'csv_' + Date.now() + '_' + i }, m));
        });
        APP.csvImport = null;
        alert('[DEV] Zaimportowano ' + matches.length + ' meczy lokalnie.');
        render();
      } else {
        APP.csvImport = Object.assign({}, APP.csvImport, { importing: false });
        alert('Błąd importu: ' + (e.message || e));
        render();
      }
    });
  },

  // Viewer controls
  'viewer-set-mode':           (mode) => { APP.viewer.view_mode    = mode; render(); },
  'viewer-set-display':        (mode) => { APP.viewer.display_mode = mode; render(); },
  'viewer-set-period-filter':  () => {
    const sel = document.getElementById('filter-period');
    if (sel) APP.viewer.filter_period = sel.value;
    render();
  },
  'viewer-set-result-filter':  () => {
    const sel = document.getElementById('filter-result');
    if (sel) APP.viewer.filter_result = sel.value;
    render();
  },

  // Period transitions
  'next-period': () => {
    const newP = nextPeriod(APP.match.period);
    APP.match.period = newP;
    APP.banner = { type: 'swap-question', newPeriod: newP };
    render();
  },
  'period-end-prompt': () => {
    APP.banner = { type: 'period-end', fromPeriod: APP.match.period };
    render();
  },
  'next-overtime': () => {
    const newP = nextPeriod(APP.banner.fromPeriod);
    APP.match.period = newP;
    APP.banner = { type: 'swap-question', newPeriod: newP };
    render();
  },
  'cancel-banner': () => { APP.banner = null; render(); },

  // Sides
  'swap-sides': () => {
    APP.match.team_A_side = APP.match.team_A_side === 'left' ? 'right' : 'left';
    APP.banner = null;
    render();
  },
  'swap-answer': (yes) => {
    if (yes === 'yes') {
      APP.match.team_A_side = APP.match.team_A_side === 'left' ? 'right' : 'left';
    }
    APP.banner = null;
    render();
  },

  // Own-half mode
  'own-half-toggle': () => {
    APP.match.own_half_mode = APP.match.own_half_mode === 'active' ? null : 'active';
    APP.banner = APP.match.own_half_mode === 'active' ? { type: 'own-half' } : null;
    render();
  },
  'cancel-own-half': () => { APP.match.own_half_mode = null; APP.banner = null; render(); },

  'toggle-dark-mode': () => {
    const html = document.documentElement;
    const isDark = html.dataset.theme === 'dark';
    html.dataset.theme = isDark ? 'light' : 'dark';
    localStorage.setItem('lax_theme', html.dataset.theme);
    _syncThemeToggle();
  },

  'toggle-zones':   () => { APP.match.show_zones        = !APP.match.show_zones;        render(); },
  'toggle-history': () => { APP.match.history_expanded  = !APP.match.history_expanded;  render(); },

  // Event creation/edit/delete
  'submit-result': (result) => {
    const pending  = APP.modal.pending;
    const manUp    = document.getElementById('flag-man-up').checked;
    const manDown  = document.getElementById('flag-man-down').checked;
    const assisted = document.getElementById('flag-assisted')?.checked ?? false;
    recordEvent({
      shot_x: pending.shot_x, shot_y: pending.shot_y,
      zone_name: pending.zone_name, team_event: pending.team_event,
      result, man_up: manUp, man_down: manDown, assisted
    });
    APP.modal = null;
    render();
  },

  'edit-event': (id) => {
    const e = DATA.events.find(x => String(x.id) === String(id));
    if (!e) return;
    APP.modal = { type: 'edit-event', event: e };
    render();
  },
  'submit-edit': (id) => {
    const team     = document.getElementById('edit-team').value;
    const period   = document.getElementById('edit-period').value;
    const result   = document.getElementById('edit-result').value;
    const manUp    = document.getElementById('edit-man-up').checked;
    const manDown  = document.getElementById('edit-man-down').checked;
    const assisted = document.getElementById('edit-assisted')?.checked ?? false;
    updateEvent(id, { team_event: team, period, result, man_up: manUp, man_down: manDown, assisted });
    APP.modal = null;
    render();
  },
  'delete-event': (id) => {
    if (!confirm('Usunąć ten event?')) return;
    deleteEvent(id);
    render();
  },

  // End match
  'end-match':         () => { APP.modal = { type: 'confirm-end' }; APP.banner = null; render(); },
  'confirm-end-match': () => {
    const match = DATA.scheduledMatches.find(m => m.id === APP.matchId);
    if (match) {
      match.status = 'finished';
      gasUpdateMatch(match.id, { status: 'finished' }).catch(function () {});
    }
    goHome();
  },

  // Modal actions
  'cancel-modal': () => closeModal(),

  // Ad-hoc match creation
  'create-ad-hoc': () => {
    const tournament = document.getElementById('adhoc-tournament').value.trim();
    const teamA      = document.getElementById('adhoc-team-a').value.trim().replace(/\s+/g, ' ');
    const teamB      = document.getElementById('adhoc-team-b').value.trim().replace(/\s+/g, ' ');
    const date       = document.getElementById('adhoc-date').value;
    if (!teamA || !teamB || !date) { alert('Wypełnij drużyny i datę.'); return; }

    // Twórz mecz lokalnie od razu (optimistic), wyślij do GAS async
    const localId = 'adhoc_' + Date.now();
    const newMatch = {
      id: localId,
      tournament, team_A: teamA, team_B: teamB, match_date: date, status: 'live'
    };
    DATA.scheduledMatches.push(newMatch);
    APP.modal = null;
    openMatchInput(localId);

    // Async zapis do GAS (aktualizuje ID w tle — ale mecz już otwarty lokalnie)
    gasCreateMatch({ tournament, team_A: teamA, team_B: teamB, match_date: date, status: 'live' })
      .then(function (result) {
        // Zamień lokalny ID na GAS ID
        const m = DATA.scheduledMatches.find(function (x) { return x.id === localId; });
        if (m) m.id = result.id;
        if (APP.matchId === localId) APP.matchId = result.id;
        // Zaktualizuj match_id w eventach tego meczu
        DATA.events.forEach(function (e) {
          if (e.match_id === localId) e.match_id = result.id;
        });
      })
      .catch(function () { /* DEV_MODE lub błąd — lokalny ID zostaje */ });
  },

  // Mutex flags (man-up XOR man-down)
  'mutex-flag': (which) => {
    const up = document.getElementById('flag-man-up');
    const down = document.getElementById('flag-man-down');
    if (!up || !down) return;
    if (which === 'man-up'   && up.checked)   down.checked = false;
    if (which === 'man-down' && down.checked) up.checked   = false;
  },
  'mutex-edit-flag': (which) => {
    const up = document.getElementById('edit-man-up');
    const down = document.getElementById('edit-man-down');
    if (!up || !down) return;
    if (which === 'man-up'   && up.checked)   down.checked = false;
    if (which === 'man-down' && down.checked) up.checked   = false;
  },

  'modal-bg-click': () => { /* handled separately in click listener */ },

  // Viewer: toggle split-barów (F-02)
  'toggle-split-bars': () => { APP.splitBars = !APP.splitBars; render(); },
};

// ===== Event delegation =====

document.addEventListener('click', (e) => {
  // Click on .modal-bg directly (not on its children) closes the modal.
  if (e.target.classList && e.target.classList.contains('modal-bg')) {
    closeModal();
    return;
  }
  const target = e.target.closest('[data-action]');
  if (!target) return;
  // <select> dispatches via 'change' instead.
  if (target.tagName === 'SELECT') return;
  const action = target.dataset.action;
  if (action === 'modal-bg-click') return;
  const handler = HANDLERS[action];
  if (handler) handler(target.dataset.arg);
});

document.addEventListener('change', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  if (target.tagName !== 'SELECT' && target.type !== 'checkbox' && target.type !== 'date' && target.type !== 'file') return;
  const action = target.dataset.action;
  const handler = HANDLERS[action];
  if (!handler) return;
  if (action === 'analytics-filter-change' || action === 'csv-import-file' || action === 'standings-set-tournament') {
    handler(target.value, target);
  } else {
    handler(target.dataset.arg);
  }
});

// ── CSV parsing ────────────────────────────────────────────────────────────────

function parseCsvMatches(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  if (lines.length === 0) return { rows: [] };

  const sep = lines[0].indexOf(';') >= 0 ? ';' : ',';

  // Auto-detect header row
  const firstCells = lines[0].split(sep).map(c => c.trim().toLowerCase().replace(/^"|"$/g, ''));
  const hasHeader = ['turniej', 'tournament', 'data', 'date', 'druzyna_a', 'team_a'].some(h => firstCells.includes(h));
  const dataLines = hasHeader ? lines.slice(1) : lines;

  const rows = dataLines.map(function(line, i) {
    const cells = line.split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
    const tournament = cells[0] || '';
    const match_date = cells[1] || '';
    const team_A     = cells[2] || '';
    const team_B     = cells[3] || '';
    const video_url  = cells[4] || '';

    let _error = null;
    if (!tournament)                               _error = 'Brak nazwy turnieju';
    else if (!match_date)                          _error = 'Brak daty';
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(match_date)) _error = 'Nieprawidłowa data — wymagany format RRRR-MM-DD';
    else if (!team_A)                              _error = 'Brak drużyny A';
    else if (!team_B)                              _error = 'Brak drużyny B';

    return { tournament, match_date, team_A, team_B, video_url, _error, _lineNum: i + (hasHeader ? 2 : 1) };
  });

  return { rows };
}


// ==============================================================================
// app.js
// ==============================================================================


// Top-level render dispatcher + init.

const APP_VERSION = 'v2.0.0';

function _renderFooter(container) {
  const f = document.createElement('footer');
  f.className = 'app-footer';
  f.textContent = 'Lacrosse Stats ' + APP_VERSION;
  container.appendChild(f);
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if      (APP.screen === 'home')          renderHome(app);
  else if (APP.screen === 'admin')         renderAdmin(app);
  else if (APP.screen === 'match-input')   renderMatchInput(app);
  else if (APP.screen === 'match-viewer')  renderMatchViewer(app);
  else if (APP.screen === 'analytics')     renderAnalytics(app);
  else if (APP.screen === 'standings')     renderStandings(app);

  _renderFooter(app);

  // Strip stale modals from previous render
  const oldModal = document.querySelector('.modal-bg');
  if (oldModal) oldModal.remove();

  if (APP.modal) renderModal();
  _syncThemeToggle();
}

// Init motywu — przed pierwszym render()
(function() {
  const saved = localStorage.getItem('lax_theme');
  if (saved === 'dark' || saved === 'light') {
    document.documentElement.dataset.theme = saved;
  }
})();

function _syncThemeToggle() {
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '🌙';
}

// Init — must be last after all modules loaded.
render();
</script>
