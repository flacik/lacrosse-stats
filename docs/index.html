<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lacrosse Stats — mockup</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #f5f5f3; color: #1a1a1a;
  font-size: 14px; line-height: 1.45;
}

.btn {
  font-family: inherit; font-size: 13px; padding: 8px 14px;
  border: 1px solid #d4d4d0; background: white; color: #1a1a1a;
  border-radius: 6px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: #f0f0eb; }
.btn-primary { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.btn-primary:hover { background: #333; }
.btn-secondary { border: 1px solid #374151; color: #374151; background: transparent; }
.btn-secondary:hover { background: #f3f4f6; }
.btn-danger { color: #b91c1c; border-color: #fecaca; }
.btn-danger:hover { background: #fef2f2; }
.btn-active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.btn-warning { color: #854d0e; border-color: #fde68a; background: #fefce8; }
.btn-warning:hover { background: #fef9c3; }
.btn-warning.btn-active { background: #ca8a04; color: white; border-color: #ca8a04; }

.app-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; background: white;
  border-bottom: 1px solid #e5e5e0;
}
.app-header h1 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; }
.app-header .meta { font-size: 12px; color: #666; }

.match-info-bar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 20px; background: white;
  border-bottom: 1px solid #f0f0eb;
  font-size: 13px;
  transition: background 0.3s;
}
.match-info-bar.header-live {
  background: #dc2626; color: white;
  animation: pulse-live 2s infinite;
  border-bottom-color: #b91c1c;
}
.match-info-bar.header-archived { background: #6b7280; color: white; border-bottom-color: #4b5563; }
.match-info-bar.header-live .team-A-color { color: #93c5fd; }
.match-info-bar.header-live .team-B-color { color: #fca5a5; }
.match-info-bar.header-live .sep         { color: rgba(255,255,255,0.7); }
.match-info-bar.header-live .period,
.match-info-bar.header-archived .period  { background: rgba(0,0,0,0.2); color: white; }
.match-info-bar.header-live .refresh-tag,
.match-info-bar.header-archived .refresh-tag {
  background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.3); color: white;
}
.match-info-bar.header-live .refresh-tag .dot,
.match-info-bar.header-archived .refresh-tag .dot { background: white; animation: none; }
.match-info-bar.header-archived .team-A-color { color: #bfdbfe; }
.match-info-bar.header-archived .team-B-color { color: #fecaca; }
.match-info-bar.header-archived .tournament   { color: rgba(255,255,255,0.8); }
@keyframes pulse-live { 0%,100% { opacity:1; } 50% { opacity:.85; } }
.match-info-bar .score {
  font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
  display: flex; gap: 10px; align-items: center;
}
.match-info-bar .score .team-A-color { color: #1d4ed8; }
.match-info-bar .score .team-B-color { color: #b91c1c; }
.match-info-bar .score .sep { color: #999; font-weight: 500; }
.match-info-bar .period {
  background: #fff7ed; color: #9a3412;
  padding: 4px 10px; border-radius: 4px; font-weight: 600;
}
.match-info-bar .tournament { color: #666; }
.match-info-bar .sides-indicator {
  margin-left: auto;
  font-size: 12px; color: #666;
}

.home-content { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
.home-content h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
  color: #666; margin: 0 0 12px 0; font-weight: 600;
}
.match-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.match-card {
  background: white; padding: 14px 16px;
  border: 1px solid #e5e5e0; border-radius: 10px;
}
.match-card.finished { opacity: 0.7; }
.match-tournament { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin-bottom: 4px; }
.match-teams {
  display: flex; align-items: center; gap: 12px;
  font-size: 17px; font-weight: 600; margin-bottom: 4px;
}
.match-teams .vs { color: #999; font-weight: 400; font-size: 14px; }
.match-teams .match-score {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 1.6rem; font-weight: 700; color: #1a1a1a;
  flex: 1; text-align: center;
}
.badge-live {
  display: inline-block; background: #dc2626; color: white;
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  padding: 2px 6px; border-radius: 3px;
  animation: pulse-live 2s infinite;
  vertical-align: middle;
}
.match-meta { font-size: 12px; color: #888; margin-bottom: 12px; }
.match-meta .status-scheduled { color: #16a34a; }
.match-meta .status-live { color: #ca8a04; font-weight: 600; }
.match-meta .status-finished { color: #888; }
.match-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.add-match {
  width: 100%; padding: 14px;
  background: white; border: 1px dashed #d4d4d0;
  border-radius: 10px; color: #666;
  cursor: pointer; font-family: inherit; font-size: 14px;
}
.add-match:hover { background: #f0f0eb; color: #1a1a1a; border-color: #1a1a1a; }

.match-screen { padding: 0 0 40px 0; }
.match-section {
  max-width: 1100px; margin: 0 auto; padding: 16px 20px 0 20px;
}

svg.field {
  width: 100%; max-width: 1100px; height: auto;
  user-select: none; cursor: crosshair;
  background: white; border-radius: 8px;
  display: block;
}
svg.field.field-half {
  /* Portrait half-field: keep it narrow so it doesn't blow up vertically on wide screens. */
  max-width: 480px;
  margin: 0 auto;
}
.zone-overlay { opacity: 0.55; pointer-events: none; }
.zone-rect { stroke: white; stroke-width: 1; stroke-opacity: 0.6; }
.zone-label-team {
  fill: white; font-size: 36px; text-anchor: middle;
  pointer-events: none; opacity: 0.75; font-weight: 700;
}
.marker { stroke-width: 2; stroke: white; }
.marker.latest { stroke-width: 3; }

.match-controls {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-top: 12px; padding: 12px 16px;
  background: white; border-radius: 8px; border: 1px solid #e5e5e0;
}
.match-controls .sep { color: #ddd; }
.match-controls .right { margin-left: auto; display: flex; gap: 8px; }

.match-banner {
  margin: 12px 0 0 0;
  padding: 10px 14px;
  background: #fefce8; border: 1px solid #fde68a; border-radius: 8px;
  font-size: 13px; color: #854d0e;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.match-banner.swap-question { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
.match-banner.period-end { background: #f5f3ff; border-color: #ddd6fe; color: #5b21b6; }
.match-banner button {
  font-family: inherit; font-size: 12px; padding: 4px 10px;
  border: 1px solid currentColor; background: white; color: inherit;
  border-radius: 4px; cursor: pointer;
}
.match-banner button:hover { opacity: 0.8; }
.match-banner button.cancel { color: #666; border-color: #d4d4d0; }
.match-banner button.danger { color: #b91c1c; border-color: #fecaca; }

.history-section {
  background: white; border: 1px solid #e5e5e0; border-radius: 8px;
  margin-top: 12px; overflow: hidden;
}
.history-header {
  padding: 12px 16px; border-bottom: 1px solid #f0f0eb;
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  font-weight: 600; font-size: 14px;
}
.history-header:hover { background: #fafafa; }
.history-header.no-border { border-bottom: none; }
.history-header .count { font-weight: 400; color: #888; font-size: 12px; }
.history-header .toggle-icon { transition: transform 0.2s; display: inline-block; }
.history-header.collapsed .toggle-icon { transform: rotate(-90deg); }
.history-list { max-height: 400px; overflow-y: auto; }
.history-empty { padding: 20px; text-align: center; color: #888; font-size: 13px; }
.history-row {
  display: grid;
  grid-template-columns: 50px 28px 80px minmax(110px, 1fr) auto auto;
  gap: 8px; align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid #f0f0eb;
  font-size: 13px;
}
.history-row:last-child { border-bottom: none; }
.history-row .period {
  font-weight: 600; color: #9a3412; font-size: 11px;
  text-align: center; background: #fff7ed; padding: 2px 0; border-radius: 3px;
}
.history-row .team-tag {
  width: 24px; text-align: center;
  padding: 2px 4px; border-radius: 3px;
  font-weight: 700; font-size: 11px;
}
.history-row .team-tag.A { background: #dbeafe; color: #1d4ed8; }
.history-row .team-tag.B { background: #fee2e2; color: #b91c1c; }
.history-row .result { font-weight: 600; font-size: 12px; }
.history-row .result.gol { color: #15803d; }
.history-row .result.celny { color: #ca8a04; }
.history-row .result.niecelny { color: #888; }
.history-row .zone {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px; color: #444;
}
.history-row .zone.own-half { color: #ca8a04; font-weight: 600; }
.history-row .flags { display: flex; gap: 4px; font-size: 10px; }
.history-row .flag {
  background: #f0f0eb; color: #555; padding: 1px 5px; border-radius: 3px;
}
.history-row .flag.man-up { background: #dcfce7; color: #166534; }
.history-row .flag.man-down { background: #fee2e2; color: #991b1b; }
.history-row .flag.assisted { background: #dbeafe; color: #1d4ed8; }
.history-row .actions { display: flex; gap: 4px; }
.history-row .icon-btn {
  background: none; border: none; cursor: pointer;
  padding: 4px 6px; border-radius: 3px; font-size: 14px;
  color: #888;
}
.history-row .icon-btn:hover { background: #f0f0eb; color: #1a1a1a; }
.history-row .icon-btn.delete:hover { color: #b91c1c; background: #fef2f2; }
.history-row .icon-btn.retry       { color: #1d4ed8; }
.history-row .icon-btn.retry:hover { background: #dbeafe; color: #1e40af; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.modal {
  background: white; border-radius: 14px; padding: 22px;
  max-width: 460px; width: 100%;
  max-height: 90vh; overflow-y: auto;
}
.modal h2 { margin: 0 0 6px 0; font-size: 17px; font-weight: 600; }
.modal .modal-subtitle { font-size: 13px; color: #666; margin-bottom: 16px; }
.modal-context {
  background: #f7f7f5; padding: 12px; border-radius: 8px;
  font-size: 13px; margin-bottom: 16px;
}
.modal-context .row { display: flex; gap: 12px; margin-bottom: 4px; }
.modal-context .row:last-child { margin-bottom: 0; }
.modal-context .label { color: #666; min-width: 70px; }
.modal-context .value.team-A { color: #1d4ed8; font-weight: 600; }
.modal-context .value.team-B { color: #b91c1c; font-weight: 600; }
.modal-context .value.zone {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
}

.result-buttons {
  display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;
}
.result-btn {
  padding: 16px; border: 2px solid; background: white;
  font-family: inherit; font-size: 16px; font-weight: 600;
  border-radius: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.result-btn.niecelny { color: #6b7280; border-color: #d1d5db; }
.result-btn.niecelny:hover { background: #f7f7f5; }
.result-btn.celny { color: #1d4ed8; border-color: #93c5fd; background: #eff6ff; }
.result-btn.celny:hover { background: #dbeafe; }
.result-btn.gol { color: white; border-color: #15803d; background: #16a34a; }
.result-btn.gol:hover { background: #15803d; }

.flag-row {
  display: flex; gap: 12px; margin-bottom: 16px;
  background: #f7f7f5; padding: 12px 14px; border-radius: 8px;
}
.flag-row label {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; cursor: pointer; user-select: none;
  padding: 2px 0;
}
.flag-row input[type="checkbox"] { width: 20px; height: 20px; margin: 0; cursor: pointer; }

.modal-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  border-top: 1px solid #f0f0eb; padding-top: 14px;
}

label.field { display: block; margin-bottom: 12px; }
label.field .field-label {
  display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: #666; margin-bottom: 4px; font-weight: 600;
}
label.field input, label.field select {
  width: 100%; padding: 8px 10px; font-family: inherit; font-size: 14px;
  border: 1px solid #d4d4d0; border-radius: 6px; background: white;
}
label.field input:focus, label.field select:focus {
  outline: 2px solid #1a1a1a; outline-offset: -1px; border-color: transparent;
}

@media (max-width: 700px) {
  .history-row {
    grid-template-columns: 50px 28px 1fr auto;
    gap: 6px;
  }
  .history-row .zone, .history-row .flags { display: none; }
  .match-info-bar .sides-indicator { display: none; }
}

.empty { text-align: center; color: #999; padding: 30px 20px; font-size: 14px; }

/* ===== Viewer (etap B) ===== */
.viewer-screen { padding: 0 0 40px 0; }
.viewer-section { max-width: 1100px; margin: 0 auto; padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 16px; }
.viewer-card {
  background: white; border: 1px solid #e5e5e0; border-radius: 8px; padding: 16px 18px;
}
.viewer-card h3 {
  margin: 0 0 12px 0; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em; color: #666;
}
.viewer-card.shot-chart { padding-bottom: 12px; }
.refresh-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; color: #15803d; background: #f0fdf4;
  padding: 3px 8px; border-radius: 4px; border: 1px solid #bbf7d0;
}
.refresh-tag.refreshing { color: #ca8a04; background: #fefce8; border-color: #fde68a; }
.refresh-tag .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #15803d; animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

table.stats-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
table.stats-table th, table.stats-table td {
  padding: 8px 10px; text-align: left;
  border-bottom: 1px solid #f0f0eb;
}
table.stats-table th {
  font-weight: 600; color: #666; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
table.stats-table th.team-A, table.stats-table td.team-A { text-align: right; color: #1d4ed8; }
table.stats-table th.team-B, table.stats-table td.team-B { text-align: right; color: #b91c1c; }
table.stats-table th.label, table.stats-table td.label { color: #444; }
table.stats-table tr.header-row td, table.stats-table tr.header-row th {
  font-weight: 700; font-size: 12px;
}
table.stats-table tr.summary-row { background: #fafaf7; }
table.stats-table tr.summary-row td { font-weight: 600; }
table.stats-table td.num {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

.viewer-controls {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 12px;
}
.toggle-group { display: flex; gap: 0; }
.toggle-group .btn {
  border-radius: 0; border-right: none;
}
.toggle-group .btn:first-child { border-radius: 6px 0 0 6px; }
.toggle-group .btn:last-child { border-radius: 0 6px 6px 0; border-right: 1px solid #d4d4d0; }
.toggle-group .btn.btn-active { border-color: #1a1a1a; }
.toggle-group .btn.btn-active + .btn { border-left: 1px solid #1a1a1a; }

.viewer-controls select {
  font-family: inherit; font-size: 13px; padding: 7px 10px;
  border: 1px solid #d4d4d0; border-radius: 6px; background: white;
}
.viewer-controls .ctrl-label { font-size: 12px; color: #666; }

.shot-chart-stats {
  display: flex; gap: 16px; flex-wrap: wrap;
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid #f0f0eb; font-size: 12px; color: #666;
}
.shot-chart-stats strong { color: #1a1a1a; }

.no-events {
  text-align: center; padding: 30px; color: #999; font-size: 13px;
}

/* ── Split-bary w tabelach statystyk (F-02) ──────────────────────────────────── */
.split-bar-row td { padding: 0 10px 6px; border-bottom: none; }
.split-bar {
  height: 6px; border-radius: 3px;
  background: linear-gradient(to right, #3b82f6 var(--pct), #ef4444 var(--pct));
}

/* ── Legenda mapy boiska (F-03) ──────────────────────────────────────────────── */
.field-legend {
  display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 12px; color: #6b7280; margin-top: 8px; padding-top: 8px;
  border-top: 1px solid #f0f0eb;
}
.leg-item { display: flex; align-items: center; gap: 5px; }
.leg-item svg { flex-shrink: 0; }

/* ── Tablet responsive layout (F-08) ────────────────────────────────────────── */
@media (min-width: 768px) {
  .viewer-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .viewer-card.shot-chart,
  .viewer-card.per-period {
    grid-column: 1 / -1;
  }
}
.result-btn { min-height: 48px; }

/* ===== Admin (etap C) ===== */
.admin-content {
  max-width: 900px; margin: 0 auto; padding: 24px 20px;
  display: flex; flex-direction: column; gap: 24px;
}
.admin-card {
  background: white; border: 1px solid #e5e5e0; border-radius: 10px; overflow: hidden;
}
.admin-card-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid #f0f0eb;
}
.admin-card-header h2 {
  margin: 0; flex: 1; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: #666; font-weight: 600;
}
.admin-filters {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 12px 18px; background: #fafaf7; border-bottom: 1px solid #f0f0eb;
}
.admin-filter-field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
.admin-filter-field select {
  font-family: inherit; font-size: 13px; padding: 6px 8px;
  border: 1px solid #d4d4d0; border-radius: 6px; background: white;
}
.admin-list { list-style: none; margin: 0; padding: 0; }
.admin-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px; border-bottom: 1px solid #f0f0eb;
}
.admin-row:last-child { border-bottom: none; }
.admin-row-main { flex: 1; min-width: 0; }
.admin-row-main strong { font-weight: 600; }
.admin-row-meta { color: #888; font-size: 12px; margin-left: 8px; }
.admin-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
.admin-empty { padding: 24px 18px; text-align: center; color: #999; font-size: 13px; }
.admin-match-line {
  display: flex; gap: 10px; font-size: 12px; color: #888; margin-bottom: 4px;
}
.admin-date {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #444;
}
.admin-date.today { color: #15803d; font-weight: 600; }
.admin-tournament { color: #888; }
.admin-match-teams {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px;
}
.admin-match-teams .vs { color: #999; font-weight: 400; }
.admin-status {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 1px 6px; border-radius: 3px; font-weight: 600;
}
.admin-status.status-scheduled { background: #dcfce7; color: #15803d; }
.admin-status.status-live      { background: #fef9c3; color: #854d0e; }
.admin-status.status-finished  { background: #e5e7eb; color: #4b5563; }
.admin-event-count { font-size: 11px; color: #888; }

@media (max-width: 700px) {
  .admin-row { flex-direction: column; align-items: stretch; }
  .admin-row-actions { justify-content: flex-end; }
  .admin-filters { padding: 10px 14px; }
}

/* ── Async loading / error states (krok 5) ─────────────────────────────────── */
.loading-state, .error-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px;
  padding: 48px 24px; text-align: center; color: #666;
}
.loading-state .spinner { font-size: 28px; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-state p { margin: 0; color: #b91c1c; font-size: 14px; }

/* ── Sync status badges na kartach eventów (krok 5) ─────────────────────────── */
.sync-badge {
  font-size: 11px; font-weight: 700;
  padding: 1px 5px; border-radius: 3px;

<script>
'use strict';

// ==============================================================================
// gas-client.js
// ==============================================================================


// ═══════════════════════════════════════════════════════════════════════════════
// GAS Client — wrapper nad google.script.run zwracający Promise'y.
// Ładowany jako PIERWSZY skrypt (przed helpers.js), nie może używać uuid/todayISO.
//
// Gdy brak środowiska GAS (lokalny dev / Cowork artifact), odrzuca z kodem
// 'DEV_MODE' — state.js wtedy korzysta z SAMPLE_DATA.
// ═══════════════════════════════════════════════════════════════════════════════

// true gdy działamy wewnątrz GAS HTML Service (i google.script.run jest dostępny)
const IS_GAS = (function () {
  try {
    return typeof google !== 'undefined' &&
           google !== null &&
           typeof google.script !== 'undefined' &&
           typeof google.script.run !== 'undefined';
  } catch (e) {
    return false;
  }
})();

// ── Generyczny wrapper ─────────────────────────────────────────────────────────

/**
 * Wywołuje funkcję GAS `fnName` z argumentami `args`.
 * Zwraca Promise<data> (gdzie data to result.data z { ok: true, data }).
 * Odrzuca z Error (err.code: 'DEV_MODE' | 'RATE_LIMITED' | 'NOT_FOUND' | 'SCHEMA_INVALID' | 'GAS_FAILURE' | 'GAS_ERROR').
 */
function gasCall(fnName, ...args) {
  return new Promise(function (resolve, reject) {
    if (!IS_GAS) {
      var devErr = new Error('DEV_MODE: google.script.run niedostępny (lokalny dev)');
      devErr.code = 'DEV_MODE';
      reject(devErr);
      return;
    }

    var runner = google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.ok) {
          resolve(result.data);
        } else {
          var msg  = (result && result.error && result.error.message) || 'Nieznany błąd GAS';
          var code = (result && result.error && result.error.code)    || 'GAS_ERROR';
          var e    = new Error(msg);
          e.code   = code;
          reject(e);
        }
      })
      .withFailureHandler(function (error) {
        var e  = new Error(error ? (error.message || String(error)) : 'Błąd połączenia GAS');
        e.code = 'GAS_FAILURE';
        reject(e);
      });

    // Dynamiczne wywołanie funkcji GAS po nazwie
    if (typeof runner[fnName] !== 'function') {
      var notFound  = new Error('Brak funkcji GAS: ' + fnName);
      notFound.code = 'GAS_MISSING_FN';
      reject(notFound);
      return;
    }
    runner[fnName].apply(runner, args);
  });
}

function loadOfflineBuffer() {
  try { var raw = localStorage.getItem(OFFLINE_BUFFER_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return [];
}
function saveOfflineBuffer(buffer) {
  try { localStorage.setItem(OFFLINE_BUFFER_KEY, JSON.stringify(buffer)); } catch (e) {}
}
function addToOfflineBuffer(ev) {
  var buffer = loadOfflineBuffer();
  if (!buffer.some(function(b) { return b.client_event_id === ev.client_event_id; })) {
    buffer.push(ev); saveOfflineBuffer(buffer);
  }
}

}

// Mulberry32 — deterministyczny PRNG z seedem
function _prng(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function validateEventPayload(ev) {
  if (!VALID_RESULTS.includes(ev.result))            return 'Nieprawidłowy wynik: ' + ev.result;
  if (typeof ev.shot_x !== 'number' || ev.shot_x < -1 || ev.shot_x > 1) return 'Nieprawidłowa pozycja shot_x';
  if (typeof ev.shot_y !== 'number' || ev.shot_y < 0  || ev.shot_y > 1) return 'Nieprawidłowa pozycja shot_y';
  if (!VALID_ZONES.includes(ev.zone_name))           return 'Nieprawidłowa strefa: ' + ev.zone_name;
  if (!PERIOD_REGEX.test(String(ev.period)))         return 'Nieprawidłowy okres: ' + ev.period;
  if (ev.man_up && ev.man_down)                      return 'Nie można mieć man-up i man-down jednocześnie';
  if (ev.team_A && ev.team_B && ev.team_event !== ev.team_A && ev.team_event !== ev.team_B)
    return 'team_event musi być jedną z drużyn meczu';
  return null;
}

// Pure functions: zone detection, coord transforms, zone layout & colors.
// No state dependencies — everything passed via arguments.
// Coord convention: shot_x ∈ [-1, 1] in attacker frame (0 = midline, 1 = opponent end line, negatives = own half).
// shot_y ∈ [0, 1] (0 = attacker's left, 1 = attacker's right).

const ATTACK_THRESHOLD = 0.4368;  // attack/midfield boundary in attacker progress (restraining line + 20%)

function detectZone(px, py, team_A_side) {
  const A_attacks_right = team_A_side === 'left';
  const click_left_half = px < 0.5;
  const shooter_team = click_left_half
    ? (A_attacks_right ? 'B' : 'A')
    : (A_attacks_right ? 'A' : 'B');
  const shooter_attacks_right =
    (shooter_team === 'A' && A_attacks_right) ||
    (shooter_team === 'B' && !A_attacks_right);
  let shot_x = shooter_attacks_right ? (px - 0.5) * 2 : (0.5 - px) * 2;
  if (shot_x < 0) shot_x = 0;
  const shot_y = shooter_attacks_right ? py : (1 - py);
  const zone_long = shot_x > ATTACK_THRESHOLD ? 'attack' : 'midfield';
  let zone_lat;
  if (shot_y < 1/3) zone_lat = 'left';
  else if (shot_y < 2/3) zone_lat = 'center';
  else zone_lat = 'right';
  return { team: shooter_team, zone: `${zone_long}-${zone_lat}`, shot_x, shot_y };
}

// Own-half mode: detect team based on which half clicked (defensive half = own half of shooter)
function detectOwnHalfTeam(x, team_A_side) {
  const click_left_half = x < 0.5;
  if (click_left_half) return team_A_side === 'left' ? 'A' : 'B';
  return team_A_side === 'right' ? 'A' : 'B';
}

// Physical click + team + sides → attacker-relative coords. Used for own-half (shot_x is negative).
function physicalToAttacker(px, py, team_slot, team_A_side) {
  const A_attacks_right = team_A_side === 'left';
  const shooter_attacks_right =
    (team_slot === 'A' && A_attacks_right) ||
    (team_slot === 'B' && !A_attacks_right);
  const shot_x = shooter_attacks_right ? (px - 0.5) * 2 : (0.5 - px) * 2;
  const shot_y = shooter_attacks_right ? py : (1 - py);
  return { shot_x, shot_y };
}

// Attacker-relative → physical for current sides (used to render markers).
function attackerToPhysical(shot_x, shot_y, team_slot, team_A_side) {
  const A_attacks_right = team_A_side === 'left';
  const shooter_attacks_right =
    (team_slot === 'A' && A_attacks_right) ||
    (team_slot === 'B' && !A_attacks_right);
  const physical_x = shooter_attacks_right ? (0.5 + shot_x * 0.5) : (0.5 - shot_x * 0.5);
  const physical_y = shooter_attacks_right ? shot_y : (1 - shot_y);
  return { physical_x, physical_y };
}

// Stats / aggregations / period helpers. All read DATA, no mutation.

function computeScore(matchId) {
  const match = DATA.scheduledMatches.find(m => String(m.id) === String(matchId));
  if (!match) return { A: 0, B: 0 };
  const events = DATA.events.filter(e => String(e.match_id) === String(matchId) && e.result === 'gol');
  let A = 0, B = 0;
  events.forEach(e => {
    if (e.team_event === match.team_A) A++;
    else if (e.team_event === match.team_B) B++;
  });
  return { A, B };
}

function nextPeriod(current) {
  if (current === '1') return '2';
  if (current === '2') return '3';
  if (current === '3') return '4';
  if (current === '4') return 'OT1';
  const m = current.match(/^OT(\d+)$/);
  if (m) return 'OT' + (parseInt(m[1]) + 1);
  return current;
}

function periodLabel(p) {
  if (!p) return '?';
  p = String(p);
  if (p === 'OT1') return 'Dogrywka 1';
  if (p.startsWith('OT')) return 'Dogrywka ' + p.slice(2);
  return 'Q' + p;
}

function getPeriodOrder(p) {
  if (!p) return 999;
  p = String(p);
  if (p.startsWith('OT')) return 4 + parseInt(p.slice(2));
  return parseInt(p);
}

function teamSlot(matchId, teamName) {
  const m = DATA.scheduledMatches.find(x => String(x.id) === String(matchId));
  if (!m) return '';
  if (teamName === m.team_A) return 'A';
  if (teamName === m.team_B) return 'B';
  return '';
}

function eventsForMatch(matchId) {
  return DATA.events
    .filter(e => String(e.match_id) === String(matchId))
    .sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
}

function computeTeamStats(matchId, teamName, events) {
  const teamEvents = events.filter(e => e.team_event === teamName);
  const total      = teamEvents.length;
  const goals      = teamEvents.filter(e => e.result === 'gol').length;
  const saves      = teamEvents.filter(e => e.result === 'celny').length;     // strzały obronione (per A.4: także trafienia w słupek)
  const onTarget   = teamEvents.filter(e => e.result === 'celny' || e.result === 'gol').length;
  const offTarget  = teamEvents.filter(e => e.result === 'niecelny').length;
  return {
    total, goals, saves, onTarget, offTarget,
    goalRate:     total > 0 ? (goals    / total * 100).toFixed(1) : '—',
    onTargetRate: total > 0 ? (onTarget / total * 100).toFixed(1) : '—'
  };
}

function computeGoalieStats(match, allEvents) {
  // Goalkeeper of team X faces shots from the opposing team.
  // Saves = opponent's "celny" (per A.4: includes posts).
  // Goals against = opponent's "gol".
  function statsForGoalie(shotsFaced) {
    const saves        = shotsFaced.filter(e => e.result === 'celny').length;
    const goalsAgainst = shotsFaced.filter(e => e.result === 'gol').length;
    const shotsOnGoal  = saves + goalsAgainst;
    return {
      saves, goalsAgainst, shotsOnGoal,
      savePct: shotsOnGoal > 0 ? (saves / shotsOnGoal * 100).toFixed(1) : '—'
    };
  }
  return {
    A: statsForGoalie(allEvents.filter(e => e.team_event === match.team_B)),
    B: statsForGoalie(allEvents.filter(e => e.team_event === match.team_A))
  };
}

function computePerPeriodStats(matchId, match) {
  const events = DATA.events.filter(e => String(e.match_id) === String(matchId));
  const periods = new Set();
  events.forEach(e => { if (e.period !== undefined && e.period !== '') periods.add(String(e.period)); });
  const sorted = Array.from(periods).sort((a, b) => getPeriodOrder(a) - getPeriodOrder(b));
  return sorted.map(p => {
    const periodEvents = events.filter(e => String(e.period) === p);
    const A_shots = periodEvents.filter(e => e.team_event === match.team_A).length;
    const A_goals = periodEvents.filter(e => e.team_event === match.team_A && e.result === 'gol').length;
    const B_shots = periodEvents.filter(e => e.team_event === match.team_B).length;
    const B_goals = periodEvents.filter(e => e.team_event === match.team_B && e.result === 'gol').length;
    return { period: p, A_shots, A_goals, B_shots, B_goals };
  });
}

function applyViewerFilters(events, viewer) {
  let filtered = events;
  if (viewer.filter_period !== 'all') filtered = filtered.filter(e => String(e.period) === viewer.filter_period);
  if (viewer.filter_result !== 'all') filtered = filtered.filter(e => e.result === viewer.filter_result);
  return filtered;
}

function go(screen, opts) {
  opts = opts || {};
  if (APP.refreshInterval) {
    clearInterval(APP.refreshInterval);
    APP.refreshInterval = null;
  }
  APP.screen      = screen;
  APP.matchId     = opts.matchId || null;
  APP.modal       = null;
  APP.banner      = null;
  APP.match       = null;
  APP.viewer      = null;
  APP.homeLoading = false;
  APP.homeError   = null;
  APP.matchLoading = false;
  APP.viewerLoading = false;
  APP.viewerError   = null;
  APP.lastViewerRefresh = null;
  APP.adminLoading     = false;
  APP.adminError       = null;
  APP.analyticsLoading  = false;
  APP.analyticsError    = null;
  APP.standingsLoading  = false;
  APP.standingsError    = null;

  if (screen === 'home') {
    loadHomeData();                              // async — renderuje sam gdy gotowe
  } else if (screen === 'match-input' && opts.matchId) {
    APP.match = _initMatchState();
    loadMatchEvents(opts.matchId);               // async — renderuje sam gdy gotowe
  } else if (screen === 'match-viewer' && opts.matchId) {
    APP.viewer = initViewerSession();
    startViewerRefresh();
  } else if (screen === 'admin') {
    loadAdminData();                             // pełna lista meczów + turnieje
  } else if (screen === 'analytics') {
    loadAnalyticsData();
  } else if (screen === 'standings') {
    loadStandingsData();
  }
  render();
}

function goHome()                 { go('home'); }

    if (e.code === 'DEV_MODE') {
      // Lokalny dev — wczytaj SAMPLE_DATA dla tego meczu
      var sampleForMatch = SAMPLE_DATA.events.filter(
        ev => String(ev.match_id) === String(matchId)
      );
      DATA.events = DATA.events.filter(ev => String(ev.match_id) !== String(matchId));
      DATA.events = DATA.events.concat(sampleForMatch);

      // Zmień status w SAMPLE_DATA (tylko lokalnie)
      const match = DATA.scheduledMatches.find(m => String(m.id) === String(matchId));

// ── Viewer refresh ─────────────────────────────────────────────────────────────

function startViewerRefresh() {
  // Wyczyść poprzedni interval (np. przy retry)
  if (APP.refreshInterval) {
    clearInterval(APP.refreshInterval);
    APP.refreshInterval = null;
  }
  const matchId = APP.matchId;

  // Pomocnicza — jeden cykl odświeżenia eventów
  async function doRefresh(isFirst) {
    if (APP.screen !== 'match-viewer') return;
    try {
      const events = await gasListEventsForMatch(matchId);
      DATA.events = DATA.events.filter(e => String(e.match_id) !== String(matchId));
      DATA.events = DATA.events.concat(events || []);
      APP.lastViewerRefresh = new Date();
      if (isFirst) {
        APP.viewerLoading = false;
        APP.viewerError   = null;
      }
      APP.refreshFlash = true;
      render();
      setTimeout(function () {
        APP.refreshFlash = false;
        if (APP.screen === 'match-viewer') render();
      }, 600);
    } catch (e) {
      if (e.code === 'DEV_MODE') {
        // Lokalny dev — SAMPLE_DATA już załadowane, viewer działa normalnie
        APP.viewerLoading = false;
        APP.viewerError   = null;
        APP.lastViewerRefresh = new Date();
      } else {
        if (isFirst) {
          APP.viewerLoading = false;
          APP.viewerError = e.message || 'Błąd ładowania danych meczu';
        } else {
          // Milcząca awaria kolejnych odświeżeń — nie nadpisuj wyświetlonych danych
          console.warn('viewer refresh error:', e.message);
        }
      }
      if (isFirst) render();
    }
  }

  // Natychmiastowy pierwszy fetch (viewer od razu pokazuje loader)
  APP.viewerLoading = true;
  APP.viewerError   = null;
  doRefresh(true);

  // Cykliczne odświeżanie co 10s (zmniejsza zużycie limitów GAS o ~50% vs poprzednie 5s)
  APP.refreshInterval = setInterval(function () { doRefresh(false); }, 10000);
}

// ── Retry queue (krok 8) ──────────────────────────────────────────────────────

const RETRY_DELAYS = [1000, 3000, 9000]; // ms: próba 1, 2, 3

/**
 * Planuje ponowną próbę wysłania eventu do GAS z exponential backoff.
 * @param {string} clientEventId — identyfikator eventu w DATA.events
 * @param {object} evPayload     — oryginalny payload do wysłania (bez _syncing/_syncError)
 * @param {number} attempt       — 1-indexed (1 = pierwsza ponowna próba)
 */
function _scheduleRetry(clientEventId, evPayload, attempt) {
  if (attempt > RETRY_DELAYS.length) return;
  const delay = RETRY_DELAYS[attempt - 1];

  setTimeout(async function () {
    const idx = DATA.events.findIndex(e => e.client_event_id === clientEventId);
    if (idx < 0) return;  // event usunięty przez usera

    DATA.events[idx] = Object.assign({}, DATA.events[idx], {
      _syncing:   true,
      _syncError: null,
    });
    render();

    try {
      const result = await gasSaveEvent(evPayload);
      const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
      if (i >= 0) {
        DATA.events[i] = Object.assign({}, DATA.events[i], {
          id:         result.id,
          _syncing:   false,
          _syncError: null,
        });
        removeFromOfflineBuffer(clientEventId);
      }
      render();
    } catch (err) {
      if (err.code === 'DEV_MODE') {
        const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
        if (i >= 0) DATA.events[i] = Object.assign({}, DATA.events[i], { _syncing: false });
        render();
        return;
      }
      const i = DATA.events.findIndex(e => e.client_event_id === clientEventId);
      if (i >= 0) {
        if (attempt < RETRY_DELAYS.length) {
          DATA.events[i] = Object.assign({}, DATA.events[i], {
            _syncing:   false,
            _syncError: 'Ponawianie ' + (attempt + 1) + '/' + RETRY_DELAYS.length + '…',
          });
          _scheduleRetry(clientEventId, evPayload, attempt + 1);
        } else {
          // Wszystkie próby wyczerpane — czeka na ręczny retry
          DATA.events[i] = Object.assign({}, DATA.events[i], {
            _syncing:   false,
            _syncError: err.message || 'Błąd zapisu — wyślij ponownie',
          });
        }
      }
      render();
    }
  }, delay);
}

// ── Event CRUD — optimistic updates + async GAS ────────────────────────────────

/**
 * Zapisuje nowy event.
 * Sync: dodaje do DATA.events z _syncing:true.
 * Async: wysyła do GAS, aktualizuje id na numeryczny (lub oznacza _syncError).
 * NIE wywołuje render() — robi to handler po powrocie tej funkcji.
 */
async function recordEvent(eventData) {
  const match = DATA.scheduledMatches.find(m => String(m.id) === String(APP.matchId));
  if (!match) return;

  const clientEventId = uuid();
  const ev = Object.assign({
    id:              clientEventId,    // tymczasowy UUID; GAS nadaje numeryczny
    client_event_id: clientEventId,
    match_id:        match.id,
    tournament:      match.tournament,
    team_A:          match.team_A,
    team_B:          match.team_B,
    match_date:      match.match_date,
    period:          APP.match.period,
    created_at:      Date.now(),
    _syncing:        true,
    _syncError:      null,
  }, eventData);

  // Optimistic add (synchroniczny)
  DATA.events.push(ev);
  // Handler wywoła render() zaraz po recordEvent()

  // Walidacja kliencka przed GAS (synchroniczna — brak await, działa przed yield)
  const validationError = validateEventPayload(ev);
  if (validationError) {
    const vi = DATA.events.findIndex(ex => ex.client_event_id === clientEventId);
    if (vi >= 0) {
      DATA.events[vi] = Object.assign({}, DATA.events[vi], {
        _syncing:   false,
        _syncError: 'Błąd walidacji: ' + validationError,
      });
    }
    // render() wywoła handler — zwracamy bez retry
    return;
  }

  // Async GAS call
  try {
    const result = await gasSaveEvent(ev);
    // Zaktualizuj numeryczne ID nadane przez GAS
    const idx = DATA.events.findIndex(e => e.client_event_id === clientEventId);
    if (idx >= 0) {
      DATA.events[idx] = Object.assign({}, DATA.events[idx], {
        id:         result.id,
        _syncing:   false,
        _syncError: null,
      });
    }
  } catch (e) {
    if (e.code !== 'DEV_MODE') {
      // Dodaj do offline buffer natychmiast (bezpieczne — dedup po client_event_id)
      addToOfflineBuffer(ev);
      // Oznacz jako "ponawianie" i zaplanuj retry z backoff
      const idx = DATA.events.findIndex(ex => ex.client_event_id === clientEventId);
      if (idx >= 0) {
        DATA.events[idx] = Object.assign({}, DATA.events[idx], {
          _syncing:   false,
          _syncError: 'Ponawianie 1/' + RETRY_DELAYS.length + '…',
        });
      }
      _scheduleRetry(clientEventId, ev, 1);
    } else {
      // DEV_MODE: potraktuj jak sukces (id pozostaje UUID)
      const idx = DATA.events.findIndex(ex => ex.client_event_id === clientEventId);
      if (idx >= 0) DATA.events[idx] = Object.assign({}, DATA.events[idx], { _syncing: false });
    }
  }
  render();  // re-render po GAS response (aktualizacja stanu sync)
}

/**
 * Usuwa event po id (UUID tymczasowy lub numeryczny GAS).
 * Optimistic: natychmiast usuwa z DATA.events.
 * Async: wywołuje gasDeleteEvent gdy event był już potwierdzony przez GAS.
 * NIE wywołuje render() — robi to handler.
 */
async function deleteEvent(id) {
  const ev = DATA.events.find(e => String(e.id) === String(id));
  if (!ev) return;

  // Optimistic remove (synchroniczny)
  DATA.events = DATA.events.filter(e => String(e.id) !== String(id));

  // Jeśli event jeszcze nie potwierdził GAS (UUID tymczasowe) — koniec
  const hasGasId = !ev._syncing && !ev._syncError &&
                   String(ev.id) !== ev.client_event_id &&
                   !isNaN(Number(ev.id));
  if (!hasGasId) return;

  try {
    await gasDeleteEvent(ev.id);
  } catch (e) {
    if (e.code !== 'DEV_MODE') {
      APP.banner = { type: 'error', msg: 'Błąd usunięcia eventu: ' + (e.message || e) };
      render();
    }
  }
}

/**
 * Aktualizuje pola eventu po id.
 * Optimistic: aktualizuje DATA.events natychmiast.
 * Async: wysyła pełny obiekt do GAS.
 * NIE wywołuje render() — robi to handler.
 */
async function updateEvent(id, updates) {
  const idx = DATA.events.findIndex(e => String(e.id) === String(id));
  if (idx < 0) return;

  const oldEv = DATA.events[idx];
  const newEv = Object.assign({}, oldEv, updates, { _syncing: true, _syncError: null });
  DATA.events[idx] = newEv;

  // Walidacja kliencka przed GAS
  const updateValidationError = validateEventPayload(newEv);
  if (updateValidationError) {
    DATA.events[idx] = Object.assign({}, DATA.events[idx], {
      _syncing:   false,
      _syncError: 'Błąd walidacji: ' + updateValidationError,
    });
    render();
    return;
  }

  // Jeśli event jeszcze nie potwierdził GAS — zaktualizuj tylko lokalnie
  const hasGasId = !oldEv._syncError &&
                   String(oldEv.id) !== oldEv.client_event_id &&
                   !isNaN(Number(oldEv.id));
  if (!hasGasId) {
    DATA.events[idx] = Object.assign({}, DATA.events[idx], { _syncing: false });
    return;
  }

  try {
    await gasUpdateEvent(oldEv.id, newEv);
    DATA.events[idx] = Object.assign({}, DATA.events[idx], { _syncing: false, _syncError: null });
  } catch (e) {
    if (e.code !== 'DEV_MODE') {
      DATA.events[idx] = Object.assign({}, DATA.events[idx], {
        _syncing:   false,
        _syncError: e.message || 'Błąd aktualizacji'
      });
    } else {
      DATA.events[idx] = Object.assign({}, DATA.events[idx], { _syncing: false });
    }
  }
  render();
}

// ==================== INPUT MODE FIELD ====================

function buildFieldSvg(match) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'field');
  svg.setAttribute('id', 'field-svg');
  svg.setAttribute('viewBox', '0 0 1100 700');
  svg.setAttribute('xmlns', ns);

  // Side labels (top strip 50px)
  const A_left = APP.match.team_A_side === 'left';
  const sideLabels = svgEl('g');
  const leftLabel = svgEl('text', {
    x: 100, y: 35, 'font-size': 22, 'font-weight': 700,
    fill: A_left ? '#1d4ed8' : '#b91c1c'
  });
  leftLabel.textContent = `${A_left ? match.team_A : match.team_B} →`;
  sideLabels.appendChild(leftLabel);
  const rightLabel = svgEl('text', {
    x: 1000, y: 35, 'text-anchor': 'end',
    'font-size': 22, 'font-weight': 700,
    fill: A_left ? '#b91c1c' : '#1d4ed8'
  });
  rightLabel.textContent = `← ${A_left ? match.team_B : match.team_A}`;
  sideLabels.appendChild(rightLabel);
  svg.appendChild(sideLabels);

  const fieldG = svgEl('g', { transform: 'translate(0, 50)' });
  fieldG.appendChild(svgEl('rect', { x: 0, y: 0, width: 1100, height: 600, fill: '#9bbf85' }));

  // Zone overlay (toggleable)
  if (APP.match.show_zones) {
    const zonesG = svgEl('g', { class: 'zone-overlay' });
    getZoneLayout().forEach(z => {
      const team = getTeamForHalf(z.half, APP.match.team_A_side);
      const color = ZONE_COLORS[`${team}-${z.zone}`] || '#888';
      zonesG.appendChild(svgEl('rect', {
        x: z.x, y: z.y, width: z.w, height: z.h, fill: color, class: 'zone-rect'
      }));
      const t = svgEl('text', {
        x: z.x + z.w / 2, y: z.y + z.h / 2 + 12, class: 'zone-label-team'
      });
      t.textContent = team;
      zonesG.appendChild(t);
    });
    fieldG.appendChild(zonesG);
  }

  // Field markings
  const markings = svgEl('g');
  markings.innerHTML = `
    <line x1="550" y1="0" x2="550" y2="600" stroke="white" stroke-width="2"/>
    <line x1="540" y1="290" x2="560" y2="310" stroke="white" stroke-width="2"/>
    <line x1="540" y1="310" x2="560" y2="290" stroke="white" stroke-width="2"/>
    <line x1="150" y1="0" x2="150" y2="600" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="950" y1="0" x2="950" y2="600" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="350" y1="0" x2="350" y2="600" stroke="white" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.85"/>
    <line x1="750" y1="0" x2="750" y2="600" stroke="white" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.85"/>
    <rect x="0" y="0" width="1100" height="600" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="150" cy="300" r="30" fill="#9bbf85" stroke="white" stroke-width="2"/>
    <circle cx="950" cy="300" r="30" fill="#9bbf85" stroke="white" stroke-width="2"/>
    <line x1="150" y1="288" x2="150" y2="312" stroke="white" stroke-width="5"/>
    <line x1="950" y1="288" x2="950" y2="312" stroke="white" stroke-width="5"/>
  `;
  fieldG.appendChild(markings);

  // Markers (history dots) — convert attacker-relative to physical
  const markersG = svgEl('g');
  const events = eventsForMatch(match.id);
  events.forEach((e, i) => {
    const teamSlotName = teamSlot(match.id, e.team_event);
    const { physical_x, physical_y } = attackerToPhysical(e.shot_x, e.shot_y, teamSlotName, APP.match.team_A_side);
    const sx = physical_x * 1100;
    const sy = physical_y * 600;
    const isLatest = i === 0;
    const fillColor = teamSlotName === 'A' ? '#1d4ed8' : '#b91c1c';
    const isOwnHalf = e.zone_name === 'own-half';
    const isGoal = e.result === 'gol';
    const dot = svgEl('circle', {
      cx: sx, cy: sy,
      r: isLatest ? 11 : 7,
      fill: isGoal ? fillColor : 'transparent',
      stroke: isOwnHalf ? '#ca8a04' : (isGoal ? 'white' : fillColor),
      'stroke-width': isLatest ? (isOwnHalf ? 4 : 3) : (isOwnHalf ? 3 : 2),
      class: 'marker' + (isLatest ? ' latest' : '')
    });
    markersG.appendChild(dot);
  });
  fieldG.appendChild(markersG);

  drawZoneLabels(fieldG, APP.match.team_A_side);

  svg.appendChild(fieldG);
  svg.addEventListener('click', handleFieldClick);
  return svg;
}

function handleFieldClick(ev) {
  const svg = ev.currentTarget;
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const svgPt = pt.matrixTransform(ctm.inverse());
  const fieldY = svgPt.y - 50;
  if (fieldY < 0 || fieldY > 600) return;
  const x = svgPt.x / 1100;
  const y = fieldY / 600;
  if (x < 0 || x > 1) return;

  const match = DATA.scheduledMatches.find(m => m.id === APP.matchId);
  if (!match) return;

  if (APP.match.own_half_mode === 'active') {
    const teamSlotChosen = detectOwnHalfTeam(x, APP.match.team_A_side);
    const teamName = teamSlotChosen === 'A' ? match.team_A : match.team_B;
    const { shot_x, shot_y } = physicalToAttacker(x, y, teamSlotChosen, APP.match.team_A_side);
    APP.match.own_half_mode = null;
    APP.banner = null;
    APP.modal = {
      type: 'result',
      pending: {
        shot_x, shot_y,
        team_event: teamName, team_slot: teamSlotChosen,
        zone_name: 'own-half'
      }
    };
    render();
    return;
  }

  const det = detectZone(x, y, APP.match.team_A_side);
  const teamName = det.team === 'A' ? match.team_A : match.team_B;
  APP.modal = {
    type: 'result',
    pending: {
      shot_x: det.shot_x, shot_y: det.shot_y,
      team_event: teamName, team_slot: det.team,
      zone_name: det.zone
    }
  };
  render();
}

// ==================== VIEWER MODE CHARTS ====================

function buildViewerChart(match, filtered) {
  const v = APP.viewer;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'field');
  svg.setAttribute('xmlns', ns);

  if (v.view_mode === 'full') {
    svg.setAttribute('viewBox', '0 0 1100 700');
    drawFullFieldChart(svg, match, filtered, v);
  } else {
    svg.setAttribute('viewBox', '0 0 540 660');
    svg.setAttribute('class', 'field field-half');
    drawHalfFieldChart(svg, match, filtered, v);
  }
  return svg;
}

function drawFullFieldChart(svg, match, filtered, viewer) {
  const sideLabels = svgEl('g');
  const lLab = svgEl('text', { x: 100, y: 35, 'font-size': 22, 'font-weight': 700, fill: '#1d4ed8' });
  lLab.textContent = `${match.team_A} →`;
  sideLabels.appendChild(lLab);
  const rLab = svgEl('text', { x: 1000, y: 35, 'text-anchor': 'end', 'font-size': 22, 'font-weight': 700, fill: '#b91c1c' });
  rLab.textContent = `← ${match.team_B}`;
  sideLabels.appendChild(rLab);
  const note = svgEl('text', { x: 550, y: 35, 'text-anchor': 'middle', 'font-size': 11, fill: '#999' });
  note.textContent = 'widok kanoniczny — A zawsze po lewej';
  sideLabels.appendChild(note);
  svg.appendChild(sideLabels);

  const fieldG = svgEl('g', { transform: 'translate(0, 50)' });
  drawFieldMarkings(fieldG, 1100, 600);
  drawShotsFullField(fieldG, filtered, match, viewer.display_mode);
  drawZoneLabels(fieldG, 'left');  // canonical viewer: A always attacks right
  svg.appendChild(fieldG);
}

function drawHalfFieldChart(svg, match, filtered, viewer) {
  const teamSlot_ = viewer.view_mode === 'half-A' ? 'A' : 'B';
  const teamName  = teamSlot_ === 'A' ? match.team_A : match.team_B;
  const teamColor = teamSlot_ === 'A' ? '#1d4ed8'   : '#b91c1c';
  const teamShots = filtered.filter(e => e.team_event === teamName);

  // Portrait orientation: attack axis goes upward, goal at the top.
  // viewBox: 540 wide × 660 tall (50px title strip + 600 tall field + 10px buffer).
  const title = svgEl('text', { x: 270, y: 28, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: teamColor });
  title.textContent = `${teamName} — atak ↑ (bramka u góry)`;
  svg.appendChild(title);

  const fieldG = svgEl('g', { transform: 'translate(0, 50)' });
  // Half-field 540 wide × 600 tall (one offensive half, goal at top).
  fieldG.appendChild(svgEl('rect', { x: 0, y: 0, width: 540, height: 600, fill: '#9bbf85' }));
  // Center line at the bottom (where attack starts).
  fieldG.appendChild(svgEl('line', { x1: 0, y1: 600, x2: 540, y2: 600, stroke: 'white', 'stroke-width': 3 }));
  // Restraining line (attacker_progress 0.4368 → cy = (1 − 0.4368) × 600 ≈ 337.92).
  fieldG.appendChild(svgEl('line', { x1: 0, y1: 337.92, x2: 540, y2: 337.92, stroke: 'white', 'stroke-width': 1.5, 'stroke-dasharray': '6,4', opacity: 0.85 }));
  // Goal line (attacker_progress 40/55 ≈ 0.7273 → cy ≈ 163.64).
  fieldG.appendChild(svgEl('line', { x1: 0, y1: 163.64, x2: 540, y2: 163.64, stroke: 'white', 'stroke-width': 1.5, opacity: 0.7 }));
  // End line at the top.
  fieldG.appendChild(svgEl('line', { x1: 0, y1: 0, x2: 540, y2: 0, stroke: 'white', 'stroke-width': 3 }));
  // Side lines (left and right).
  fieldG.appendChild(svgEl('line', { x1: 0,   y1: 0, x2: 0,   y2: 600, stroke: 'white', 'stroke-width': 3 }));
  fieldG.appendChild(svgEl('line', { x1: 540, y1: 0, x2: 540, y2: 600, stroke: 'white', 'stroke-width': 3 }));
  // Crease + goal mouth at the goal line.
  fieldG.appendChild(svgEl('circle', { cx: 270, cy: 163.64, r: 27, fill: '#9bbf85', stroke: 'white', 'stroke-width': 2 }));
  fieldG.appendChild(svgEl('line',   { x1: 258, y1: 163.64, x2: 282, y2: 163.64, stroke: 'white', 'stroke-width': 5 }));

  // Plot only shots with shot_x ≥ 0 (skip own-half).
  // Rotation mapping: attacker shot_x (0→1, center→end) → cy = (1 − shot_x) × 600 (bottom→top).
  //                   attacker shot_y (0→1, attacker-left→right) → cx = shot_y × 540.
  const chartShots = teamShots.filter(e => e.shot_x >= 0);
  chartShots.forEach(e => {
    const cx = e.shot_y * 540;
    const cy = (1 - e.shot_x) * 600;
    if (viewer.display_mode === 'heatmap') drawHeatBlob(fieldG, cx, cy, teamColor);
    else                                    drawShotMarker(fieldG, cx, cy, teamColor, e.result, false);
  });

  svg.appendChild(fieldG);
}

function drawFieldMarkings(g, w, h) {
  g.appendChild(svgEl('rect',   { x: 0, y: 0, width: w, height: h, fill: '#9bbf85' }));
  g.appendChild(svgEl('line',   { x1: w / 2, y1: 0, x2: w / 2, y2: h, stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('line',   { x1: w / 2 - 10, y1: h / 2 - 10, x2: w / 2 + 10, y2: h / 2 + 10, stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('line',   { x1: w / 2 - 10, y1: h / 2 + 10, x2: w / 2 + 10, y2: h / 2 - 10, stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('line',   { x1: w * 150 / 1100, y1: 0, x2: w * 150 / 1100, y2: h, stroke: 'white', 'stroke-width': 1.5, opacity: 0.7 }));
  g.appendChild(svgEl('line',   { x1: w * 950 / 1100, y1: 0, x2: w * 950 / 1100, y2: h, stroke: 'white', 'stroke-width': 1.5, opacity: 0.7 }));
  g.appendChild(svgEl('line',   { x1: w * 350 / 1100, y1: 0, x2: w * 350 / 1100, y2: h, stroke: 'white', 'stroke-width': 1.5, 'stroke-dasharray': '6,4', opacity: 0.85 }));
  g.appendChild(svgEl('line',   { x1: w * 750 / 1100, y1: 0, x2: w * 750 / 1100, y2: h, stroke: 'white', 'stroke-width': 1.5, 'stroke-dasharray': '6,4', opacity: 0.85 }));
  g.appendChild(svgEl('rect',   { x: 0, y: 0, width: w, height: h, fill: 'none', stroke: 'white', 'stroke-width': 3 }));
  g.appendChild(svgEl('circle', { cx: w * 150 / 1100, cy: h / 2, r: 30, fill: '#9bbf85', stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('circle', { cx: w * 950 / 1100, cy: h / 2, r: 30, fill: '#9bbf85', stroke: 'white', 'stroke-width': 2 }));
  g.appendChild(svgEl('line',   { x1: w * 150 / 1100, y1: h / 2 - 12, x2: w * 150 / 1100, y2: h / 2 + 12, stroke: 'white', 'stroke-width': 5 }));
  g.appendChild(svgEl('line',   { x1: w * 950 / 1100, y1: h / 2 - 12, x2: w * 950 / 1100, y2: h / 2 + 12, stroke: 'white', 'stroke-width': 5 }));
}

function drawShotsFullField(g, events, match, displayMode) {
  // Canonical orientation: A on left attacking right (team_A_side='left')
  events.forEach(e => {
    const slot = teamSlot(match.id, e.team_event);
    const color = slot === 'A' ? '#1d4ed8' : '#b91c1c';
    const { physical_x, physical_y } = attackerToPhysical(e.shot_x, e.shot_y, slot, 'left');
    const cx = physical_x * 1100;
    const cy = physical_y * 600;
    if (displayMode === 'heatmap') drawHeatBlob(g, cx, cy, color);
    else                            drawShotMarker(g, cx, cy, color, e.result, e.zone_name === 'own-half');
  });
}

function drawShotMarker(g, cx, cy, color, result, isOwnHalf) {
  const isGoal   = result === 'gol';
  const isMissed = result === 'niecelny';
  const strokeColor = isOwnHalf ? '#ca8a04' : color;

  if (isMissed) {
    const s = 5;
    g.appendChild(svgEl('line', { x1: cx - s, y1: cy - s, x2: cx + s, y2: cy + s, stroke: strokeColor, 'stroke-width': 2 }));
    g.appendChild(svgEl('line', { x1: cx + s, y1: cy - s, x2: cx - s, y2: cy + s, stroke: strokeColor, 'stroke-width': 2 }));
  } else {
    g.appendChild(svgEl('circle', {
      cx, cy, r: 7,
      fill: isGoal ? color : 'transparent',
      stroke: isOwnHalf ? '#ca8a04' : (isGoal ? 'white' : color),
      'stroke-width': 2
    }));
  }
}

// ── Etykiety stref A1–B6 (F-04) ──────────────────────────────────────────────

function drawZoneLabels(g, team_A_side) {
  const A_atk_right = team_A_side === 'left';
  // X-centers (SVG field coords, 1100px wide)
  // Attack/midfield boundary at shot_x=0.4368 → physical_x=0.7184 → 790px (right side)
  //                                                                  0.2816 → 310px (left side)
  const aAtckX = A_atk_right ? 945 : 155;  // center of attack zone for A
  const aMidX  = A_atk_right ? 670 : 430;  // center of midfield zone for A
  const bAtckX = A_atk_right ? 155 : 945;
  const bMidX  = A_atk_right ? 430 : 670;
  // Y-centers: left/center/right from attacker's POV
  // Attacking right: left=top(100), center=mid(300), right=bottom(500)
  // Attacking left:  left=bottom(500), center=mid(300), right=top(100)
  const aY = A_atk_right ? [100, 300, 500] : [500, 300, 100];
  const bY = A_atk_right ? [500, 300, 100] : [100, 300, 500];

  const items = [
    { l: 'A1', x: aAtckX, y: aY[0] }, { l: 'A2', x: aAtckX, y: aY[1] }, { l: 'A3', x: aAtckX, y: aY[2] },
    { l: 'A4', x: aMidX,  y: aY[0] }, { l: 'A5', x: aMidX,  y: aY[1] }, { l: 'A6', x: aMidX,  y: aY[2] },
    { l: 'B1', x: bAtckX, y: bY[0] }, { l: 'B2', x: bAtckX, y: bY[1] }, { l: 'B3', x: bAtckX, y: bY[2] },
    { l: 'B4', x: bMidX,  y: bY[0] }, { l: 'B5', x: bMidX,  y: bY[1] }, { l: 'B6', x: bMidX,  y: bY[2] },
  ];
  items.forEach(({ l, x, y }) => {
    const t = svgEl('text', {
      x, y, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 11, fill: '#9ca3af', 'pointer-events': 'none', 'font-weight': '600'
    });
    t.textContent = l;
    g.appendChild(t);
  });
}

// Home screen: lista meczy dzisiejszego dnia + przeszłe + przycisk ad-hoc.
// Dane ładowane async przez loadHomeData() w state.js.

function renderHome(root) {
  const today = todayISO();

  // ── Loading ──────────────────────────────────────────────────────────────────
  if (APP.homeLoading) {
    root.innerHTML = `
      <div class="app-header">
        <h1>Lacrosse Stats</h1>
        <span class="meta">${today}</span>
        <button class="btn" data-action="open-admin">📋 Turnieje</button>
        <button class="btn" data-action="open-analytics">📊 Analityka</button>
        <button class="btn" data-action="open-standings">🏆 Tabela</button>
        <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="Przełącz tryb ciemny">🌙</button>
      </div>
      <div class="home-content">
        <div class="loading-state">
          <div class="spinner">⏳</div>
          <p>Ładowanie meczy…</p>
        </div>
      </div>
    `;
    return;
  }

  // ── Error ────────────────────────────────────────────────────────────────────
  if (APP.homeError) {
    root.innerHTML = `
      <div class="app-header">
        <h1>Lacrosse Stats</h1>
        <span class="meta">${today}</span>
        <button class="btn" data-action="open-admin">📋 Turnieje</button>
        <button class="btn" data-action="open-analytics">📊 Analityka</button>
        <button class="btn" data-action="open-standings">🏆 Tabela</button>
        <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="Przełącz tryb ciemny">🌙</button>
      </div>
      <div class="home-content">
        <div class="error-state">
          <p>⚠ Błąd ładowania: ${escapeHtml(APP.homeError)}</p>
          <button class="btn btn-primary" data-action="home-retry">↺ Spróbuj ponownie</button>
        </div>
      </div>
    `;
    return;
  }

  // ── Loaded ───────────────────────────────────────────────────────────────────
  const todayMatches = DATA.scheduledMatches.filter(m => m.match_date === today);
  const pastMatches  = DATA.scheduledMatches
    .filter(m => m.match_date < today)
    .sort((a, b) => b.match_date.localeCompare(a.match_date));

  function renderMatchCard(m) {
    const score      = computeScore(m.id);
    const eventCount = DATA.events.filter(e => e.match_id === m.id).length;
    const isFinished = m.status === 'finished';
    const isLive     = m.status === 'live';
    return `
      <div class="match-card ${isFinished ? 'finished' : ''}">
        <div class="match-tournament">
          ${escapeHtml(m.tournament || '— brak turnieju —')}
          ${isLive ? ' <span class="badge-live">LIVE</span>' : ''}
        </div>
        <div class="match-teams">
          <span>${escapeHtml(m.team_A)}</span>
          ${eventCount > 0 || isFinished
            ? `<span class="match-score">${score.A} : ${score.B}</span>`
            : '<span class="vs">vs</span>'}
          <span>${escapeHtml(m.team_B)}</span>
        </div>
        <div class="match-meta">
          ${m.match_date}
          ${eventCount > 0 ? ` · ${eventCount} eventów` : ''}
        </div>
        <div class="match-actions">
          <button class="btn btn-primary"   data-action="open-match"  data-arg="${m.id}">${isFinished ? 'Otwórz' : 'Wpisuj statystyki'}</button>
          <button class="btn btn-secondary" data-action="open-viewer" data-arg="${m.id}">Tylko podgląd</button>
        </div>
      </div>
    `;
  }

  let html = `
    <div class="app-header">
      <h1>Lacrosse Stats</h1>
      <span class="meta">${today}</span>
      <button class="btn" data-action="open-admin">📋 Turnieje</button>
      <button class="btn" data-action="open-analytics">📊 Analityka</button>
      <button class="btn" data-action="open-standings">🏆 Tabela</button>
      <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="Przełącz tryb ciemny">🌙</button>
    </div>
    <div class="home-content">
      <h2>Mecze dzisiaj</h2>
  `;

  if (todayMatches.length === 0) {
    html += '<div class="empty">Brak meczy zaplanowanych na dziś.<br>Dodaj mecze w panelu Turniejów lub utwórz mecz ad-hoc.</div>';
  } else {
    html += '<div class="match-list">';
    todayMatches.forEach(m => { html += renderMatchCard(m); });
    html += '</div>';
  }

  if (pastMatches.length > 0) {
    html += '<h2 style="margin-top:1.5rem">Mecze z przeszłości</h2>';
    html += '<div class="match-list">';
    pastMatches.forEach(m => { html += renderMatchCard(m); });
    html += '</div>';
  }

  html += `<button class="add-match" data-action="ad-hoc">+ Nowy mecz ad-hoc</button></div>`;
  root.innerHTML = html;
}

    </div>
  `;

  // Inject SVG via DOM (innerHTML strips event handlers)
  document.getElementById('field-wrap').appendChild(buildFieldSvg(match));

function renderHistoryRow(e, match) {
  const slot  = teamSlot(match.id, e.team_event);
  const flags = [];
  if (e.man_up)                          flags.push('<span class="flag man-up">man-up</span>');
  if (e.man_down)                        flags.push('<span class="flag man-down">man-down</span>');
  if (e.assisted && e.result === 'gol') flags.push('<span class="flag assisted">asysta</span>');

  // Wskaźnik synchronizacji z GAS
  let syncBadge = '';
  let retryBtn  = '';
  if (e._syncing) {
    syncBadge = '<span class="sync-badge syncing" title="Zapisywanie…">⟳</span>';
  } else if (e._syncError) {
    syncBadge = `<span class="sync-badge error" title="${escapeHtml(e._syncError)}">⚠ ${escapeHtml(e._syncError)}</span>`;
    retryBtn  = `<button class="icon-btn retry" data-action="retry-event" data-arg="${escapeHtml(e.client_event_id)}" title="Wyślij ponownie">↻</button>`;
  }

  const rowClass = e._syncError ? 'history-row sync-error' : 'history-row';

  return `
    <div class="${rowClass}">
      <div class="period">${periodLabel(e.period)}</div>
      <div class="team-tag ${slot}">${slot}</div>
      <div class="result ${e.result}">${e.result}</div>
      <div class="zone${e.zone_name === 'own-half' ? ' own-half' : ''}">${e.zone_name}</div>
      <div class="flags">${flags.join('')}${syncBadge}</div>
      <div class="actions">
        ${retryBtn}
        <button class="icon-btn"        title="Edytuj" data-action="edit-event"   data-arg="${e.id}">✎</button>
        <button class="icon-btn delete" title="Usuń"   data-action="delete-event" data-arg="${e.id}">🗑</button>
      </div>
    </div>
  `;
}

// Match-viewer screen (read-only, trener): score banner, stats tables, shot chart with filters.

function renderMatchViewer(root) {

  if (!match) {
    root.innerHTML = '<div class="empty">Mecz nie znaleziony</div>';

  // ── Stan ładowania pierwszego fetchu ──────────────────────────────────────────

      </div>

  if (APP.viewerError) {
    root.innerHTML = `

  // Fix type mismatch: match_id z GAS może być liczbą lub stringiem
  const allEvents = DATA.events.filter(e => String(e.match_id) === String(match.id));

  const goalies   = computeGoalieStats(match, allEvents);
  const perPeriod = computePerPeriodStats(match.id, match);

  const periodSet = new Set();
  allEvents.forEach(e => { if (e.period !== undefined && e.period !== '') periodSet.add(String(e.period)); });
  const periodOptions = Array.from(periodSet).sort((a, b) => getPeriodOrder(a) - getPeriodOrder(b));

  const tagClass  = APP.refreshFlash ? 'refresh-tag refreshing' : 'refresh-tag';
  const tagLabel  = APP.refreshFlash ? 'Odświeżanie…' : _viewerRefreshLabel();

  root.innerHTML = `
    <div class="app-header">

      <button class="btn" data-action="toggle-dark-mode" id="theme-toggle" title="Przełącz tryb ciemny">🌙</button>
    </div>

        <span class="sep">:</span>
        <span class="team-B-color">${score.B} ${escapeHtml(match.team_B)}</span>

      <div class="period">${match.status === 'live' ? '🔴 LIVE' : (match.status === 'finished' ? 'KONIEC' : 'PLANOWANY')}</div>
      <div class="tournament">${escapeHtml(match.tournament)}</div>

    </div>
    <div class="viewer-screen">
      <div class="viewer-section">

        ${renderViewerPerPeriodCard(perPeriod, match)}

  }

/** Formatuje etykietę refresh-tag z czasem ostatniego odświeżenia. */
function _viewerRefreshLabel() {
  if (!APP.lastViewerRefresh) return 'Ostatnia aktualizacja: —';
  const h = APP.lastViewerRefresh.getHours().toString().padStart(2, '0');
  const m = APP.lastViewerRefresh.getMinutes().toString().padStart(2, '0');
  const s = APP.lastViewerRefresh.getSeconds().toString().padStart(2, '0');
  return 'Ostatnia aktualizacja: ' + h + ':' + m + ':' + s;
}

function _splitBar(va, vb) {
  const na = typeof va === 'number' ? va : (parseFloat(va) || 0);
  const nb = typeof vb === 'number' ? vb : (parseFloat(vb) || 0);
  const total = na + nb;
  const pct = total > 0 ? Math.round(na / total * 100) : 50;
  return APP.splitBars
    ? `<tr class="split-bar-row"><td colspan="3"><div class="split-bar" style="--pct:${pct}%"></div></td></tr>`
    : '';
}

  const toggleLabel = APP.splitBars ? 'Ukryj bary' : 'Pokaż bary';

      <h3 style="display:flex;align-items:center;">
        Statystyki strzałów
        <button class="btn" data-action="toggle-split-bars" style="margin-left:auto;font-size:11px;padding:3px 8px;">${toggleLabel}</button>
      </h3>
      <table class="stats-table">
        <thead>
          <tr class="header-row">
            <th class="team-A">${escapeHtml(match.team_A)}</th>
            <th class="label" style="text-align:center;">&nbsp;</th>
            <th class="team-B">${escapeHtml(match.team_B)}</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="num team-A">${statsA.total}</td><td class="label" style="text-align:center;">strzały (łącznie)</td><td class="num team-B">${statsB.total}</td></tr>
          ${_splitBar(statsA.total, statsB.total)}

          ${_splitBar(statsA.offTarget, statsB.offTarget)}
          <tr class="summary-row"><td class="num team-A">${fmt(statsA.goalRate, true)}</td><td class="label" style="text-align:center;">% skuteczność (gole/strzały)</td><td class="num team-B">${fmt(statsB.goalRate, true)}</td></tr>

        </tbody>
      </table>
